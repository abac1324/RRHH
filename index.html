<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abac · Performance Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0e2150; --navy-2:#0a1838; --navy-3:#16285c;
  --ink:#13224e; --text:#2b3240; --muted:#6b7280; --faint:#9aa3b2;
  --line:#e7e9ee; --line-2:#eef0f3;
  --bg:#f5f6f8; --sidebar:#edeef1; --card:#ffffff; --cell:#f7f8fa;
  --teal:#0e9aab; --teal-soft:#e1f3f5;
  --red:#b41842; --red-soft:#fbe9ee;
  --blue:#3f86d6; --lightblue:#a9cdf4; --slate:#6c77a3;
  --ok:#0c7e8c; --ok-soft:#e1f3f5; --warn:#b7791f; --warn-soft:#fdf3dc; --bad:#b41842; --bad-soft:#fbe9ee;
  --info-soft:#e9ebf4; --info:#1c2c63;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(14,33,80,.04), 0 6px 18px rgba(14,33,80,.05);
  --shadow-sm:0 1px 2px rgba(14,33,80,.05);
  --c1:#0a1633; --c2:#1b3a7a; --c3:#5b9fe0; --c4:#9cc4ee; --c5:#cfe2f8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
/* Todo el lienzo al 80%, igual que el dashboard del Portfolio Hub, para que las dos apps se vean del mismo tamano
   con el zoom por defecto del navegador (Hugo, 23-sep-2026). El 125% compensa la escala: 125 x 0,8 = 100.
   Se usa transform y no zoom: zoom rompe las coordenadas del raton de Chart.js. */
body{display:flex;height:125vh;width:125%;transform:scale(.8);transform-origin:top left;overflow:hidden;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:var(--navy)}
/* ---------- Sidebar ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 18px 14px;height:100%;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:2px 4px 18px}
.brandlogo{width:184px;max-width:100%;height:auto;display:block}
.brand .bsub{color:var(--muted);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:14px 14px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#404654;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:#e3e5ea;color:var(--ink)}
.nav a.active{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(14,33,80,.22)}
.nav a .ic{width:20px;text-align:center;font-size:18px;line-height:1}
.nav a .badge{margin-left:auto;background:var(--teal);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700}
.nav a.active .badge{background:#fff;color:var(--navy)}
.nav a.locked{opacity:.45;cursor:not-allowed}
.nav a .lk{margin-left:auto;font-size:14px;color:var(--faint)}
.userbox{padding:14px 4px 4px;border-top:1px solid var(--line);margin-top:8px}
.userbox label{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px}
.userbox .uc{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.userbox .uc-av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.userbox .uc-name{font-weight:700;color:var(--ink);font-size:13.5px;line-height:1.15}
.userbox .uc-role{font-size:11.5px;color:var(--muted);margin-top:2px}
.userbox select{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-family:inherit;font-weight:600}
.userbox .role{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:74px;display:flex;align-items:center;gap:18px;padding:0 34px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.yearbadge{display:flex;flex-direction:column;align-items:flex-end;line-height:1;margin-right:14px}
.yearbadge .y{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.yearbadge .c{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap}
@media(max-width:700px){.yearbadge .y{font-size:22px}.yearbadge .c{display:none}}
.topbar h1{font-weight:700;color:var(--ink);font-size:18px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.topbar .sp{flex:1}
.topbar .search{border:1px solid var(--line);border-radius:11px;padding:9px 13px 9px 36px;font-size:13.5px;width:280px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='10' cy='10' r='7'/><path d='m21 21-6-6'/></svg>") 12px center no-repeat;font-family:inherit;color:var(--ink)}
.search:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,33,80,.10)}
.content{flex:1;overflow-y:auto;padding:28px 34px 10px;min-height:0}
.footer{border-top:1px solid var(--line);padding:16px 34px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--bg)}
.footer .fl{font-size:12px;color:var(--muted)}
.footer .fl .svi{font-weight:800;color:var(--ink);display:block;margin-top:3px;letter-spacing:.02em;font-size:11.5px}
.footer .fr{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
/* ---------- Botones y píldoras ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;font-family:inherit;transition:border-color .15s,background .15s}
.btn:hover{border-color:#c7cdd9;background:#fbfbfc}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 16px rgba(14,33,80,.18)}
.btn.pri:hover{background:var(--navy-3)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn i{font-size:15px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--info-soft);color:var(--info);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:#eef0f3;color:#59657a}.pill.pur{background:#ecebf6;color:#4b4a8f}.pill.navy{background:var(--navy);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:11.5px;font-weight:600;color:var(--ink)}
.chip .avatar{width:20px;height:20px;font-size:8.5px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:#eef0f3;color:#59657a;margin-left:6px}
/* ---------- Layout ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g32{grid-template-columns:3fr 2fr}.g23{grid-template-columns:2fr 3fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1200px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g32,.g23,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.card h3{margin:0 0 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.3}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;display:flex;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:5px}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .d{font-size:11px;color:var(--ok);font-weight:600}
.kpi .d.neg{color:var(--bad)}
.acts{display:flex;flex-direction:column;gap:12px}.acts>div{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.acts .btn{min-width:270px;justify-content:flex-start}.acts .xs{flex:1;min-width:180px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;letter-spacing:.02em}
.avatar.lg{width:64px;height:64px;font-size:21px}
.avatar.sm{width:26px;height:26px;font-size:10px}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--muted)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:700}
.hd{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
/* ---------- Tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:#fbfcff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.heat td{text-align:center;font-weight:700;font-size:12.5px}
/* ---------- Componentes ---------- */
.bar{height:7px;background:#e9edf3;border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--navy);border-radius:6px}
.bar.ok>span{background:var(--teal)}.bar.warn>span{background:var(--warn)}
.steps{display:flex;align-items:center;margin:8px 0 16px}
.step{flex:1;text-align:center;font-size:11.5px;position:relative;color:var(--faint);font-weight:500}
.step .dot{width:26px;height:26px;border-radius:50%;background:#e3e6ec;margin:0 auto 6px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);border:2px solid #fff;position:relative;z-index:1}
.step.done .dot{background:var(--teal);color:#fff}.step.cur .dot{background:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(14,33,80,.12)}
.step.done,.step.cur{color:var(--text)}
.step:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:#e3e6ec}
.step.done:after{background:var(--teal)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 16px}
.tl li:before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid #fff}
.tl li.hi:before{background:var(--teal)}
.tl .when{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab.active{color:var(--navy)}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--cell)}
.q .qt{font-weight:700;margin-bottom:8px;font-size:13.5px;color:var(--ink)}
.scale{display:flex;gap:6px;margin:8px 0}
.scale span{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--text)}
.scale span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scale span.ro{cursor:default}
textarea,input[type=text],input[type=date],select.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;background:#fff;color:var(--text)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,33,80,.08)}
textarea{min-height:72px;resize:vertical}
.ans{background:#fff;border-left:3px solid var(--blue);padding:9px 13px;border-radius:8px;font-size:13px;margin-top:6px}
.ans .who{font-size:10.5px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lock{background:var(--cell);border:1px dashed #cfd5df;border-radius:10px;padding:14px;color:var(--muted);font-size:12.5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.lock i{font-size:16px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.chk:last-child{border-bottom:none}
.chk input{margin-top:3px;accent-color:var(--navy)}
.chk.done label{text-decoration:line-through;color:var(--faint)}
.alert{border-radius:12px;padding:12px 16px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.info{background:var(--info-soft);color:var(--info)}.alert.warn{background:var(--warn-soft);color:#6f4f0a}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mat .cell{min-height:94px;border-radius:10px;padding:9px;font-size:11.5px;border:1px solid var(--line-2)}
.mat .cell .t{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
.mat .cell .pp{display:flex;flex-wrap:wrap;gap:4px}
.chartbox{position:relative;height:240px}
.chartbox.tall{height:320px}
.vis{display:grid;grid-template-columns:1.6fr repeat(4,1fr);font-size:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vis>div{padding:9px 10px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center}
.vis>div:nth-child(5n+1){justify-content:flex-start;text-align:left;background:var(--cell);font-weight:600;color:var(--ink)}
.vis>div:nth-child(-n+5){background:#fbfcff;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vis>div:nth-child(5n){border-right:none}
.y{color:var(--ok);font-weight:700}.n{color:var(--bad);font-weight:700}.p{color:var(--warn);font-weight:700}
.ok-ico{color:var(--ok)}.bad-ico{color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(14,33,80,.45);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;width:min(760px,92vw);max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(14,33,80,.3)}
.modal h2{margin:0 0 6px;font-size:19px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 28px rgba(14,33,80,.3);opacity:0;transform:translateY(10px);transition:.25s;z-index:60}
.toast.show{opacity:1;transform:none}
.kudo{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;background:#fff}
.kudo .who{font-size:11px;color:var(--muted)}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;background:#fff}
.doc .ico{width:32px;height:38px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.doc .ico.x{background:var(--ok-soft);color:var(--ok)}
.doc .m{margin-left:auto;font-size:11px;color:var(--muted)}
.tree{font-size:13px}
.tree .node{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.tree .lvl1{margin-left:22px}.tree .lvl2{margin-left:44px}
.tree .node .row .bar{flex:1;max-width:160px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:10px;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rb{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rb span{padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.rb span.on{background:var(--navy);color:#fff}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5}
.sig{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--cell);font-size:12.5px}
.sig .name{font-family:'Segoe Script','Brush Script MT',cursive;font-size:20px;color:var(--navy)}
.emptystate{padding:30px;text-align:center;color:var(--muted)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#d8dce4;border-radius:8px}
code{background:#eef0f3;border-radius:5px;padding:1px 6px;font-size:12px}
.card details summary::-webkit-details-marker{display:none}

/* ---------- Guía de uso: enlace gris abajo del menú + tarjetas + recorrido guiado ---------- */
.sidelinks{margin-top:auto;padding:4px 0 2px}
.sidelinks a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:#7a8394;cursor:pointer;transition:background .15s ease-out,color .15s ease-out}
.sidelinks a i{font-size:18px}
.sidelinks a:hover{background:#eef1f6;color:#2b3240}
.sidelinks a.on{color:#0e2150;font-weight:600}
.gd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gd-tile{background:#fff;border:1px solid #e3e6ec;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .18s ease-out, box-shadow .18s ease-out}
.gd-tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,33,80,.08)}
.gd-tile .ic{width:34px;height:34px;border-radius:9px;background:#eef1f7;color:#0e2150;display:flex;align-items:center;justify-content:center;font-size:18px}
.gd-tile .t{font-weight:700;font-size:14px;color:#0e2150}
.gd-tile .d{font-size:12.5px;color:#5c6675;line-height:1.45;flex:1}
.gd-tile .go{font-size:12px;font-weight:600;color:#0e9aab}
.tour-hole{position:fixed;z-index:9998;border-radius:10px;box-shadow:0 0 0 9999px rgba(14,33,80,.55);pointer-events:none;transition:left .22s ease-out,top .22s ease-out,width .22s ease-out,height .22s ease-out}
.tour-block{position:fixed;inset:0;z-index:9997}
.tour-tip{position:fixed;z-index:9999;width:330px;background:#fff;border-radius:12px;box-shadow:0 12px 34px rgba(14,33,80,.28);padding:16px 16px 12px;animation:tourIn .2s ease-out}
.tour-tip .n{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a94a6;margin-bottom:4px}
.tour-tip .h{font-weight:700;font-size:14px;color:#0e2150;margin-bottom:6px}
.tour-tip .b{font-size:13px;line-height:1.5;color:#2b3240}
.tour-tip .b b{color:#0e2150}
.tour-tip .f{display:flex;align-items:center;gap:8px;margin-top:12px}
.tour-tip .dots{flex:1;display:flex;gap:4px}
.tour-tip .dots i{width:6px;height:6px;border-radius:3px;background:#dde1e8}

/* ---------- Movimiento (rápido, sutil, solo transform/opacity; respeta reducir movimiento) ---------- */
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.65,0,.35,1);--d1:120ms;--d2:180ms;--d3:260ms}

.pcard,tr.click td,.card{transition:background var(--d2),border-color var(--d2),transform var(--d1) var(--ease),box-shadow var(--d2)}
.pcard:active{transform:scale(.985)}
.scale span{transition:background var(--d1),color var(--d1),transform var(--d1) var(--ease),border-color var(--d1)}

.rb span{transition:background var(--d2) var(--ease),color var(--d2)}

.fr-box.scoring{margin-bottom:18px;background:#fff}
.fr-box.scoring > .k{margin-bottom:12px}
.fr-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--cell)}
.fr-box .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.fr-box .v{font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
.fr-box .v.empty{color:var(--faint)}
.fr-locked .fr-box{background:#eef0f4;border-color:#dde1e8}
.fr-locked .fr-box .v{color:#5b6372}
.res-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.res-sub:after{content:"";flex:1;height:1px;background:var(--line)}
@media(max-width:900px){.fr-read{grid-template-columns:1fr}}

/* ---------- Distribución de puntuaciones ---------- */
.dist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dist .d1{border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px;background:#fff}
.dist .d1 h5{margin:0 0 2px;font-size:12.5px;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist .d1 .sub{font-size:11px;color:var(--muted);margin-bottom:4px}
.dist .d1 .box{position:relative;height:150px}
@media(max-width:1100px){.dist{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Mis resultados v3 ---------- */
.res-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.res-head .t{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.res-head .s{font-size:12px;color:var(--muted)}
.radar .empty-mini{height:280px;display:grid;place-items:center;color:var(--faint);font-size:12.5px;text-align:center;padding:20px}
.prev-obj{border:1px dashed #cfd5df;border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:18px}
.prev-obj .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.prev-obj .v{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.dist .d1 .box{height:190px}
.res-note{font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint)}

/* ---------- Organigrama oficial (foto de Hugo, 07-sep-2026): lienzo fijo 1220x605 escalado ---------- */
.ocw{width:100%;overflow:hidden}
.ocx{position:relative;width:1220px;height:619px;transform-origin:0 0;font-family:Inter,system-ui,sans-serif;color:#1f2a44}
.ocx svg{position:absolute;inset:0;width:1220px;height:619px;pointer-events:none}
.ocx .bx{position:absolute;box-sizing:border-box;border:1px solid #b9c2d0;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(14,33,80,.08)}
.ocx .bx.frame{border:2px solid #8f9bb0;background:#f3f4f7}
.ocx .bx.frame2{border:1.5px solid #9aa5ba;background:#fff}
.ocx .bx.panel{background:#eceff4;border-color:#d3d9e3}
.ocx .bx.teal{background:#e6f5f5;border-color:#bfe0e0}
.ocx .bx.green{background:#e9f6e9;border-color:#bfdcbf}
.ocx .bx.ext{background:#f7f8fa}
.ocx .bt{position:absolute;left:0;right:0;top:4px;text-align:center;font-weight:800;font-size:11.5px;color:#0e2150;text-decoration:underline;text-decoration-color:#0e2150;text-underline-offset:2px;line-height:1.2;padding:0 4px}
.ocx .bt.sm{font-size:10.5px}
.ocx .bt.teal{color:#0e7c86;text-decoration-color:#0e7c86}
.ocx .bt.green{color:#2f7d32;text-decoration-color:#2f7d32}
.ocx .pp{position:absolute;box-sizing:border-box;border:1px solid #d7dde6;border-radius:5px;background:#fff;text-align:center;padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center}
.ocx .pp:hover{border-color:#8f9bb0;box-shadow:0 2px 6px rgba(14,33,80,.14)}
.ocx .pp.ext{cursor:default}
.ocx .pp .n{font-weight:700;font-size:10.5px;line-height:1.15;color:#1f2a44;overflow-wrap:anywhere}
.ocx .pp .r{font-size:8.5px;font-style:italic;color:#5c6675;line-height:1.15;margin-top:1px;overflow-wrap:anywhere}
.ocx .pp.lg .n{font-size:11px}.ocx .pp.lg .r{font-size:9px}
@media(max-width:1100px){.oc-top,.oc-main{grid-template-columns:1fr}.oc-units{grid-template-columns:repeat(2,minmax(0,1fr))}.oc-teams{grid-template-columns:1fr}}
</style>
</head>

// En «Mis reviews» el lead responde el cuestionario normal, como uno más del equipo: se le enseña como «Compañero».

// Los PDF y los Excel van SIEMPRE en inglés: son los ficheros que uno se descarga y archiva, y tienen que
// leerse igual dentro de unos años y fuera de la firma (Hugo, 30-sep-2026). La pantalla sigue en castellano.
const ROLE_EN = { self:"Self-assessment", lead:"Lead Reviewer", peer:"Peer" };
const STATUS_EN = { pending:"Pending", draft:"Draft", submitted:"Submitted" };
// Los nombres de los ciclos y de los cuestionarios son datos («Performance Evaluation · diciembre 2025»,
// «Año 2026», «Ene–Jun 2026», «Performance Evaluation (diciembre) · …») y salen en títulos, pestañas y nombres de
// fichero. Al exportar se traduce el mes y el periodo. Solo en esos patrones (mes tras «·» o entre paréntesis,
// «Año» delante de un año): el texto libre de las respuestas no se toca.
const MES_EN = { enero:"January", febrero:"February", marzo:"March", abril:"April", mayo:"May", junio:"June", julio:"July", agosto:"August", septiembre:"September", setiembre:"September", octubre:"October", noviembre:"November", diciembre:"December" };
function enExport(t){
  return String(t == null ? "" : t)
    .replace(/(·\s*|\()(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?=\s+\d{4}|\))/gi, (m, pre, mes) => pre + MES_EN[mes.toLowerCase()])
    .replace(/\bAño (\d{4})\b/g, "Year $1")
    .replace(/\bEne\s*[–-]\s*Jun\b/g, "Jan–Jun").replace(/\bJul\s*[–-]\s*Dic\b/g, "Jul–Dec");
}
// Nombre de un cuestionario en pantalla y en los PDF: el nombre guardado en la base de datos va en castellano («… · evaluado por Deal Team»)
const formName = n => enExport(n).replace(/ evaluado por /g, " reviewed by ").replace(/\(socios\)/g, "(partners)");
const SERIE_EN = { "Media de peers":"Peer average", "Media ponderada":"Weighted average", "Media aritmética":"Average", "Autoevaluación":"Self-assessment" };
const CYCLE_STATUS = { draft:"Draft", open:"Open", closed:"Closed", published:"Closed" };
// Nombre corto de un ciclo en pantalla: «PE · Dec 2025 · Closed» (Hugo, 27-oct-2026). PE = Performance Evaluation (diciembre),
// MTF = Mid Term Feedback (junio). La fecha es el mes y el año del cierre. Lo que se descarga sigue con el nombre largo.
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// El mes sale del tipo de review, no de las fechas (Hugo, 04-nov-2026: un diciembre que abre o cierra en noviembre salía «Nov»):
// Performance Evaluation = «Dec», Mid Term Feedback = «Jun». Solo un ciclo personalizado usa el mes de su cierre.
function cycleDate(c){ if(!c) return ""; const y = cycleYear(c);
  if(c.kind === '360') return `Dec ${y}`; if(c.kind === 'cascade') return `Jun ${y}`;
  const d = c.closes_at || c.opens_at; if(!d) return y; const m = String(d).split("-")[1]; return `${MON_EN[+m - 1] || ""} ${y}`; }
// año del ciclo: el periodo si es un año («2025»); si no, el de la apertura (un diciembre puede cerrar en enero)
function cycleYear(c){ if(!c) return ""; if(c.period_label && /^\d{4}$/.test(c.period_label)) return c.period_label; return String(c.opens_at || c.closes_at || "").slice(0, 4); }
function cname(c, status){ if(!c) return ""; return `${c.kind === 'cascade' ? 'MTF' : 'PE'} · ${cycleDate(c)}${status === false ? "" : " · " + CYCLE_STATUS[c.status]}`; }
// Año que estás viendo, grande en la barra de arriba (Hugo, 27-oct-2026): cada página dice qué ciclo enseña; si no, el más reciente

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ini = p => p ? (p.first_name[0] + (p.last_name||"")[0]).toUpperCase() : "?";
const av = (p, cls="") => `<span class="avatar ${cls}" style="background:${TEAM_COLOR[p?.team]||'var(--navy)'}" title="${esc(fullName(p))}">${ini(p)}</span>`;
const pillTeam = t => t ? `<span class="pill" style="background:${TEAM_COLOR[t]}22;color:${TEAM_COLOR[t]}">${TEAM_LABEL[t]}</span>` : "";
const fmtD = d => { if(!d) return "—"; const x = new Date(d); return x.toLocaleDateString("en-GB", {day:"2-digit", month:"2-digit", year:"numeric"}); };
const fmtDT = d => { if(!d) return "—"; const x = new Date(d); return x.toLocaleString("en-GB", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}); };

/* ---------- Desplegables propios: envuelven cada <select>, lo ocultan y lo mantienen sincronizado ---------- */
let SELMENU = null, SELOPEN = null;
function enhanceSelects(root){
  (root || document).querySelectorAll("select:not([data-enh]):not([hidden])").forEach(sel => {
    sel.dataset.enh = "1";
    const wrap = document.createElement("div");
    wrap.className = "sel" + ((sel.style.width === "auto" || sel.closest("td")) ? " auto" : "");
    sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "sel-btn"; wrap.appendChild(btn);
    const sync = () => { const o = sel.selectedOptions[0]; const ph = !o || !o.value; const per = o && o.dataset.p ? person(o.dataset.p) : null;
      btn.innerHTML = `<span class="sel-txt ${ph?'ph':''}">${per ? av(per,"sm") + esc(fullName(per)) : esc(o ? o.text.replace(/^[—–-\s]+|[—–-\s]+$/g,"") : "—")}</span><i class="ti ti-chevron-down"></i>`; btn.disabled = sel.disabled; };
    sel._sync = sync; sync();
    sel.addEventListener("change", sync);
    btn.addEventListener("click", e => { e.stopPropagation(); if(SELOPEN === sel) closeSelMenu(); else openSelMenu(sel, btn); });
    btn.addEventListener("keydown", e => { if(["ArrowDown","Enter"," "].includes(e.key)){ e.preventDefault(); openSelMenu(sel, btn); } });
  });
}
function syncSelects(root){ (root || document).querySelectorAll("select[data-enh]").forEach(s => s._sync && s._sync()); }
/* El body va escalado (arriba, en el CSS). getBoundingClientRect() y window.inner* devuelven pixeles de pantalla
   (ya escalados), pero el top/left de un position:fixed que cuelga del body se mide SIN escalar. Se divide para pasar
   de unos a otros; si no, los menus salen desplazados. */
const UI_SCALE = 0.8;
const uiRect = el => { const r = el.getBoundingClientRect(); const k = 1 / UI_SCALE;
  return { left:r.left*k, right:r.right*k, top:r.top*k, bottom:r.bottom*k, width:r.width*k, height:r.height*k }; };
const uiVW = () => window.innerWidth / UI_SCALE, uiVH = () => window.innerHeight / UI_SCALE;
function openSelMenu(sel, btn){
  closeSelMenu();
  const opts = [...sel.options];
  const m = document.createElement("div"); m.className = "selmenu";
  const many = opts.length > 8;
  m.innerHTML = `${many ? `<div class="sm-search"><i class="ti ti-search"></i><input type="text" placeholder="Search…" autocomplete="off"></div>` : ""}<div class="sm-list"></div>`;
  const list = m.querySelector(".sm-list");
  const draw = q => {
    const ql = (q||"").toLowerCase();
    const items = opts.filter(o => { if(!ql) return true; const per = o.dataset.p ? person(o.dataset.p) : null; return o.text.toLowerCase().includes(ql) || (per && (per.position||"").toLowerCase().includes(ql)); });
    list.innerHTML = items.length ? items.map((o, k) => {
      const pid = o.dataset.p, per = pid ? person(pid) : null; const ph = !o.value;
      const body = per ? `${av(per,"sm")}<div class="sm-txt"><div class="n">${esc(fullName(per))}</div><div class="p">${esc(per.position||"")}${per.team?` · ${TEAM_LABEL[per.team]}`:""}</div></div>`
                 : ph ? `<i class="ti ti-minus"></i><span>${esc(o.text.replace(/^[—–-\s]+|[—–-\s]+$/g,""))}</span>`
                 : `<span class="sm-txt"><div class="n" style="font-weight:500">${esc(o.text)}</div></span>`;
      return `<div class="sm-item ${o.selected?'on':''} ${o.disabled?'dis':''} ${ph?'ph':''} ${k===1&&items[0]&&!items[0].value?'sep':''}" data-i="${o.index}">${body}${o.selected&&!ph?'<i class="ti ti-check"></i>':''}</div>`; }).join("") : `<div class="sm-empty">No results</div>`;
  };
  draw("");
  list.addEventListener("click", e => { const it = e.target.closest(".sm-item"); if(!it || it.classList.contains("dis")) return; pick(+it.dataset.i); });
  const pick = i => { if(sel.selectedIndex !== i){ sel.selectedIndex = i; sel.dispatchEvent(new Event("change", { bubbles:true })); } closeSelMenu(); btn.focus(); };
  document.body.appendChild(m);
  // posición: debajo del botón; si no cabe, encima
  const hasPeople = opts.some(o => o.dataset.p);
  const r = uiRect(btn); const w = Math.max(r.width, hasPeople ? 320 : 260);
  m.style.width = w + "px"; m.style.left = Math.min(r.left, uiVW() - w - 8) + "px";
  const below = uiVH() - r.bottom - 12;
  if(below < 240 && r.top > below){ m.style.maxHeight = Math.min(360, r.top - 12) + "px"; m.style.bottom = (uiVH() - r.top + 6) + "px"; }
  else { m.style.maxHeight = Math.min(360, below) + "px"; m.style.top = (r.bottom + 6) + "px"; }
  requestAnimationFrame(() => m.classList.add("show"));
  btn.classList.add("open"); SELMENU = m; SELOPEN = sel; SELMENU._btn = btn;
  // teclado
  let focus = opts.findIndex(o => o.selected);
  const setFocus = d => { const its = [...list.querySelectorAll(".sm-item:not(.dis)")]; if(!its.length) return; let k = its.findIndex(x => x.classList.contains("focus")); k = Math.max(0, Math.min(its.length-1, (k<0 ? its.findIndex(x=>x.classList.contains("on")) : k) + d)); its.forEach(x=>x.classList.remove("focus")); its[k].classList.add("focus"); its[k].scrollIntoView({block:"nearest"}); };
  m.addEventListener("keydown", e => { if(e.key==="ArrowDown"){ e.preventDefault(); setFocus(1); } else if(e.key==="ArrowUp"){ e.preventDefault(); setFocus(-1); } else if(e.key==="Enter"){ e.preventDefault(); const f = list.querySelector(".sm-item.focus") || list.querySelector(".sm-item.on"); if(f) pick(+f.dataset.i); } else if(e.key==="Escape"){ closeSelMenu(); btn.focus(); } });
  const inp = m.querySelector("input"); if(inp){ inp.addEventListener("input", () => draw(inp.value)); setTimeout(() => inp.focus(), 30); } else { m.tabIndex = -1; setTimeout(() => m.focus(), 30); }
  const on = list.querySelector(".sm-item.on"); if(on) on.scrollIntoView({block:"nearest"});
}
function closeSelMenu(){ if(SELMENU){ const m = SELMENU; m.classList.remove("show"); if(m._btn) m._btn.classList.remove("open"); setTimeout(() => m.remove(), 180); SELMENU = null; SELOPEN = null; } }
document.addEventListener("click", e => { if(SELMENU && !SELMENU.contains(e.target)) closeSelMenu(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSelMenu(); });
window.addEventListener("resize", closeSelMenu);
document.addEventListener("scroll", e => { if(SELMENU && !SELMENU.contains(e.target)) closeSelMenu(); }, true);

function skeleton(){ return `<div class="page"><div class="row" style="gap:14px;margin-bottom:18px"><div class="skel" style="width:64px;height:64px;border-radius:50%"></div><div style="flex:1"><div class="skel" style="height:22px;width:40%;margin-bottom:8px"></div><div class="skel" style="height:14px;width:25%"></div></div></div><div class="grid g3" style="margin-bottom:18px"><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div></div><div class="skel" style="height:220px"></div></div>`; }
let PT = null;
function progress(on){ const el = document.getElementById("ptop"); if(!el) return; clearTimeout(PT); if(on){ el.classList.add("on"); el.style.width = "70%"; } else { el.style.width = "100%"; PT = setTimeout(()=>{ el.classList.remove("on"); el.style.width = "0"; }, 300); } }
function toast(t, bad){ const el=document.getElementById("toast"); el.textContent=t; el.style.background = bad ? "var(--bad)" : "var(--navy)"; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"), bad?5000:2600); }

// Los mensajes de error de la base de datos (raise exception en los .sql de 3 - Base de datos) están en castellano: se traducen aquí antes de enseñarlos

  "Asignación no encontrada":"Assignment not found",

  "Faltan compañeros por enviar":"Some peers have not submitted yet",

  "No es tu asignación":"This is not your assignment",

  "No hay resumen final que enviar":"There is no final summary to send",
  "No puedes elegirte a ti mismo":"You cannot choose yourself",
  "Primero envía el resumen final":"Send the final summary first",
  "Primero escribe y guarda el resumen final":"Write and save the final summary first",
  "Sin permiso para ver estos resultados":"You do not have permission to see these results",
  "Sin permiso para ver la media de peers":"You do not have permission to see the peer average",

  "Solo el lead reviewer":"Only the lead reviewer",
  "Usuario no reconocido":"User not recognised",
  "Ya enviada":"Already submitted",
};
function trErr(m){
  m = String(m == null ? "" : m);
  if(SERVER_ERR_EN[m]) return SERVER_ERR_EN[m];
  let x;
  if((x = m.match(/^Faltan (\d+) pregunta\(s\) obligatoria\(s\)$/))) return `${x[1]} required question(s) missing`;
  if((x = m.match(/^Hay (\d+) respuestas guardadas en estos cuestionarios: no se intercambian automáticamente$/))) return `There are ${x[1]} saved answers in these questionnaires: they are not swapped automatically`;
  return m;
}
function err(e, ctx){ console.error(ctx, e); toast((ctx?ctx+": ":"") + trErr(e?.message || e), true); }

// ---------- Cliente Supabase ----------
function makeClient(devEmail){
  if(SIM_MODE && window.SIM) return window.SIM.client(devEmail);
  if(!window.supabase || !/^https?:\/\//.test(SUPABASE_URL)) return null;
  const opts = { auth:{ persistSession: !DEV_MODE, autoRefreshToken: !DEV_MODE, detectSessionInUrl: !DEV_MODE, storageKey: DEV_MODE ? "abac-eval-dev-" + Date.now() : "abac-eval" } };
  if(DEV_MODE && devEmail) opts.global = { headers: { "x-dev-user": devEmail } };
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, opts);
}

// ---------- Identidad ----------
async function loadMe(email){
  const { data, error } = await sb.from("people").select("*").ilike("email", email).limit(1);
  if(error) throw error;
  return data[0] || null;
}
async function loadCatalog(){
  const [f, c, p, s] = await Promise.all([
    sb.from("forms").select("*, form_sections(*, questions(*))").order("code"),
    sb.from("cycles").select("*, cycle_forms(*)").order("opens_at", {ascending:false}),
    sb.from("people").select("*").order("last_name"),
    sb.from("app_settings").select("*").eq("id", 1).limit(1),
  ]);
  for(const r of [f,c,p,s]) if(r.error) throw r.error;
  FORMS = f.data.map(x => ({...x, form_sections: (x.form_sections||[]).sort((a,b)=>a.position-b.position).map(sx => ({...sx, questions:(sx.questions||[]).sort((a,b)=>a.position-b.position)}))}));
  CYCLES = c.data; ALL_PEOPLE = p.data; PEOPLE = p.data.filter(x => x.active); SETTINGS = (s.data && s.data[0]) || SETTINGS;
}

// Preguntas que rellena un papel en un formulario
function questionsFor(form, role){
  const out = [];
  for(const s of form.form_sections){
    const qs = s.questions.filter(q => (q.fill_by || s.fill_by || []).includes(role));
    if(qs.length) out.push({ section:s, questions:qs });
  }
  return out;
}
// Cuestionario de un ciclo para un papel: el más específico que haya (equipo del evaluado + equipo del evaluador → equipo del evaluado → general)
// El lead reviewer responde el mismo cuestionario que un compañero de su pareja de equipos (Hugo, 08-sep-2026); su resumen final va aparte, en la pestaña Lead Reviewer
function formFor(cycle, role, team, reviewerTeam){
  const cf = (cycle.cycle_forms||[]);
  const pick = r => (reviewerTeam && cf.find(x => x.role===r && x.team===team && x.reviewer_team===reviewerTeam))
    || cf.find(x => x.role===r && x.team===team && !x.reviewer_team)
    || cf.find(x => x.role===r && !x.team && !x.reviewer_team);
  const hit = pick(role) || (role === 'lead' ? pick('peer') : null);
  return hit ? byId(FORMS, hit.form_id) : null;
}

// ---------- Arranque: selector de usuario (sin login) o login Microsoft ----------
async function boot(){
  if(!window.supabase && !SIM_MODE){ document.getElementById("content").innerHTML = `<div class="alert warn">The Supabase library could not be loaded. Check your internet connection.</div>`; return; }
  if(!SIM_MODE && (!/^https?:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY === "PENDIENTE")){
    document.getElementById("content").innerHTML = `<div class="card"><h3>Configuration pending</h3><p class="sm"><code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> must be set at the top of the script, with this app's Supabase project details.</p></div>`;
    return;
  }
  if(DEV_MODE){
    sb = makeClient(null);
    try {
      const { data, error } = await sb.from("people").select("*").eq("active", true).order("last_name");
      if(error) throw error;
      PEOPLE = data;
      const saved = (()=>{ try{ return localStorage.getItem("abac_eval_devuser"); }catch(e){ return null; } })();
      const first = PEOPLE.find(p => p.email === saved) || PEOPLE.find(p => p.is_admin) || PEOPLE[0];
      await setDevUser(first.email);
    } catch(e){ err(e, "Could not read the directory"); }
    return;
  }
  // Producción: Microsoft
  sb = makeClient(null);
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session && session.user && session.user.email){ await enter(session.user.email); }
    else showGate();
  });
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await enter(data.session.user.email); return; }
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const oauthErr = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
  const manual = (()=>{ try{ return sessionStorage.getItem("abac_eval_salir") === "1"; }catch(e){ return false; } })();
  if(oauthErr){ showGate("Microsoft could not sign you in: " + oauthErr.replace(/\+/g, " ")); return; }
  // Hugo (07-sep-2026): sin tarjeta intermedia. Sin sesión → directo a Microsoft; tras cerrar sesión → Microsoft con selector de cuenta.
  if(AUTO_MS_LOGIN){ msLogin(manual); return; }
  showGate();
}
function showGate(msg){ const g=document.getElementById("gate"); g.hidden=false; requestAnimationFrame(() => g.classList.add("open"));  /* la clase open es la que le da opacidad (fundido de los modales) */ if(msg){ const e=document.getElementById("gateErr"); e.hidden=false; e.textContent=msg; } }
function msLogin(force){
  try{ sessionStorage.removeItem("abac_eval_salir"); }catch(e){}
  const opts = { scopes:"email openid profile", redirectTo: window.location.origin + window.location.pathname };
  if(force) opts.queryParams = { prompt:"select_account" };
  sb.auth.signInWithOAuth({ provider:"azure", options:opts }).then(r => { if(r.error) showGate(r.error.message); });
}
async function logout(){ if(DEV_MODE) return; try{ sessionStorage.setItem("abac_eval_salir", "1"); }catch(e){} await sb.auth.signOut(); location.reload(); }

async function setDevUser(email){
  try{ localStorage.setItem("abac_eval_devuser", email); }catch(e){}
  sb = makeClient(email);
  document.getElementById("content").innerHTML = skeleton();
  await enter(email);
  toast(`Signed in as ${ME ? ME.first_name : email}`);
}
async function enter(email){
  try{
    ME = await loadMe(email);
    if(!ME){ document.getElementById("gate").hidden = true; document.getElementById("content").innerHTML = `<div class="card"><h3>No access</h3><p class="sm">The e-mail <b>${esc(email)}</b> is not registered in the app. Ask the administrators to add you.</p>${DEV_MODE?"":`<button class="btn" onclick="logout()">Sign out</button>`}</div>`; return; }

function go(page, arg){ PAGE = page; ARG = arg ?? null; render(); document.getElementById("content").scrollTop = 0; }
let RENDER_SEQ = 0, CHARTS = [];

const rds = (label, data, color, dash) => ({ label, data, borderColor:color, backgroundColor: dash ? "transparent" : color + "22", pointBackgroundColor:color, borderWidth:2, borderDash: dash ? [4,3] : undefined, pointRadius:3 });

  b.innerHTML = c ? `<span class="y">${esc(cycleYear(c))}</span><span class="c">${esc(cname(c))}</span>` : ""; }

<script>
/* ============================================================================

const ASSIGN_SELECT = "*, reviewee:people!assignments_reviewee_id_fkey(id,first_name,last_name,team,position,email), reviewer:people!assignments_reviewer_id_fkey(id,first_name,last_name,team,position,email)";

}

/* ---------- MIS TAREAS ---------- */
let PICKED = {};
// Los avisos (hoy empieza, quedan X días, hoy cierra, cerrado, ya puedes ver tus resultados) van por CORREO, no dentro de la app (Hugo, 07-sep-2026). Ver 3 - Base de datos/11_avisos_correo.sql y edge/avisos.
PAGES.tasks = async function(){
  const all = await myAssignments(); await refreshLeadCache();
  PICKED = {}; { const { data:pk } = await sb.from("assignments").select("cycle_id").eq("reviewee_id", ME.id).in("role", ["peer","lead"]); for(const x of (pk||[])) PICKED[x.cycle_id] = true; }

  VIEW_CYCLE = cyclesSorted[0] || null;

  <div class="grid g3" style="margin-bottom:18px">
    <div class="card kpi"><span class="v">${pending.length}</span><span class="l">Pending reviews</span><span class="d ${pending.length?'neg':''}">${pending.length ? "to complete" : "all up to date"}</span></div>
    <div class="card kpi"><span class="v">${open.filter(a=>a.status==="submitted").length}</span><span class="l">Submitted reviews</span><span class="d">in open cycles</span></div>
    <div class="card kpi"><span class="v">${CYCLES.filter(c=>c.status==="open").length}</span><span class="l">Open cycles</span><span class="d">${CYCLES.filter(c=>c.status==="open").map(c=>esc(cname(c, false))).join(", ")||"none right now"}</span></div>
  </div>
  ${cyclesSorted.length ? cyclesSorted.map(c => {
    const list = byCycle[c.id];
    const prevC = c.kind === '360' ? prevDecOf(c) : null, prevList = prevC ? (byCycle[prevC.id] || []) : [], prevYear = prevC ? (prevC.opens_at || "").slice(0, 4) : "";
    const prevOf = a => prevList.find(x => x.reviewee_id === a.reviewee_id && x.role === a.role && x.status === 'submitted') || prevList.find(x => x.reviewee_id === a.reviewee_id && x.status === 'submitted') || null;
    const needPick = c.status==='open' && (c.visibility||{}).reviewee_picks && list.some(a=>a.role==='self') && !PICKED[c.id];
    return `<div class="card" style="margin-bottom:16px"><h3><i class="ti ti-clipboard-check"></i> ${esc(cname(c, false))} <span class="r"><span class="pill ${c.status==='open'?'ok':c.status==='published'?'':'gray'}">${CYCLE_STATUS[c.status]}</span> ${c.closes_at?`<span class="xs mut">closes ${fmtD(c.closes_at)}</span>`:""}</span></h3>
     ${needPick ? `<div class="alert warn" style="margin-bottom:12px"><i class="ti ti-users-plus"></i> <span style="flex:1">In this cycle you choose the 2-3 peers who give you feedback. You do it from your self-assessment.</span><button class="btn sm pri" onclick="go('form','${list.find(a=>a.role==='self').id}')">Choose now</button></div>` : ""}
     ${prevC ? `<div class="xs mut" style="margin:-4px 0 10px">What you answered in ${esc(cname(prevC, false))} is under each person's “View ${prevYear}” button.</div>` : ""}
     <table><tr><th>Person</th><th>Review type</th><th>Form</th><th>Status</th><th></th></tr>
     ${list.sort((a,b)=>(a.role==='self'?0:1)-(b.role==='self'?0:1)).map(a => { const f = byId(FORMS, a.form_id); return `<tr>
        <td class="row">${av(a.reviewee,"sm")} ${a.role==='self' ? "<b>Me</b>" : esc(fullName(a.reviewee))}</td>
        <td><span class="pill ${a.role==='self'?'':'warn'}">${ROLE_LABEL[taskRole(a.role)]}</span></td>
        <td class="sm mut">${esc(f?formName(f.name):"—")}</td>
        <td>${a.status==='submitted'?`<span class="y">Submitted</span> <span class="xs mut">${fmtD(a.submitted_at)}</span>`:['closed','published'].includes(c.status)?`<span class="mut">No answer ${cycleYear(c)}</span>`:a.status==='draft'?`<span class="p">Draft</span>`:`<span class="mut">Pending</span>`}</td>
        <td style="text-align:right">${prevC ? (pa => pa ? `<button class="btn sm ghost" style="margin-right:6px" title="Your answer about this person in ${esc(cname(prevC, false))}" onclick="go('form','${pa.id}')"><i class="ti ti-history"></i> View ${prevYear}</button>` : `<span class="xs mut" style="margin-right:10px">No answer ${prevYear}</span>`)(prevOf(a)) : ""}${a.status!=='submitted'&&c.status==='draft'?`<span class="xs mut" style="margin-right:8px">opens soon</span>`:""}<button class="btn sm ${a.status!=='submitted'&&c.status==='open'?'pri':''}" onclick="go('form','${a.id}')">${a.status==='submitted'?'View':c.status==='open'?(a.status==='draft'?'Continue':'Start'):'View'}</button></td></tr>`; }).join("")}
     </table></div>`; }).join("")
   : `<div class="card"><div class="empty"><div class="ic"><i class="ti ti-clipboard-check"></i></div><div class="t">You have no reviews assigned</div><div class="d">When a review cycle opens, your self-assessment and the peer reviews you have to complete will appear here.</div>${isAdmin()?`<button class="btn pri" style="margin-top:14px" onclick="go('admin')"><i class="ti ti-plus"></i> Create a cycle</button>`:""}</div></div>`}`;
};

/* ---------- FORMULARIO (una asignación) ---------- */
let CUR = null; // {a, form, answers:{qid:{value_num,value_text}}, cycle}
AFTER.form = async function(){ updateProgress(); };
PAGES.form = async function(id){
  const { data:a, error } = await sb.from("assignments").select(ASSIGN_SELECT).eq("id", id).single();
  if(error) throw error;
  const form = byId(FORMS, a.form_id), cycle = byId(CYCLES, a.cycle_id);
  const { data:ans, error:e2 } = await sb.from("answers").select("*").eq("assignment_id", id);
  if(e2) throw e2;
  const answers = {}; for(const x of ans) answers[x.question_id] = x;
  CUR = { a, form, answers, cycle };
  const mine = a.reviewer_id === ME.id;
  const editable = mine && a.status !== "submitted" && cycle.status === "open";
  VIEW_CYCLE = cycle; document.getElementById("title").textContent = `${cname(cycle, false)} · ${a.role==='self' ? "My self-assessment" : fullName(a.reviewee)}`;
  const groups = questionsFor(form, a.role);

  // El lead responde como un evaluador más: sin ver la autoevaluación ni lo de los compañeros (Hugo, 08-sep-2026). Lo lee después, en la ficha y en el Excel.
  // En la autoevaluación, antes de empezar: los objetivos que le pusieron el año anterior
  const objBlock = a.role === "self" ? await prevObjectivesBlock(a.reviewee_id, cycle, mine ? "me" : "other") : "";

  let picksBlock = "";
  if(a.role === "self" && (cycle.visibility||{}).reviewee_picks && mine){

    const peers = (others||[]).filter(x=>x.role==='peer'), lead = (others||[]).find(x=>x.role==='lead');
    const locked = peers.some(x => x.status !== 'pending') || cycle.status !== 'open';
    const popts = sel => PEOPLE.filter(p=>p.active && p.id!==ME.id).sort((x,y)=>x.last_name.localeCompare(y.last_name)).map(p=>`<option value="${p.id}" data-p="${p.id}" ${sel===p.id?"selected":""}>${esc(fullName(p))}</option>`).join("");
    picksBlock = `<div class="card nopdf" style="margin-bottom:16px"><h3><i class="ti ti-users-plus"></i> Who gives you feedback <span class="r">${peers.length?`<span class="pill ok">${peers.length} peer${peers.length>1?'s':''} chosen</span>`:`<span class="pill warn">to be chosen</span>`}</span></h3>
      <p class="sm mut" style="margin:0 0 12px">Choose <b>2 or 3 peers</b> you have worked with this half-year. They will give you feedback without seeing your self-assessment. Your lead reviewer is assigned by the administrators${lead ? `: <b>${esc(fullName(lead.reviewer))}</b>` : " (not assigned yet)"}; they can also be one of the peers you choose.</p>
      <div class="two"><div><label class="xs mut">Peer 1</label><select class="inp" id="pk1"><option value="">—</option>${popts(peers[0]&&peers[0].reviewer_id)}</select></div><div><label class="xs mut">Peer 2</label><select class="inp" id="pk2"><option value="">—</option>${popts(peers[1]&&peers[1].reviewer_id)}</select></div>
        <div><label class="xs mut">Peer 3 (optional)</label><select class="inp" id="pk3"><option value="">—</option>${popts(peers[2]&&peers[2].reviewer_id)}</select></div></div>
      ${locked ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> One of your reviewers has already started: the choice is now fixed. Talk to the administrators if it needs changing.</div>`
               : `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri sm" onclick="saveReviewerPicks('${a.cycle_id}')"><i class="ti ti-check"></i> Save choice</button></div>`}</div>`;
  }
  const head = `<div class="card" style="margin-bottom:16px"><div class="row" style="gap:16px">${av(a.reviewee,"lg")}
    <div style="flex:1"><div class="hd">${a.role==='self' ? "My self-assessment" : esc(fullName(a.reviewee))}</div>
      <div class="mut sm">${esc(a.reviewee.position||"")} · ${TEAM_LABEL[a.reviewee.team]||""} · <span class="pill ${a.role==='self'?'':'warn'}">${ROLE_LABEL[taskRole(a.role)]}</span> · ${esc(formName(form.name))}</div></div>
    <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px">${mine && a.role==='self' && a.status==='submitted' ? `<button class="btn sm nopdf" onclick="downloadFormPDF()"><i class="ti ti-file-type-pdf"></i> Download PDF</button>` : ""}<div class="pill ${a.status==='submitted'?'ok':a.status==='draft'?'warn':'gray'}">${STATUS_LABEL[a.status]}</div>${a.submitted_at?`<div class="xs mut">${fmtDT(a.submitted_at)}</div>`:""}</div></div>
    ${""/* la introducción del cuestionario (form.intro, «Welcome to Performance Evaluation…») no se enseña nunca (Hugo, 10-sep-2026) */}
    ${!mine ? `<div class="alert info" style="margin-top:12px"><i class="ti ti-eye"></i> You are viewing the review written by <b>${esc(fullName(a.reviewer))}</b>.</div>` : ""}
    ${mine && a.status !== "submitted" && cycle.status !== "open" ? `<div class="alert warn" style="margin-top:12px"><i class="ti ti-lock"></i> <span style="flex:1">This cycle is not open yet (${CYCLE_STATUS[cycle.status].toLowerCase()}). You will be able to answer once the administrators open it.</span>${isAdmin()?`<button class="btn sm pri" onclick="openCycleNow('${cycle.id}','${a.id}')"><i class="ti ti-lock-open"></i> Open the cycle now</button>`:""}</div>` : ""}
    ${mine && a.role==='peer' ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> No other peer and not the person being reviewed will see your answer: only their lead reviewer and the partners with access read it. The person only receives their lead's final summary.</div>` : ""}
    ${mine && a.status === "submitted" ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> Answer submitted. If you need to correct something, ask an administrator: they can reopen it while the cycle is open.</div>` : ""}
  </div>`;

  const body = editable ? renderEditable(groups) : renderReadonly(form, a.role, ans);

      <div style="flex:1;display:flex;align-items:center;gap:12px"><div class="bar" style="width:160px"><span id="fprog" style="width:0"></span></div><span class="sm mut" id="fprogTxt"></span><span class="xs mut" id="saveState">Draft saved automatically</span></div>

async function saveReviewerPicks(cycleId){
  const g = x => document.getElementById(x).value;
  const peers = [g("pk1"), g("pk2"), g("pk3")].filter(Boolean);
  if(new Set(peers).size !== peers.length) return toast("You have chosen the same peer twice", true);
  if(peers.length < 2) return toast("Choose at least two peers", true);
  const { error } = await sb.rpc("choose_reviewers", { p_cycle:cycleId, p_peers:peers });
  if(error) return err(error, "Could not save the choice");
  toast("Peers saved"); render();
}
async function openCycleNow(cycleId, assignmentId){
  const { error } = await sb.from("cycles").update({ status:"open" }).eq("id", cycleId);
  if(error) return err(error, "Could not open the cycle");
  toast("Cycle open: answers can now be submitted"); await loadCatalog(); go("form", assignmentId);
}
function scaleHTML(q, val, editable, qid){

    <div class="scale" style="margin:0">${Array.from({length:n},(_,i)=>{ const v=(q.scale_min||1)+i; return `<span class="${editable?'':'ro'} ${val===v?'on':''}" ${editable?`onclick="setScale('${qid}',${v},this)"`:""}>${v}</span>`; }).join("")}</div>
    <span class="xs mut" style="width:90px">${esc(q.scale_high||"")}</span></div>`;
}
// Obligatoriedad efectiva (Hugo, 08-sep-2026): lo marcado como obligatorio en el cuestionario, salvo Investment Judgement y
// Hard Technical Skills cuando alguien de Operations evalúa a alguien del Deal Team (misma regla en submit_assignment, en la base de datos)
function isRequired(q, a, sec){
  a = a || (CUR && CUR.a); if(!q.required) return false;
  // Todo el mundo ve la plantilla entera de cada equipo (Hugo, 08-sep-2026); lo que el Word reserva al evaluado o al lead sale opcional para los demás
  if(sec && sec.title === 'Work Recognition' && a && a.role !== 'self') return false;   // «Section to be filled by Reviewee ONLY (& optional for Lead Reviewer)»
  if(sec && sec.title === 'Firm Contribution' && a && a.role === 'peer') return false;  // «Section ONLY to be filled by Reviewee and Lead Reviewer»
  return true;
}
function renderEditable(groups){
  return groups.map(g => `<div class="card" style="margin-bottom:16px"><h3>${esc(g.section.title)}</h3>${g.section.help?`<div class="hint" style="margin:-6px 0 12px">${esc(g.section.help)}</div>`:""}
    ${g.questions.map(q => { const a = CUR.answers[q.id] || {}; return `<div class="q"><div class="qt">${esc(q.text)} ${isRequired(q, null, g.section)?'<span class="n" title="required">*</span>':'<span class="tag">optional</span>'}</div>${q.help?`<div class="xs mut" style="margin:-4px 0 8px">${esc(q.help)}</div>`:""}
      ${q.kind==='scale' ? scaleHTML(q, a.value_num, true, q.id) : `<textarea data-q="${q.id}" placeholder="Write here…" oninput="queueSave('${q.id}', this.value)" ${q.kind==='short_text'?'style="min-height:44px"':''}>${esc(a.value_text||"")}</textarea>`}</div>`; }).join("")}</div>`).join("");
}
function renderReadonly(form, role, ansList){
  const map = {}; for(const x of (ansList||[])) map[x.question_id] = x;
  const groups = questionsFor(form, role);
  return groups.map(g => `<div class="card" style="margin-bottom:16px"><h3>${esc(g.section.title)}</h3>
    ${g.questions.map(q => { const a = map[q.id]; const empty = !a || (a.value_num==null && !(a.value_text||"").trim());
      return `<div class="q"><div class="qt">${esc(q.text)}</div>${q.kind==='scale' ? scaleHTML(q, a?.value_num, false) : `<div class="ans">${empty?'<span class="mut">— no answer —</span>':esc(a.value_text).replace(/\n/g,"<br>")}</div>`}</div>`; }).join("")}</div>`).join("");
}

// Guardado automático (upsert por pregunta), con un pequeño retardo para los textos
const SAVE_T = {};
function queueSave(qid, text){ clearTimeout(SAVE_T[qid]); setState("Saving…"); SAVE_T[qid] = setTimeout(()=>saveAnswer(qid, {value_text:text}), 700); }
function setScale(qid, v, el){
  // pulsar otra vez la nota marcada la quita (Hugo, 27-oct-2026)
  const quitar = el.classList.contains("on");
  [...el.parentNode.children].forEach(s=>s.classList.remove("on"));
  if(!quitar) el.classList.add("on");
  saveAnswer(qid, {value_num: quitar ? null : v});
}
function setState(t){ const s=document.getElementById("saveState"); if(s) s.textContent=t; }
// «Guardar borrador» (Hugo, 08-sep-2026): guarda ahora lo pendiente del guardado automático; sigue editable hasta «Enviar respuesta»
async function saveDraftNow(silent){
  if(!CUR) return; const ps = [];
  document.querySelectorAll("textarea[data-q]").forEach(t => { const qid = t.dataset.q; const prev = CUR.answers[qid] || {}; if((t.value||"") !== (prev.value_text||"")){ clearTimeout(SAVE_T[qid]); ps.push(saveAnswer(qid, { value_text: t.value })); } });
  await Promise.all(ps);
  setState("Draft saved " + new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" }));
  if(!silent) toast("Draft saved. You can keep editing it whenever you like");
}
function updateProgress(){ if(!CUR) return; const groups = questionsFor(CUR.form, CUR.a.role); let total=0, done=0; for(const g of groups) for(const q of g.questions){ total++; const a = CUR.answers[q.id]; if(a && (a.value_num!=null || (a.value_text||"").trim())) done++; } const b=document.getElementById("fprog"), t=document.getElementById("fprogTxt"); if(b) b.style.width = (total? done/total*100 : 0) + "%"; if(t) t.textContent = `${done} of ${total} answered`; }
async function saveAnswer(qid, patch){
  try{
    const prev = CUR.answers[qid] || {};
    const row = { assignment_id: CUR.a.id, question_id: qid, value_num: ("value_num" in patch ? patch.value_num : prev.value_num) ?? null, value_text: ("value_text" in patch ? patch.value_text : prev.value_text) ?? null, updated_at: new Date().toISOString() };
    const { data, error } = await sb.from("answers").upsert(row, { onConflict:"assignment_id,question_id" }).select().single();
    if(error) throw error;
    CUR.answers[qid] = data; updateProgress();
    if(CUR.a.status === "pending"){ await sb.from("assignments").update({status:"draft"}).eq("id", CUR.a.id); CUR.a.status = "draft"; }
    setState("Saved " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ setState("Error saving"); err(e, "Could not save"); }
}
async function submitCurrent(){
  // comprobar obligatorias en cliente para dar un mensaje claro (el servidor vuelve a comprobar)
  const groups = questionsFor(CUR.form, CUR.a.role);
  const missing = [];
  for(const g of groups) for(const q of g.questions){ const a = CUR.answers[q.id]; if(isRequired(q, null, g.section) && (!a || (a.value_num==null && !(a.value_text||"").trim()))) missing.push(q.text); }
  if(missing.length){ openModal(`<h2>Required answers missing</h2><ul class="sm">${missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul><div style="text-align:right"><button class="btn pri" onclick="closeModal()">Back to the form</button></div>`); return; }
  openModal(`<h2>Submit your answer?</h2><p class="sm"><b>Once submitted you will not be able to edit it again.</b> If there is a mistake, the administrators can reopen it. ${CUR.a.role==='peer'?"No other peer and not the person being reviewed will see your answer; only their lead reviewer.":CUR.a.role==='lead'?"Afterwards you will be able to read the peers' answers and write the final summary.":"Your lead reviewer will read it when writing your final summary."}</p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doSubmit()"><i class="ti ti-send"></i> Submit</button></div>`);
}
async function doSubmit(){
  closeModal();

// Construye la vista de resultados de una persona: ciclo actual + el anterior del mismo tipo para comparar
// Objetivos que le pusieron en el último diciembre anterior al ciclo (autoevaluación, ficha del lead y Mis resultados)
const prevObjHTML = (c, fr, who) => `<div class="prev-obj"><div class="k"><i class="ti ti-target"></i> Objectives ${who === 'me' ? "you were" : "they were"} set in ${esc(cname(c, false))} <span class="pill gray" style="margin-left:auto">${fr.objectives_year||""}</span></div><div class="v">${esc(fr.objectives)}</div></div>`;
async function prevObjectivesBlock(personId, cycle, who){
  const { data:frs } = await sb.from("final_reviews").select("cycle_id,objectives,objectives_year").eq("reviewee_id", personId);   // la base de datos solo devuelve los resúmenes ya mostrados (o los de mis evaluados)
  if(!frs || !frs.length) return "";
  const before = cycle.kind === '360' ? (x => (x.opens_at||"") < (cycle.opens_at||"")) : (x => (x.opens_at||"") <= (cycle.opens_at||"9999"));
  const decs = CYCLES.filter(x => x.kind === '360' && x.id !== cycle.id && before(x)).sort((x,y) => (y.opens_at||"").localeCompare(x.opens_at||""));
  for(const dc of decs){ const fr = frs.find(f => f.cycle_id === dc.id && f.objectives); if(fr) return prevObjHTML(dc, fr, who); }
  return "";
}
// Media de peers: la media ponderada de las notas que recibieron las demás personas del mismo rango del Deal Team (SQL 23).
// Solo Deal Team; en Operations y Nest la segunda línea de la araña sigue siendo la media aritmética.
async function peerBandOf(personId, cycleId){
  const p = person(personId); if(!p || p.team !== 'deal') return null;
  const { data, error } = await sb.rpc("peer_band_avg", { p_cycle: cycleId, p_reviewee: personId });
  if(error || !data || !data.length) return null;
  const byCode = {}; let label = "", n = 0;
  for(const r of data){ byCode[r.question_code] = r.avg_w == null ? null : Number(r.avg_w); label = r.band; n = r.n_people; }
  return n ? { label, n, byCode } : null;
}
async function buildResultsView(personId, cycleId, fetchRows){
  const c = byId(CYCLES, cycleId); if(!c) return null;
  const { data:frs } = await sb.from("final_reviews").select("*").eq("reviewee_id", personId);
  const fr = (frs||[]).find(f => f.cycle_id === c.id);   // sin filtro de estado: el resumen ya no se cierra (SQL 22)
  const cur = { c, rows: await fetchRows(c.id), fr, band: c.kind === '360' ? await peerBandOf(personId, c.id) : null };
  let prev = null, dec = null;
  if(c.kind === '360'){
    // Diciembre: comparar con el diciembre anterior (arañas, barras y objetivos que le pusieron)
    const prevC = CYCLES.filter(x => x.kind === '360' && (x.opens_at||"") < (c.opens_at||"")).sort((x,y) => (y.opens_at||"").localeCompare(x.opens_at||""));
    for(const pc of prevC){ const rows = await fetchRows(pc.id); const pfr = (frs||[]).find(f => f.cycle_id === pc.id); if((rows && rows.length) || pfr){ prev = { c:pc, rows: rows||[], fr:pfr, band: await peerBandOf(personId, pc.id) }; break; } }
  } else {
    // Junio: los objetivos del último diciembre (el año no ha acabado y son los mismos objetivos)
    const decs = CYCLES.filter(x => x.kind === '360' && (x.opens_at||"") <= (c.opens_at||"9999")).sort((x,y) => (y.opens_at||"").localeCompare(x.opens_at||""));
    for(const dc of decs){ const dfr = (frs||[]).find(f => f.cycle_id === dc.id && f.objectives); if(dfr){ dec = { c:dc, fr:dfr }; break; } }
  }
  return { cur, prev, dec, personId };
}
function resultsHTML(view, who, edit){

  const tu = who === 'me'; const canEdit = !!(edit && edit.canEdit); const written = !!fr || canEdit; const objOnly = !!(edit && edit.objOnly);

  if(c.kind !== '360'){

  }
  // ---- Diciembre (Performance Evaluation) ----
  const stats = scaleStats(cur.rows), pstats = prev ? scaleStats(prev.rows) : null;
  const hasScales = Object.keys(stats).some(k => k !== "_n"), hasPrev = !!(pstats && Object.keys(pstats).some(k => k !== "_n"));
  const yearCur = c.opens_at ? new Date(c.opens_at).getFullYear() : "";
  const yr = fr && fr.objectives_year ? fr.objectives_year : (yearCur ? yearCur + 1 : "");
  const prevObj = prev && prev.fr && prev.fr.objectives ? prevObjHTML(prev.c, prev.fr, who) : "";
  const scoring = hasScales ? `<div class="radars" style="margin-bottom:18px">
      <div class="radar"><h4>${esc(enExport(c.period_label||c.name))}</h4><div class="sub">Weighted average${cur.band ? `, peer average (${esc(cur.band.label)}) and ` : " and "}${tu ? "your" : "their"} self-assessment · ${stats._n} responses</div><div class="box"><canvas id="rad_cur"></canvas></div></div>
      <div class="radar"><h4>${prev ? esc(enExport(prev.c.period_label||prev.c.name)) : "Previous year"}</h4>${hasPrev ? `<div class="sub">The same lines from the previous year · ${pstats._n} responses</div><div class="box"><canvas id="rad_prev"></canvas></div>` : `<div class="empty-mini">There is no earlier review of the same type to compare with yet.</div>`}</div></div>
      <div class="res-sub">How many responses gave each score <span class="res-note">· in red, ${tu ? "your" : "their"} self-assessment score · percentages are over the people who responded that year</span></div>
      ${hasPrev ? `<div class="legend" style="margin:-4px 0 10px"><span><i style="background:#0e2150"></i>${esc(enExport(c.period_label||c.name))}</span><span><i style="background:#a9cdf4"></i>${esc(enExport(prev.c.period_label||prev.c.name))}</span></div>` : ""}
      <div class="dist">${Object.keys(stats).filter(k=>k!=="_n").map((k,j)=>`<div class="d1"><h5 title="${esc(stats[k].text)}">${esc(stats[k].text)}</h5><div class="sub">average ${(stats[k].sum/stats[k].n).toFixed(2)}${hasPrev && pstats[k] ? ` · previous year ${(pstats[k].sum/pstats[k].n).toFixed(2)}` : ""}</div><div class="box"><canvas id="dist_${j}"></canvas></div></div>`).join("")}</div>`
    : `<div class="hint">No scores have been submitted in this cycle yet.</div>`;
  const yearLabel = canEdit ? `Objectives <input type="text" id="fr_year" value="${yr}" style="width:64px;display:inline-block;padding:2px 6px;margin-left:6px;font-size:11px">` : `Objectives ${yr}`;
  return `${prevObj}
    ${objOnly ? "" : written ? `<div class="fr-read one">${box("recap", "Objectives Recap", "Which of last year's objectives were met and which were not…")}</div>` : notYet}
    <div class="fr-box full scoring"><div class="k">Performance ${yearCur} Summary Scoring</div>${scoring}</div>
    ${objOnly ? `<div class="fr-read one">${box("objectives", yearLabel)}</div>`

// PDF de Mis resultados: la misma vista (recuadros, araña y barras como imagen) en una ventana lista para «Guardar como PDF»
// Carga una librería externa una sola vez (cdnjs)
function loadScript(url, ready){
  if(ready()) return Promise.resolve();
  return new Promise((ok, ko) => { const el = document.createElement("script"); el.src = url; el.onload = () => ready() ? ok() : ko(new Error("Library not available")); el.onerror = () => ko(new Error("Could not load " + url)); document.head.appendChild(el); });
}
/* ---------- PDF profesionales (jsPDF, bajo demanda): texto vectorial, gráficos como imagen a tamaño fijo, paginación controlada ---------- */
const PDFK = { W:210, H:297, M:18, navy:[14,33,80], ink:[28,34,48], grey:[92,102,117], faint:[150,158,170], line:[225,229,236], soft:[245,247,250], teal:[14,154,171], red:[214,69,69], light:[169,205,244], white:[255,255,255] };
// jsPDF usa la codificación WinAnsi: sustituimos lo que no tiene
const pdfTxt = t => enExport(t).replace(/→/g, "->").replace(/–/g, "-").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/ /g, " ").replace(/\r/g, "");
async function pdfLoad(){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", () => !!(window.jspdf && window.jspdf.jsPDF)); }
const pdfLogo = () => { const im = document.querySelector("img.brandlogo") || document.querySelector('img[src^="data:image/png"]'); return im ? im.src : null; };
// Documento A4 con formato corporativo: logo, cabecera de documento, cabecera corrida en las páginas siguientes, pie con paginación
class PdfDoc {
  constructor(docType, cycleName, runningRight){ const { jsPDF } = window.jspdf; this.d = new jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    this.docType = docType; this.cycleName = cycleName; this.runningRight = runningRight || ""; this.page = 0; this.y = 0; this.newPage(); }
  get x(){ return PDFK.M; } get w(){ return PDFK.W - 2 * PDFK.M; } get bottom(){ return PDFK.H - 20; }
  color(c){ this.d.setTextColor(c[0], c[1], c[2]); } fill(c){ this.d.setFillColor(c[0], c[1], c[2]); } stroke(c){ this.d.setDrawColor(c[0], c[1], c[2]); }
  font(style, size){ this.d.setFont("helvetica", style || "normal"); this.d.setFontSize(size || 9); }
  lineH(size){ return size * 0.3528 * 1.38; }
  newPage(full){ if(this.page > 0) this.d.addPage(); this.page++;
    if(this.page === 1 || full){
      // cabecera de documento: logo a la izquierda, tipo de documento a la derecha
      const logo = pdfLogo(); if(logo){ try{ this.d.addImage(logo, "PNG", this.x, 13, 34, 34 * 138 / 480, undefined, "FAST"); }catch(e){} }
      // jsPDF no cuenta la separación entre letras al alinear a la derecha: el título se salía del margen ~12 mm y no
      // quedaba alineado con las líneas de debajo (Hugo, 27-oct-2026). Se calcula el ancho real y se escribe desde la izquierda.
      this.font("bold", 8); this.color(PDFK.navy); this.rightText(pdfTxt(this.docType).toUpperCase(), 16.5, 0.6, 105);
      this.font("normal", 8.5); this.color(PDFK.grey); this.rightText(pdfTxt(this.cycleName), 21.5, 0, 105);
      this.font("normal", 7); this.color(PDFK.faint); this.d.text("Confidential  ·  Internal use", PDFK.W - PDFK.M, 25.5, { align:"right" });
      this.stroke(PDFK.navy); this.d.setLineWidth(0.5); this.d.line(this.x, 30, this.x + this.w, 30);
      this.y = 38;
    } else {
      // cabecera corrida
      this.font("normal", 7.5); this.color(PDFK.grey); this.d.text(pdfTxt(`Abac Capital  ·  ${this.cycleName}`), this.x, 13);
      if(this.runningRight) this.rightText(pdfTxt(this.runningRight), 13, 0, 80);
      this.stroke(PDFK.line); this.d.setLineWidth(0.3); this.d.line(this.x, 16, this.x + this.w, 16);
      this.y = 24;
    } }
  // texto alineado al margen derecho, contando la separación entre letras; si no cabe en `maxW` mm, se reduce la letra
  rightText(t, y, cs, maxW){ cs = cs || 0; let size = this.d.getFontSize(); const ancho = () => this.d.getTextWidth(t) + cs * Math.max(0, t.length - 1);
    while(maxW && ancho() > maxW && size > 5){ size -= 0.5; this.d.setFontSize(size); }
    this.d.text(t, PDFK.W - PDFK.M - ancho(), y, cs ? { charSpace:cs } : undefined); }
  ensure(h){ this.flushSec(h); if(this.y + h > this.bottom){ this.newPage(); return true; } return false; }
  // bloque de título: nombre grande y línea secundaria
  title(name, sub){ this.font("bold", 15); this.color(PDFK.ink); this.d.text(pdfTxt(name), this.x, this.y + 5.5); this.font("normal", 9); this.color(PDFK.grey); if(sub) this.d.text(pdfTxt(sub), this.x, this.y + 11); this.y += 16; }
  // datos clave en una sola línea (dos si no caben): ETIQUETA valor  ·  ETIQUETA valor. Antes era un recuadro a dos columnas que
  // ocupaba media cabecera; Hugo (09-sep-2026) pidió quitar cosas de arriba para que las arañas quepan en la primera página
  meta(pairs){ const lh = 5, gap = 7; let x = this.x, first = true;
    for(const [k, v] of pairs){ const kk = pdfTxt(k).toUpperCase(), vv = pdfTxt(v || "—");
      this.font("bold", 6.3); const wk = this.d.getTextWidth(kk) + kk.length * 0.3; this.font("normal", 8.3); const wv = this.d.getTextWidth(vv);
      if(!first && x + wk + 1.6 + wv > this.x + this.w){ x = this.x; this.y += lh; }
      if(!first && x > this.x){ this.fill(PDFK.faint); this.d.circle(x - gap / 2, this.y + 2.3, 0.45, "F"); }
      this.font("bold", 6.3); this.color(PDFK.faint); this.d.text(kk, x, this.y + 3.4, { charSpace:0.3 });
      this.font("normal", 8.3); this.color(PDFK.ink); this.d.text(vv, x + wk + 1.6, this.y + 3.5);
      x += wk + 1.6 + wv + gap; first = false; }
    this.y += lh + 5; }
  // párrafo corrido
  para(text, size, color){ this.flushSec(0); size = size || 8.5; const lh = this.lineH(size); this.font("normal", size); this.color(color || PDFK.ink);

// Gráfico Chart.js fuera de pantalla → imagen PNG nítida (3x)
// Gráfico como imagen para el PDF. Hugo (04-nov-2026): «¿por qué a veces no salen los gráficos?». Cada gráfico se pinta en un
// lienzo a triple resolución (~4 MB) y esos lienzos no se liberaban: tras varios PDF o el ZIP (cientos de gráficos) el navegador
// se queda sin memoria de lienzos y toDataURL devuelve una imagen vacía SIN dar error. Ahora se libera cada lienzo al acabar
// (width = height = 0) y, si la imagen sale vacía, se repite a menor resolución.
function chartImage(config, wPx, hPx){
  for(const dpr of [3, 2, 1]){
    const cv = document.createElement("canvas"); cv.width = wPx; cv.height = hPx; cv.style.width = wPx + "px"; cv.style.height = hPx + "px";
    const holder = document.createElement("div"); holder.style.cssText = "position:absolute;left:-9999px;top:0;width:" + wPx + "px;height:" + hPx + "px"; holder.appendChild(cv); document.body.appendChild(holder);
    let url = "", ch = null;
    try{ const opts = Object.assign({}, config.options || {}, { responsive:false, animation:false, devicePixelRatio:dpr });
      ch = new Chart(cv, Object.assign({}, config, { options: opts })); url = cv.toDataURL("image/png"); }
    catch(e){ console.warn("chartImage", e); }
    finally{ try{ ch && ch.destroy(); }catch(e){} cv.width = 0; cv.height = 0; holder.remove(); }
    if(url && url.length > 2000) return url;        // «data:,» = sin memoria para el lienzo: se reintenta más pequeño
  }
  return null;
}

    plugins:{ legend:{ position:"bottom", labels:{ boxWidth:8, boxHeight:8, usePointStyle:true, padding:14, font:{ size:10 } } }, tooltip:{ enabled:false } } } }; };

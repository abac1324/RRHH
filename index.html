// Araña con tres líneas y pop-up de las tres notas al pasar por un eje
function radar3(canvasId, labels, W, A, S, aLabel){
  const ctx = document.getElementById(canvasId); if(!ctx || !window.Chart) return;
  const ds = [ rds("Weighted average", W, "#0e9aab") ]; if(A) ds.push(rds(aLabel, A, "#0e2150"));
  if(S && S.some(v => v != null)) ds.push({ ...rds("Self-assessment", S, "#e8862e", true), label:"Self-assessment", pointStyle:"rectRot", pointRadius:4 });
  const showIdx = (ch, idx, evt) => { const act = ch.data.datasets.map((d, i) => d.data[idx] != null ? { datasetIndex:i, index:idx } : null).filter(Boolean); ch.setActiveElements(act); ch.tooltip.setActiveElements(act, { x:evt.x, y:evt.y }); ch.update("none"); };
  const clear = ch => { ch.setActiveElements([]); ch.tooltip.setActiveElements([], {x:0,y:0}); ch.update("none"); };
  const chart = new Chart(ctx, { type:"radar", data:{ labels, datasets:ds }, options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:400 },
    interaction:{ mode:"index", intersect:true },   // sobre un punto: las tres notas de ese eje; en el vacío: nada
    layout:{ padding:{ top:10, bottom:2, left:12, right:12 } },   // aire alrededor: los nombres de los ejes no tocan el borde de la tarjeta
    scales:{ r:{ min:0, max:5, ticks:{ stepSize:1, backdropColor:"transparent", font:{ size:10 } }, grid:{ color:"#e7e9ee" }, angleLines:{ color:"#e7e9ee" }, pointLabels:{ padding:8, font:{ size:11, family:"Inter", weight:"600" }, color:"#2b3240" } } },
    plugins:{ legend:{ position:"bottom", labels:{ boxWidth:8, boxHeight:8, usePointStyle:true, padding:18, font:{ size:11 } } },
      tooltip:{ mode:"index", intersect:true, callbacks:{ label: c => ` ${c.dataset.label}: ${c.parsed.r != null ? Number(c.parsed.r).toFixed(2) : "—"}` } } },
    onHover:(evt, els, ch) => {  // además: sobre el NOMBRE del eje (Attitude, Ownership…)
      const r = ch.scales.r; if(!r || !r.getPointLabelPosition) return;
      let hit = -1; for(let i = 0; i < ch.data.labels.length; i++){ const b = r.getPointLabelPosition(i); if(evt.x >= b.left-4 && evt.x <= b.right+4 && evt.y >= b.top-4 && evt.y <= b.bottom+4){ hit = i; break; } }
      if(hit >= 0){ if(ch._lbl !== hit){ ch._lbl = hit; showIdx(ch, hit, evt); } ctx.style.cursor = "default"; return; }
      if(ch._lbl != null){ ch._lbl = null; if(!els.length) clear(ch); }
    } } });
  ctx.addEventListener("mouseleave", () => { chart._lbl = null; clear(chart); });
  CHARTS.push(chart);
}
// Barras por nota: dos barras por valor (año anterior primero, luego este año), porcentaje encima de cada una

const PCT_PLUGIN = { id:"pct", afterDatasetsDraw(ch){
  const ctx = ch.ctx; ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const metas = ch.data.datasets.map((d, i) => ch.getDatasetMeta(i));
  ch.data.datasets.forEach((ds, di) => { const meta = metas[di]; if(meta.hidden) return; const tot = ds.data.reduce((x, y) => x + (y||0), 0) || 1;
    meta.data.forEach((el, i) => { const v = ds.data[i]; if(!v) return; const w = el.width || 26; const size = w < 22 ? 8.5 : 10;
      ctx.font = `600 ${size}px Inter, system-ui, sans-serif`;
      // si la barra vecina (el otro año) tiene casi la misma altura y están muy juntas, la etiqueta del año anterior sube un escalón para no pisarse
      let y = el.y - 3; const other = metas[1 - di]; const o = other && !other.hidden && other.data[i];
      if(di === 0 && o && ch.data.datasets[1].data[i] && Math.abs(o.y - el.y) < size + 2 && Math.abs(o.x - el.x) < size * 3.4) y -= size + 1;
      ctx.fillStyle = ds._lblColor || "#2b3240"; ctx.fillText(Math.round(v / tot * 100) + "%", el.x, y); }); });
  ctx.restore(); } };
const SELF_PLUGIN = { id:"selfmark", afterDraw(ch){
  const sv = ch.options._self; if(!sv) return; const i = Math.round(sv) - 1; if(i < 0 || i > 4) return;
  const x = ch.scales.x; const px = x.getPixelForTick(i); const li = x._labelItems && x._labelItems[i];
  const tr = li && ((li.options && li.options.translation) || li.translation);  // Chart.js dibuja la etiqueta en translation + textOffset, centrada en vertical
  const py = tr ? tr[1] + (li.textOffset || 0) : x.top + 20;
  const ctx = ch.ctx; ctx.save(); ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.strokeStyle = "#d64545"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); } };
function bars2(canvasId, cur, prv, labelCur, labelPrev, selfScore){
  const ctx = document.getElementById(canvasId); if(!ctx || !window.Chart) return;

  if(prv) datasets.push({ label:labelPrev, data:prv, backgroundColor:"#a9cdf4", _lblColor:"#5b7fae", borderRadius:4, maxBarThickness:26, categoryPercentage:0.7, barPercentage:0.9 });

  const pct = (ds, v) => { const tot = ds.data.reduce((x, y) => x + (y||0), 0) || 1; return Math.round(v / tot * 100); };
  const showIdx = (ch, idx, evt) => { const act = ch.data.datasets.map((d, i) => ({ datasetIndex:i, index:idx })); ch.setActiveElements(act); ch.tooltip.setActiveElements(act, { x:evt.x, y:evt.y }); ch.update("none"); };

      layout:{ padding:{ bottom:6 } },

      scales:{ x:{ grid:{ display:false }, ticks:{ font: t => ({ size:11, weight: t.index === selfIdx ? "700" : "400" }), color: t => t.index === selfIdx ? "#d64545" : "#5c6675", padding:6 } },
               y:{ beginAtZero:true, grace:"25%", ticks:{ precision:0, font:{ size:10 } }, grid:{ color:"#eef0f3" } } },
      onHover:(evt, els, ch) => {  // además: sobre el NÚMERO del eje (1, 2, 3, 4, 5)
        const x = ch.scales.x; let hit = -1;

        if(hit >= 0){ if(ch._lbl !== hit){ ch._lbl = hit; showIdx(ch, hit, evt); } return; }
        if(ch._lbl != null){ ch._lbl = null; if(!els.length) clear(ch); }
      } } });
  ctx.addEventListener("mouseleave", () => { chart._lbl = null; clear(chart); });
  CHARTS.push(chart);
}
// Medias por competencia a partir de las filas de my_results / results_for (compañeros + lead; la autoevaluación aparte)
function scaleStats(rows){
  const out = {}; const keys = new Set();
  for(const r of rows){ if(r.kind !== 'scale' || r.value_num == null) continue; const o = (out[r.question_code] ||= { text:r.question_text, self:null, sum:0, n:0, wsum:0, w:0 });
    if(r.role === 'self'){ o.self = Number(r.value_num); continue; }
    const w = r.weight || 1; o.sum += Number(r.value_num); o.n++; o.wsum += Number(r.value_num) * w; o.w += w; if(r.response_key) keys.add(r.response_key);
    o.hist = o.hist || [0,0,0,0,0]; const b = Math.min(5, Math.max(1, Math.round(Number(r.value_num)))); o.hist[b-1]++; }
  for(const k in out){ if(!out[k].n) delete out[k]; }
  if(Object.keys(out).length) out._n = keys.size || Math.max(...Object.values(out).filter(o=>o.n!=null).map(o=>o.n));
  return out;
}
// Segunda línea de la araña: la media de peers del rango si la persona es del Deal Team, y si no la media aritmética

  : { data: null, label: null };   // sin rango de peers (Operations, Nest, Visiting): solo ponderada y autoevaluación (Hugo, 04-nov-2026)
function drawResults(view){

  const st = scaleStats(view.cur.rows); const codes = Object.keys(st).filter(k=>k!=="_n"); if(!codes.length) return;
  const lab = k => st[k].text.replace(/ and accountability| Technical/g,"");
  const a = bandSeries(view.cur.band, st, codes);

  const ps = view.prev ? scaleStats(view.prev.rows) : null;
  if(ps && document.getElementById("rad_prev")){ const pc = codes.filter(k => ps[k]); const pa = bandSeries(view.prev.band, ps, pc);
    radar3("rad_prev", pc.map(lab), pc.map(k => +(ps[k].wsum/ps[k].w).toFixed(2)), pa.data, pc.map(k => ps[k].self), pa.label); }
  codes.forEach((k, j) => bars2(`dist_${j}`, st[k].hist || [0,0,0,0,0], ps && ps[k] ? (ps[k].hist || [0,0,0,0,0]) : null, enExport(view.cur.c.period_label) || "This year", view.prev ? (enExport(view.prev.c.period_label) || "Previous year") : "", st[k].self));
}

// PROVISIONALES hasta que las confirmen los socios). Igual que review_weight() en la base de datos (que lo guarda x2, en enteros).
//  · Equity Partners (socios que no se evalúan): siempre 2.
//  · Resto: grupo propio del evaluado (IT PE, Nest, Operations, Support) → senior 2, junior 1; otro grupo → senior 1, junior 0,5.
//  · Senior = socios, directores, Head of, Legal. Junior = de VP a Analyst, Nest Principal, controllers, Office Manager.
//  · Excepciones: Joan Pina pesa 2 al evaluar a Operations (no a Support); y a Joan, IT PE le evalúa como «Operating Partner» (otro grupo).
function wGroup(p){ if(!p) return null; if(p.is_partner && p.is_evaluated === false) return "eq"; if(p.team === "deal") return "itpe"; if(p.team === "nest") return "nest"; return /office manager/i.test(p.position || "") ? "support" : "ops"; }
function wSenior(p){ return !!(p && (p.is_partner || /director|head of|legal/i.test(p.position || ""))); }
function reviewWeight(reviewee, reviewer, role){
  const r = person(reviewer.id) || reviewer, gr = wGroup(r); let ge = wGroup(reviewee);
  if(gr === "eq") return 2;
  const joanE = /nest partner/i.test(reviewee.position || ""), joanR = /nest partner/i.test(r.position || "");
  if(ge === "nest" && joanE && gr === "itpe") ge = "op";
  let w = wSenior(r) ? (gr === ge ? 2 : 1) : (gr === ge ? 1 : 0.5);
  if(joanR && ge === "ops") w = 2;
  return w;
}

const XL = (() => {
  const NAVY = "FF0E2150", SOFT = "FFF2F5FA", MID = "FFE1F3F5", LINE = "FFD9DEE7", GREY = "FF5C6675";
  const thin = { style:"thin", color:{ argb:LINE } }; const box = { top:thin, left:thin, bottom:thin, right:thin };
  const headRow = (ws, r, vals, leftCols) => { const L = leftCols == null ? 3 : leftCols; const row = ws.getRow(r); vals.forEach((v, i) => { const cell = row.getCell(i+1); cell.value = v; cell.font = { bold:true, color:{ argb:"FFFFFFFF" }, size:10 }; cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:NAVY } }; cell.alignment = { vertical:"middle", horizontal: i < L ? "left" : "center", wrapText:true }; cell.border = box; }); row.height = 34; return row; };
  const title = (ws, r, text, size) => { const cell = ws.getCell(r, 1); cell.value = enExport(text); cell.font = { bold:true, size: size || 14, color:{ argb:NAVY } }; };
  const sub = (ws, r, text) => { const cell = ws.getCell(r, 1); cell.value = enExport(text); cell.font = { size:10, color:{ argb:GREY } }; };
  const num = (cell, v, dec) => { if(v == null || Number.isNaN(v)) { cell.value = "—"; cell.alignment = { horizontal:"center" }; return; } cell.value = dec ? Math.round(v * 10) / 10 : v; cell.numFmt = dec ? "0.0" : "0"; cell.alignment = { horizontal:"center" }; };

  return { NAVY, SOFT, MID, LINE, GREY, box, headRow, title, sub, num, na };

    const list = byReviewee[p.id].slice().sort((x,y) => order[x.role] - order[y.role] || fullName(x.reviewer).localeCompare(fullName(y.reviewer)));
    const opinions = list.filter(a => a.role !== 'self'), selfA = list.find(a => a.role === 'self');
    const lead = list.find(a => a.role === 'lead'); const st = stats[p.id];
    const allQ = unionQuestions([selfA, ...opinions].filter(Boolean));   // las preguntas de SUS cuestionarios (autoevaluación primero), no los diez del ciclo
    const ws = wb.addWorksheet(sheetName(`${p.last_name}, ${p.first_name}`), { views:[{ state:"frozen", xSplit:1, ySplit:6 }] });
    title(ws, 1, fullName(p), 16); sub(ws, 2, [TEAM_LABEL[p.team], p.position].filter(Boolean).join(" · "));
    sub(ws, 3, `${c.name}${c.period_label ? " · " + c.period_label : ""} · Lead reviewer: ${lead ? fullName(lead.reviewer) : "—"} · ${opinions.length} ${opinions.length === 1 ? "response" : "responses"} · "—" = that question is not part of the reviewer's questionnaire`);
    let r = 6;
    // UNA tabla ancha: evaluador, rol, peso y todas las preguntas del ciclo en su orden (puntuaciones y textos mezclados como en el formulario)
    const FIRST = 4, TXT_W = 46, SC_W = 13;
    const head = ["Reviewer", "Role", "Weight"].concat(allQ.map(qq => qq.kind === 'scale' ? short(qq.text) : qq.text));
    headRow(ws, r, head); ws.getRow(r).height = 48; r++;
    const nCols = head.length;
    const fillRow = (row, a, by, isSelf) => {
      row.getCell(1).value = fullName(a.reviewer); row.getCell(1).font = { bold:true }; row.getCell(1).alignment = { vertical:"top" };
      row.getCell(2).value = ROLE_EN[a.role] + (a.reviewer.team && !isSelf ? " · " + (TEAM_LABEL[a.reviewer.team]||"") : ""); row.getCell(2).font = { size:9, color:{ argb:GREY } }; row.getCell(2).alignment = { vertical:"top", wrapText:true };
      if(isSelf){ row.getCell(3).value = "—"; row.getCell(3).alignment = { horizontal:"center", vertical:"top" }; } else num(row.getCell(3), reviewWeight(p, a.reviewer, a.role), true), row.getCell(3).alignment = { horizontal:"center", vertical:"top" };
      let lines = 1;
      const mine = codesOf(a); allQ.forEach((qq, j) => { const cell = row.getCell(FIRST + j); if(!mine.has(qq.code)){ XL.na(cell); return; } const v = by[qq.code]; const ok = v != null && String(v).trim() !== "";
        if(qq.kind === 'scale'){ num(cell, ok ? Number(v) : null, false); cell.alignment = { horizontal:"center", vertical:"top" }; }
        else { cell.value = ok ? String(v) : ""; cell.alignment = { wrapText:true, vertical:"top" }; if(ok) lines = Math.max(lines, Math.ceil(String(v).length / (TXT_W * 1.05)) + String(v).split("\n").length - 1); } });
      row.height = Math.min(300, Math.max(18, lines * 15 + 4));
      row.eachCell({ includeEmpty:true }, cell => { if(cell.col <= nCols) cell.border = box; });
    };
    for(const a of opinions){ fillRow(ws.getRow(r), a, ansOf(a), false); r++; }
    // debajo de las puntuaciones: autoevaluación (con sus textos), media aritmética y media ponderada
    if(selfA){ const row = ws.getRow(r); fillRow(row, selfA, ansOf(selfA), true); row.getCell(1).value = "Self-assessment"; row.getCell(2).value = fullName(p); row.eachCell({ includeEmpty:true }, cell => { if(cell.col <= nCols) cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:SOFT } }; }); r++; }
    else { const row = ws.getRow(r); row.getCell(1).value = "Self-assessment"; row.getCell(1).font = { bold:true }; row.getCell(2).value = "not submitted"; row.getCell(2).font = { size:9, color:{ argb:GREY } }; row.eachCell({ includeEmpty:true }, cell => { if(cell.col <= nCols){ cell.border = box; cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:SOFT } }; } }); for(let x = 1; x <= nCols; x++){ const cell = row.getCell(x); cell.border = box; cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:SOFT } }; } r++; }
    if(scaleQ.length){
      const means = [
        ["Average", "every response counts the same", SOFT, false, code => { const o = st.per[code]; return o && o.n ? o.sum / o.n : null; }],
        ["Weighted average", "weight by reviewer: partners 2 · same group senior 2 / junior 1 · other group senior 1 / junior 0.5", MID, true, code => { const o = st.per[code]; return o && o.w ? o.wsum / o.w : null; }],
      ];
      for(const [label, note, fill, bold, fn] of means){ const row = ws.getRow(r); row.getCell(1).value = label; row.getCell(1).font = { bold:true }; row.getCell(2).value = note; row.getCell(2).font = { size:9, color:{ argb:GREY } };
        allQ.forEach((qq, j) => { if(qq.kind !== 'scale') return; const cell = row.getCell(FIRST + j); num(cell, fn(qq.code), true); if(bold) cell.font = { bold:true }; });
        for(let x = 1; x <= nCols; x++){ const cell = row.getCell(x); cell.border = box; cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:fill } }; } r++; }
    }
    ws.getColumn(1).width = 26; ws.getColumn(2).width = 24; ws.getColumn(3).width = 7;
    allQ.forEach((qq, j) => ws.getColumn(FIRST + j).width = qq.kind === 'scale' ? SC_W : TXT_W);
  }
  const filename = `${c.name}${revieweeId ? " - " + fullName(person(revieweeId) || people[0]) : ""}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  return { wb, filename, people: people.length, answers: as.length };
}

/* ---------- ZIP con todo lo de un ciclo: una carpeta por persona (Hugo, 15-sep-2026) ----------
   Para quien ve todas las reviews: descarga de una vez la autoevaluación de cada persona en PDF, el Excel con todas las
   respuestas que ha recibido (el mismo de su ficha) y el PDF de sus resultados, para archivarlo en la carpeta confidencial de Abac. */
function loadJSZip(){ return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", () => !!window.JSZip); }
const zipSafe = s => enExport(s).replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, " ").trim();
let ZIP_CANCEL = false;
async function exportCycleZip(cycleId){
  if(!canSeeAll()) return toast("Only for people who see all reviews", true);
  const c = byId(CYCLES, cycleId); ZIP_CANCEL = false;
  openModal(`<h2>Download all answers</h2>
    <p class="sm">For <b>${esc(cname(c, false))}</b>, one folder per person with their self-assessment as a PDF, the Excel with all the answers they received and the PDF of their results.</p>
    <p class="sm mut">This takes a little while: all the PDFs and Excel files are generated in the browser. Do not close the tab.</p>
    <div class="row" style="align-items:center;gap:10px;margin-top:10px"><div class="spin"></div><span class="sm b" id="zipState">Preparing…</span></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="ZIP_CANCEL=true;closeModal()">Cancel</button></div>`);
  const state = t => { const el = document.getElementById("zipState"); if(el) el.textContent = t; };
  const pause = () => new Promise(r => setTimeout(r, 0));
  try{
    await loadJSZip(); await pdfLoad(); await loadExcelJS();
    const { data:as, error } = await sb.from("assignments").select(ASSIGN_SELECT).eq("cycle_id", cycleId); if(error) throw error;
    if(!as || !as.length){ closeModal(); return toast("This cycle has no assignments"); }
    const people = [...new Map(as.map(a => [a.reviewee_id, a.reviewee])).values()].sort((x, y) => (TEAM_LABEL[x.team]||"").localeCompare(TEAM_LABEL[y.team]||"") || (x.last_name||"").localeCompare(y.last_name||""));
    const selfs = as.filter(a => a.role === 'self' && a.status === 'submitted');
    const { data:ans } = selfs.length ? await sb.from("answers").select("*").in("assignment_id", selfs.map(a => a.id)) : { data:[] };
    const zip = new JSZip(); const root = zip.folder(zipSafe(c.name));
    let files = 0;
    for(let i = 0; i < people.length; i++){
      if(ZIP_CANCEL) return toast("Download cancelled");
      const p = people[i]; state(`${i + 1} of ${people.length} · ${fullName(p)}`); await pause();
      const items = [];
      // 1. su autoevaluación enviada
      const sa = selfs.find(a => a.reviewee_id === p.id); const form = sa ? byId(FORMS, sa.form_id) : null;
      if(sa && form){
        const byQ = {}; for(const an of (ans||[]).filter(x => x.assignment_id === sa.id)) byQ[an.question_id] = an;
        const { pdf, filename } = await buildFormPdf({ a: sa, form, answers: byQ, cycle: c });
        items.push([filename, pdf.blob()]);
      }
      // 2. el Excel con todas las respuestas que ha recibido: el mismo que descarga su lead desde la ficha (Hugo, 22-sep-2026)
      const wbk = await buildCycleWorkbook(cycleId, p.id, { summary:false });
      if(wbk) items.push([`Responses received - ${fullName(p)}.xlsx`, await wbk.wb.xlsx.writeBuffer()]);
      // 3. el PDF de sus resultados
      const view = await buildResultsView(p.id, cycleId, async cid => { const { data } = await sb.rpc("results_for", { p_cycle: cid, p_reviewee: p.id }); return data || []; });
      if(view && view.cur && (((view.cur.rows || []).length) || view.cur.fr)){
        const { pdf, filename } = await buildResultsPdf(view); items.push([filename, pdf.blob()]);
      }
      if(!items.length) continue;   // sin nada enviado: no se crea la carpeta
      const folder = root.folder(zipSafe(fullName(p)));
      for(const [name, data] of items){ folder.file(zipSafe(name), data); files++; }
    }
    if(!files){ closeModal(); return toast("There is nothing submitted to download"); }
    state("Compressing…"); await pause();
    const blob = await zip.generateAsync({ type:"blob", compression:"STORE" });   // los PDF y los xlsx ya van comprimidos
    const u = URL.createObjectURL(blob); const el = document.createElement("a"); el.href = u; el.download = zipSafe(`Abac RRHH - ${enExport(c.name)} - responses.zip`); el.click(); setTimeout(() => URL.revokeObjectURL(u), 8000);
    closeModal(); toast(`ZIP downloaded: ${people.length} people, ${files} files`);
  }catch(e){ closeModal(); err(e, "Could not prepare the ZIP"); }
}

let TOUR = null;
function endTour(){ if(!TOUR) return; ["hole","block","tip"].forEach(k => TOUR[k] && TOUR[k].remove()); document.removeEventListener("keydown", TOUR.key); TOUR = null; }
async function startTour(id){
  const t = TOURS[id]; if(!t) return; endTour();
  if(PAGE !== t.page){ PAGE = t.page; ARG = null; await render(); }
  TOUR = { id, steps: t.steps.filter(st => st[0]()), i: 0 };
  if(!TOUR.steps.length){ TOUR = null; return toast("Nothing to show on this page yet"); }
  TOUR.block = document.createElement("div"); TOUR.block.className = "tour-block"; TOUR.block.onclick = endTour;
  TOUR.hole = document.createElement("div"); TOUR.hole.className = "tour-hole";
  TOUR.tip = document.createElement("div"); TOUR.tip.className = "tour-tip";
  document.body.append(TOUR.block, TOUR.hole, TOUR.tip);
  TOUR.key = e => { if(e.key === "Escape") endTour(); else if(e.key === "ArrowRight") tourStep(1); else if(e.key === "ArrowLeft") tourStep(-1); };
  document.addEventListener("keydown", TOUR.key);
  tourShow();
}
function tourStep(d){ if(!TOUR) return; const n = TOUR.i + d; if(n < 0) return; if(n >= TOUR.steps.length) return endTour(); TOUR.i = n; tourShow(); }
async function tourSettle(el){ let prev = null; for(let k = 0; k < 20; k++){ const r = el.getBoundingClientRect(); const now = [r.left, r.top, r.width, r.height].map(Math.round).join(); if(now === prev) return; prev = now; await new Promise(z => setTimeout(z, 40)); } }
async function tourShow(){
  const T = TOUR; const [find, h, b0] = T.steps[T.i]; const body = typeof b0 === "function" ? b0() : b0; const el = find(); if(!el) return tourStep(1);
  const tall = uiRect(el).height > uiVH() * 0.75;
  el.scrollIntoView({ block: tall ? "start" : "center", behavior:"instant" });
  if(tall){ const c = document.getElementById("content"); if(c) c.scrollTop = Math.max(0, c.scrollTop - 12); }
  await tourSettle(el); if(TOUR !== T) return;
  const r = uiRect(el), pad = 6, vw = uiVW(), vh = uiVH();
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad), w = Math.min(r.width + 2 * pad, vw - left - 4), hh = Math.min(r.height + 2 * pad, vh - top - 4);
  if(!T.shown){ T.hole.style.transition = "none"; }   // el primer paso aparece en su sitio, sin volar desde la esquina
  Object.assign(T.hole.style, { top: top + "px", left: left + "px", width: w + "px", height: hh + "px" });
  if(!T.shown){ void T.hole.offsetWidth; T.hole.style.transition = ""; T.shown = true; }
  const last = T.i === T.steps.length - 1;
  T.tip.innerHTML = `<div class="n">${esc(TOURS[T.id].title)} · ${T.i + 1} of ${T.steps.length}</div><div class="h">${esc(h)}</div><div class="b">${body}</div>
    <div class="f"><div class="dots">${T.steps.map((_, k) => `<i class="${k === T.i ? "on" : ""}"></i>`).join("")}</div>
    ${T.i > 0 ? `<button class="btn sm" onclick="tourStep(-1)">Back</button>` : `<button class="btn sm ghost" onclick="endTour()">Close</button>`}
    <button class="btn sm pri" onclick="tourStep(1)">${last ? "Done" : "Next"}</button></div>`;
  T.tip.style.animation = "none"; void T.tip.offsetWidth; T.tip.style.animation = "";
  // el globo, debajo del elemento si cabe; si no, encima; si tampoco, al lado; y siempre dentro de la pantalla
  const tw = 330, th = T.tip.offsetHeight || 170;
  let tl = Math.min(Math.max(8, left), vw - tw - 8), tt;
  if(top + hh + 10 + th < vh) tt = top + hh + 10;
  else if(top - 10 - th > 0) tt = top - 10 - th;
  else { tt = Math.max(8, Math.min(vh - th - 8, top)); tl = left + w + 12 + tw < vw ? left + w + 12 : Math.max(8, left - tw - 12); }
  Object.assign(T.tip.style, { left: tl + "px", top: tt + "px" });
}

// Fechas en texto «dd/mm/yyyy» (Hugo, 04-nov-2026): el campo de fecha del navegador se pinta en el idioma del ordenador

const isoToDmy = iso => { if(!iso) return ""; const [y, m, d] = String(iso).slice(0, 10).split("-"); return d && m && y ? `${d}/${m}/${y}` : ""; };
function dateField(id, iso){ return `<div class="datewrap"><input type="text" id="${id}" class="datefield" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" value="${isoToDmy(iso)}"><i class="ti ti-calendar dicon" onclick="document.getElementById('${id}').focus()"></i></div>`; }
// Calendario propio en inglés (Hugo, 04-nov-2026: «que aquí en la fecha salga lo del calendario»): el del navegador sale en su idioma.
// Se abre al entrar en el campo; semana de lunes a domingo; «Today» y «Clear»; se puede seguir escribiendo la fecha a mano.
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
let CAL = null;
function closeCal(){ if(CAL){ CAL.remove(); CAL = null; } }
function openCal(inp){
  if(CAL && CAL.inp === inp) return; closeCal();
  const sel = readDate(inp.id) || null; let cur = sel ? new Date(sel + "T00:00:00") : new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const m = document.createElement("div"); m.className = "calpop"; m.inp = inp;
  const draw = () => { const y = cur.getFullYear(), mo = cur.getMonth(), first = (new Date(y, mo, 1).getDay() + 6) % 7, n = new Date(y, mo + 1, 0).getDate(), today = isoOf(new Date());
    let h = `<div class="cal-h"><button type="button" data-n="-1" aria-label="Previous month"><i class="ti ti-chevron-left"></i></button><span>${MONTHS_LONG[mo]} ${y}</span><button type="button" data-n="1" aria-label="Next month"><i class="ti ti-chevron-right"></i></button></div><div class="cal-g">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(d => `<b>${d}</b>`).join("")}`;
    for(let i = 0; i < first; i++) h += `<span></span>`;
    for(let d = 1; d <= n; d++){ const di = isoOf(new Date(y, mo, d)); h += `<button type="button" class="d ${di === sel ? "on" : ""} ${di === today ? "today" : ""}" data-d="${di}">${d}</button>`; }
    m.innerHTML = h + `</div><div class="cal-f"><button type="button" data-t="today">Today</button><button type="button" data-t="clear">Clear</button></div>`; };
  draw();
  m.addEventListener("mousedown", e => e.preventDefault());   // que el campo no pierda el foco al pulsar dentro
  m.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.n){ cur = new Date(cur.getFullYear(), cur.getMonth() + +b.dataset.n, 1); draw(); return; }
    inp.value = b.dataset.d ? isoToDmy(b.dataset.d) : b.dataset.t === "today" ? isoToDmy(isoOf(new Date())) : "";
    inp.dispatchEvent(new Event("input", { bubbles:true })); inp.dispatchEvent(new Event("change", { bubbles:true })); closeCal(); });
  document.body.appendChild(m); CAL = m; placeCal();
  requestAnimationFrame(() => m.classList.add("show"));
}
// debajo del campo (encima si no cabe); se recoloca si la ventana o el modal se desplazan
// el lienzo está escalado al 80 % (body con transform): las coordenadas van en las unidades de la app, como en los desplegables (uiRect)
function placeCal(){ if(!CAL) return; const r = uiRect(CAL.inp), h = CAL.offsetHeight || 300, vw = uiVW(), vh = uiVH();
  CAL.style.left = Math.max(8, Math.min(r.left, vw - 272)) + "px";
  CAL.style.top = (r.bottom + 6 + h > vh ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px"; }
document.addEventListener("focusin", e => { if(e.target.matches && e.target.matches(".datefield")) openCal(e.target); else if(CAL && !CAL.contains(e.target)) closeCal(); });
document.addEventListener("mousedown", e => { if(CAL && !CAL.contains(e.target) && e.target !== CAL.inp && !(e.target.closest && e.target.closest(".dicon"))) closeCal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && CAL){ closeCal(); e.stopPropagation(); } }, true);

// lee el campo: "" -> null; dd/mm/yyyy (o d/m/yyyy, con / - .) o yyyy-mm-dd -> ISO; si no es una fecha válida -> undefined
function readDate(id){ const el = document.getElementById(id); const t = (el && el.value || "").trim(); if(!t) return null;
  let d, m, y, x;
  if((x = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) [, d, m, y] = x; else if((x = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = x; else return undefined;
  const dt = new Date(Date.UTC(+y, +m - 1, +d)); if(dt.getUTCFullYear() !== +y || dt.getUTCMonth() !== +m - 1 || dt.getUTCDate() !== +d) return undefined;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }

function enPlantilla(p, c){

// Regla de diciembre, según Hugo (04-sep-2026): Deal Team y Operations evalúan al Deal Team; todo el mundo (incluido Nest) evalúa a Operations.
// A Nest lo evalúan el resto de Nest y Operations (confirmado por Hugo, 04-sep-2026). Los socios no se incluyen como evaluados.
// Crea asignaciones en tandas de 100: en una sola petición, con ~500 filas (regla de diciembre con socios y Joan),
// la comprobación de permisos fila a fila superaba el tiempo máximo de Supabase («statement timeout», 27-oct-2026).
async function upsertAssignments(rows){
  for(let i = 0; i < rows.length; i += 100){
    const { error } = await sb.from("assignments").upsert(rows.slice(i, i + 100), { onConflict:"cycle_id,reviewee_id,reviewer_id,role", ignoreDuplicates:true });
    if(error) return { error };
  }
  // El lead responde el cuestionario normal, como uno más (Hugo, 27-oct-2026): si ya tenía fila de «compañero» con esa
  // persona, sobra (saldría dos veces en Mis reviews). Solo se quita si está sin empezar; lo empezado no se toca.
  for(const r of rows.filter(x => x.role === "lead")){
    const { error } = await sb.from("assignments").delete().eq("cycle_id", r.cycle_id).eq("reviewee_id", r.reviewee_id).eq("reviewer_id", r.reviewer_id).eq("role", "peer").eq("status", "pending");
    if(error) return { error };
  }
  return { error:null };
}
async function prefill360(cycleId){

  const { data:leads } = await sb.from("assignments").select("reviewee_id,reviewer_id").eq("cycle_id", cycleId).eq("role", "lead");
  const esLead = (rv, r) => (leads||[]).some(l => l.reviewee_id === rv && l.reviewer_id === r);
  const fuera = PEOPLE.filter(p => p.active && !enPlantilla(p, c));
  for(const rv of act){
    if(!isEvaluated(rv)) continue;
    const sf = roleForm(c,"self",rv); if(sf) rows.push({cycle_id:cycleId, reviewee_id:rv.id, reviewer_id:rv.id, role:"self", form_id:sf});
    const equity = r => r.is_partner && !isEvaluated(r);   // equity partners: evalúan a todo el mundo, a ellos nadie
    // socio de Nest que se evalúa (Joan Pina): le evalúa todo el mundo y él evalúa a todo el mundo (Hugo, 09-oct-2026)
    const cruza = p => p.is_partner && isEvaluated(p) && p.team === 'nest';
    const reviewers = act.filter(r => r.id!==rv.id && (equity(r) || cruza(rv) || cruza(r) || (rv.team==='deal' ? ['deal','operations'].includes(r.team) : rv.team==='operations' ? true : rv.team==='nest' ? ['nest','operations'].includes(r.team) : false)));
    for(const r of reviewers){ if(esLead(rv.id, r.id)) continue; const pf = roleForm(c,"peer",rv,r); if(pf) rows.push({cycle_id:cycleId, reviewee_id:rv.id, reviewer_id:r.id, role:"peer", form_id:pf}); }
  }
  if(!rows.length) return toast("The cycle is missing forms", true);
  window.PENDING_ROWS = rows;
  const nSelf = rows.filter(r=>r.role==='self').length, nPeer = rows.length - nSelf;

    <ul class="sm" style="margin:6px 0 10px;padding-left:18px;line-height:1.7"><li>Each <b>Deal Team</b> member is reviewed by the Deal Team and Operations.</li><li>Each <b>Operations</b> member is reviewed by everyone: Deal Team, Operations and Nest.</li><li>The <b>equity partners</b> review everyone, Nest included; nobody reviews them.</li><li>The <b>Nest partner</b> who is evaluated is reviewed by everyone, and reviews everyone.</li><li>Each <b>Nest</b> member is reviewed by the rest of Nest and Operations.</li><li>Only people marked “is evaluated” under People are included as reviewees (partners are not, unless indicated). The lead reviewer is assigned separately (“Lead reviewer by team” or one by one).</li></ul>
    <p class="xs mut">Existing assignments are not duplicated. Afterwards you can remove or add peers by hand.</p>

}

async function applyBulkLeads(cycleId){

/* ----- Ponderaciones por evaluador y competencia (Hugo, 04-nov-2026) — BORRADOR, NO SE APLICA -----
   Hugo pasó «Ponderación_puntuaciones_2026.xlsx»: una hoja por equipo evaluado (Deal Team, Nest, Operations), una fila por quien
   evalúa a ese equipo y una columna por competencia con el peso de su opinión; en blanco, lo que no aplica a ese equipo.
   «Aún no lo tenemos claro»: de momento solo se exporta la plantilla (vacía: «no tengas en cuenta las ponderaciones que hay») y
   se importa para VER lo que trae. No se guarda en la base de datos y la media ponderada sigue con review_weight(). */
const W_COMP = [["ambassador","Abac Ambassador"],["judgement","Investment Judgement"],["attitude","Attitude"],["entrepreneurial","Entrepreneurial"],["ownership","Ownership and accountability"],["hard_skills","Hard Technical Skills"],["soft_skills","Soft Technical Skills"]];
const W_TEAMS = [["deal","Deal Team"],["nest","Nest"],["operations","Operations"]];
// competencias que puntúa el cuestionario de ese equipo (las que no, van en gris)
function wCodesFor(team){ const t = team === "operations" ? "ops" : team;
  return new Set(FORMS.filter(f => (f.code || "").startsWith(`dic_${t}_by_`)).flatMap(f => f.form_sections.flatMap(x => x.questions)).filter(q => q.kind === "scale").map(q => q.code)); }
// quién evalúa a cada equipo, como en el Excel de Hugo: Deal Team ← socios, Joan, Deal Team y Operations; Nest ← socios, Nest
// (Joan incluido) y Operations; Operations ← todo el mundo. Quien evalúa a Joan desde el Deal Team usa el cuestionario de Deal,
// así que va en la hoja de Deal Team y no en la de Nest. La gente es la del ciclo (o la activa si aún no tiene asignaciones).
async function wReviewers(cycleId){
  const c = byId(CYCLES, cycleId);
  const { data:asg } = await sb.from("assignments").select("reviewee_id,reviewer_id").eq("cycle_id", cycleId);
  const ids = new Set((asg || []).flatMap(a => [a.reviewee_id, a.reviewer_id]));
  const gente = ids.size ? PEOPLE.filter(p => ids.has(p.id)) : PEOPLE.filter(p => p.active && enPlantilla(p, c));
  const out = { deal:new Set(), nest:new Set(), operations:new Set() };
  const equity = r => r.is_partner && !isEvaluated(r), cruza = r => r.is_partner && isEvaluated(r) && r.team === 'nest';
  for(const r of gente){ if(equity(r) || cruza(r) || ['deal','operations'].includes(r.team)) out.deal.add(r.id); if(equity(r) || ['nest','operations'].includes(r.team)) out.nest.add(r.id); out.operations.add(r.id); }
  const orden = p => (p.is_partner && !isEvaluated(p) ? 0 : p.is_partner ? 1 : 2);
  const T = { deal:0, nest:1, operations:2 };
  for(const k in out) out[k] = [...out[k]].map(person).filter(Boolean).sort((a, b) => orden(a) - orden(b) || (T[a.team] ?? 9) - (T[b.team] ?? 9) || fullName(a).localeCompare(fullName(b)));
  return out;
}

// Lee el Excel (el de la plantilla o uno «de este estilo», como el de Hugo): por hoja, la fila de cabecera con las competencias,
// el equipo por el nombre de la hoja y cada fila de evaluador reconocida por correo o por nombre
async function wLoad(cycleId, file){
  toast("Reading the file…");
  let sheets; try{ sheets = await impReadFile(file); }catch(e){ console.warn(e); return toast("Could not read the file. Save it as .xlsx and try again", true); }
  const idx = impIndex(); const norm = x => impNorm(x);
  const teamOf = n => { const k = norm(n); return /nest/.test(k) ? "nest" : /oper|ops/.test(k) ? "operations" : /deal|\bpe\b|_pe\b|it_pe|investment/.test(k) ? "deal" : null; };
  const res = [];
  for(const sh of sheets){
    const team = teamOf(sh.name); if(!team) continue;
    const head = sh.rows.findIndex(r => W_COMP.filter(([, l]) => r.some(v => norm(v) === norm(l))).length >= 3); if(head < 0) continue;
    const H = sh.rows[head]; const colOf = l => H.findIndex(v => norm(v) === norm(l));
    const cols = W_COMP.map(([code, l]) => ({ code, l, ci: colOf(l) }));
    const mailC = H.findIndex(v => /e-?mail|correo/.test(norm(v))); const codes = wCodesFor(team);
    const filas = [], avisos = [];
    for(const row of sh.rows.slice(head + 1)){
      const nombre = (row[0] || "").trim(); if(!nombre) continue;
      if(!cols.some(x => x.ci >= 0 && String(row[x.ci] || "").trim())) continue;     // totales, notas…
      const m = (mailC >= 0 && row[mailC] ? impMatch(row[mailC], idx) : null) || impMatch(nombre, idx);
      if(!(m && m.p) && /^(evaluad|evaluador|reviewers?|reviewees?|check|total|sum|count|n[ºo]\b)/i.test(impNorm(nombre))) continue;
      const w = {}; const bad = [];
      for(const x of cols){ if(x.ci < 0) continue; const v = String(row[x.ci] || "").trim(); if(!v) continue;
        const n = Number(v.replace(",", ".")); if(!isFinite(n) || n < 0){ if(!bad.some(b => b.startsWith("not a number"))) bad.push(`not a number: “${v}”`); continue; }
        w[x.code] = n; if(codes.size && !codes.has(x.code)) bad.push(`${x.l} is not scored for ${TEAM_LABEL[team]}`); }
      if(!(m && m.p)) avisos.push(`“${nombre}”: not recognised`);
      filas.push({ nombre, p: m && m.p, w, bad });
    }
    res.push({ hoja: sh.name, team, filas, avisos, codes });
  }
  if(!res.length) return toast("No sheet looks like a weights sheet (one per team, with the competencies as column titles)", true);
  const tabla = r => `<table class="sm" style="margin-top:6px"><tr><th>Reviewer</th>${W_COMP.map(([, l]) => `<th style="text-align:center" title="${esc(l)}">${esc(l.split(" ")[0])}</th>`).join("")}<th></th></tr>

    ${res.map(r => `<h3 style="margin:14px 0 4px">${esc(TEAM_LABEL[r.team])} being reviewed <span class="xs mut">· sheet “${esc(r.hoja)}” · ${r.filas.filter(f => f.p).length} reviewers recognised${r.avisos.length ? ` · ${r.avisos.length} not recognised` : ""}</span></h3>${tabla(r)}`).join("")}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);
  const mo = document.querySelector(".modal-bg.open .modal"); if(mo){ mo.style.maxWidth = "1100px"; mo.style.width = "96vw"; mo.style.maxHeight = "86vh"; mo.style.overflow = "auto"; }
}

/* ----- Importar asignaciones desde Excel (Hugo, 09-sep-2026) -----
   Un Excel (o CSV) con las personas y sus lead reviewers y, en junio, sus compañeros, venga como venga: se localiza la fila de
   cabecera y el papel de cada columna por su título (persona / lead reviewer / compañeros) o, si no hay títulos, por su contenido
   (columnas llenas de nombres de la firma, en ese orden). Cada persona se reconoce por nombre completo, apellidos, nombre de pila
   si es único, iniciales con apellido o correo. Antes de tocar nada se enseña la vista previa con lo que va a cambiar; lo que no
   se reconoce se corrige ahí mismo eligiendo a la persona. Diciembre: solo lead reviewers (los compañeros siguen la regla de
   equipos). Junio: lead reviewers y compañeros. Lo ya empezado o enviado nunca se toca. */
const IMP_STOP = new Set(["de","del","la","las","los","el","y","i","e","da","do","dos","das","van","von","d","the","and","mr","mrs","sr","sra"]);
const impNorm = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9@.\-]+/g, " ").trim();
const impTokens = s => impNorm(s).replace(/[@.\-]/g, " ").split(" ").filter(t => t && !IMP_STOP.has(t));
const impKey = s => impTokens(s).join(" ");
const impSplit = s => String(s || "").split(/[,;\/\n|]+|\s+y\s+|\s+and\s+|\s*&\s*/i).map(x => x.trim()).filter(Boolean);
const impColName = i => { let n = i, out = ""; do { out = String.fromCharCode(65 + (n % 26)) + out; n = Math.floor(n / 26) - 1; } while(n >= 0); return out; };
function impIndex(){ return PEOPLE.filter(p => p.active).map(p => ({ p, full: impTokens(fullName(p)), email: impNorm(p.email).replace(/ /g, "") })); }
// Reconoce a una persona en un texto. Devuelve { p }, { ambiguous:[...] } o null.
function impMatch(text, idx){
  const raw = impNorm(text); if(!raw) return null;
  if(raw.includes("@")){ const em = raw.replace(/ /g, ""); const hit = idx.filter(x => x.email === em); return hit.length === 1 ? { p: hit[0].p } : null; }
  const toks = impTokens(text); if(!toks.length) return null;
  if(toks.length === 1 && toks[0].length <= 2) return null;                 // una inicial sola no identifica a nadie
  const cands = [];
  for(const x of idx){
    const used = new Set(); let hits = 0;
    for(const t of toks){ const k = x.full.findIndex((w, i) => !used.has(i) && (w === t || (t.length <= 2 && w.startsWith(t)))); if(k >= 0){ used.add(k); hits++; } }
    if(!hits || hits < toks.length - (toks.length >= 3 ? 1 : 0)) continue;   // como mucho una palabra suelta («(socio)»), y solo si hay tres o más
    if(hits === 1 && toks.length === 1 && x.full.length > 1 && !x.full.includes(toks[0])) continue;
    cands.push({ x, score: hits * 10 + (hits === x.full.length ? 5 : 0) - (toks.length - hits) * 3 });
  }
  if(!cands.length) return null;
  cands.sort((a, b) => b.score - a.score);
  const top = cands.filter(k => k.score === cands[0].score);
  return top.length > 1 ? { ambiguous: top.map(k => k.x.p) } : { p: cands[0].x.p };
}
// Papel de una columna según su título
const IMP_HEAD = [
  ["lead", /\b(lead|l\.?r\.?|manager|responsable|supervisor|jef[ea]|head|principal|reporta|reports?|tutora?)\b/],
  ["peer", /\b(comp|compa[n]er[oa]s?|companys?|colegas?|peers?|revisor(es|a|as)?|reviewers?|evaluador(es|a|as)?|colleagues?|360|evalua(n)?)\b/],
  ["who",  /\b(persona|evaluad[oa]s?|evaluee|reviewee|employee|emplead[oa]s?|trabajador(a|es|as)?|treballador|nombre|nom|name|apellidos?|surname|miembro|member|avaluat|e-?mail|correo)\b/],
];
const impHeadRole = t => { const n = impNorm(t); if(!n) return null; for(const [r, re] of IMP_HEAD) if(re.test(n)) return r; return null; };
// Lee .xlsx (ExcelJS) o .csv → [{ name, rows:[[celda…]] }]
async function impReadFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".csv") || name.endsWith(".txt")){
    const txt = await file.text(); const lines = txt.split(/\r?\n/).filter(l => l.trim());
    const delim = [";", ",", "\t"].map(d => [d, (lines[0] || "").split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const parse = l => { const out = []; let cur = "", q = false; for(const ch of l){ if(ch === '"') q = !q; else if(ch === delim && !q){ out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); };
    return [{ name: file.name, rows: lines.map(parse) }];
  }
  await loadExcelJS();
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const sheets = [];
  wb.eachSheet(ws => { if(ws.state && ws.state !== "visible") return;   // hojas ocultas (p. ej. la lista del desplegable de la plantilla): fuera
    const rows = []; ws.eachRow({ includeEmpty:false }, row => { const vals = []; row.eachCell({ includeEmpty:true }, (cell, col) => { vals[col - 1] = String(cell.text == null ? "" : cell.text).trim(); }); rows.push(vals); }); if(rows.length) sheets.push({ name: ws.name, rows }); });
  return sheets;
}
// Cabecera y papel de cada columna
function impAnalyze(rows, idx){
  const ncol = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const filled = r => r.filter(v => v && String(v).trim()).length;
  let head = -1, best = 0;
  rows.slice(0, 15).forEach((r, i) => { if(filled(r) < 2) return; const n = r.filter(v => impHeadRole(v)).length; if(n > best){ best = n; head = i; } });
  const data = rows.slice(head + 1);
  const cols = [];
  for(let ci = 0; ci < ncol; ci++){
    const vals = data.map(r => r[ci]).filter(v => v && String(v).trim());
    const title = head >= 0 ? (rows[head][ci] || "") : "";
    if(!vals.length && !title) continue;
    let parts = 0, ok = 0; for(const v of vals) for(const t of impSplit(v)){ parts++; const m = impMatch(t, idx); if(m && m.p) ok++; }
    cols.push({ ci, title, role: head >= 0 ? impHeadRole(title) : null, rate: parts ? ok / parts : 0, n: vals.length });
  }
  // columnas llenas de nombres sin título reconocible: sin cabecera, en orden persona → lead reviewer → compañeros (todas las demás);
  // con cabecera, son compañeros («Comp. 1», «Comp. 2»…) siempre que ya haya una columna de persona
  for(const col of cols){ if(col.role || col.rate < 0.5 || col.n < 2) continue;
    if(head < 0){ col.role = ["who", "lead"].find(r => !cols.some(x => x.role === r)) || "peer"; }
    else if(cols.some(x => x.role === 'who')) col.role = "peer"; }
  return { head, cols, data };
}
function importAssign(cycleId){
  let inp = document.getElementById("impFile");
  if(!inp){ inp = document.createElement("input"); inp.type = "file"; inp.id = "impFile"; inp.accept = ".xlsx,.xlsm,.csv,.txt"; inp.setAttribute("aria-label", "Assignments file"); inp.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0"; document.body.appendChild(inp); }
  inp.onchange = async () => { const f = inp.files[0]; inp.value = ""; if(f) await impLoad(cycleId, f); };
  inp.click();
}
async function impLoad(cycleId, file){
  toast("Reading the file…");
  let sheets; try{ sheets = await impReadFile(file); }catch(e){ console.warn(e); return toast("Could not read the file. Save it as .xlsx or .csv and try again", true); }
  if(!sheets.length) return toast("The file is empty", true);
  const { data:cur, error } = await sb.from("assignments").select("id,reviewee_id,reviewer_id,role,status").eq("cycle_id", cycleId); if(error) return err(error, "Import assignments");
  const idx = impIndex();
  for(const sh of sheets) sh.an = impAnalyze(sh.rows, idx);
  // la hoja con más personas reconocidas; si hay columna de lead reviewer, mejor (no una simple lista de nombres)
  const score = sh => sh.an.cols.filter(x => x.role === 'who').reduce((m, x) => Math.max(m, x.n * x.rate), 0) * (sh.an.cols.some(x => x.role === 'lead') ? 2 : 1);
  let best = 0; sheets.forEach((sh, i) => { if(score(sh) > score(sheets[best])) best = i; });
  window.IMP = { cycleId, fileName:file.name, sheets, sheet:best, map:{}, fixes:{}, opts:{ self:true }, current:cur || [], idx };
  impRender();
}
function impSetSheet(i){ IMP.sheet = +i; IMP.map = {}; impRender(); }
function impSetCol(ci, role){ IMP.map[ci] = role || ""; impRender(); }        // "" = ignorar; sin entrada = automático
function impFix(key, pid){ if(pid) IMP.fixes[key] = pid; else delete IMP.fixes[key]; impRender(); }
function impOpt(k, v){ IMP.opts[k] = v; impRender(); }
function impRole(col, isDec){ const S = IMP; if(S.map[col.ci] !== undefined) return S.map[col.ci]; return isDec && col.role === 'peer' ? "" : (col.role || ""); }
// Qué haría la importación con lo que hay ahora en el ciclo
function impPlan(){
  const S = IMP; const c = byId(CYCLES, S.cycleId); const isDec = c.kind === '360'; const { cols, data } = S.sheets[S.sheet].an;
  const roleCols = r => cols.filter(x => impRole(x, isDec) === r).map(x => x.ci);
  const whoC = roleCols("who"), leadC = roleCols("lead"), peerC = isDec ? [] : roleCols("peer");
  const resolve = txt => { const k = impKey(txt); if(S.fixes[k]) return { p: person(S.fixes[k]) }; return impMatch(txt, S.idx); };
  const resolveMulti = txts => { txts = txts.filter(Boolean); if(!txts.length) return null; let amb = null;
    if(txts.length > 1){ const m = resolve(txts.join(" ")); if(m && m.p) return m; if(m) amb = m; }
    for(const t of txts){ const m = resolve(t); if(m && m.p) return m; if(m && !amb) amb = m; }
    return amb; };
  const cur = S.current; const items = []; const seen = new Set();
  const stats = { self:0, lead:0, peerAdd:0, peerDel:0, unknown:0, blocked:0, same:0, rows:0 };
  data.forEach((row, ri) => {
    const whoTxt = whoC.map(ci => row[ci]).filter(Boolean), leadTxt = leadC.map(ci => row[ci]).filter(Boolean), peerTxt = peerC.flatMap(ci => impSplit(row[ci]));
    if(!whoTxt.length) return;
    const who = resolveMulti(whoTxt);
    if(!(who && who.p) && !leadTxt.length && !peerTxt.length) return;     // subtítulos de equipo, notas… nada que asignar
    const it = { whoTxt: whoTxt.join(" "), who, leadTxt: leadTxt.join(" "), lead: leadTxt.length ? resolveMulti(leadTxt) : null, peers: peerTxt.map(t => ({ t, m: resolve(t) })), notes: [], acts: { self:false, leadDel:null, leadAdd:null, peerAdd:[], peerDel:[] }, leadPrev:null, leadSame:false };
    items.push(it); stats.rows++;
    if(!(who && who.p)){ stats.unknown++; return; }
    const p = who.p;
    if(seen.has(p.id)){ it.notes.push("duplicate row: ignored"); return; } seen.add(p.id);
    if(!isEvaluated(p)){ it.notes.push("not evaluated (People checkbox): not assigned"); stats.blocked++; return; }
    const mine = cur.filter(a => a.reviewee_id === p.id);
    if(S.opts.self && !mine.some(a => a.role === 'self')){ if(roleForm(c, 'self', p)){ it.acts.self = true; stats.self++; } else it.notes.push("the cycle has no self-assessment questionnaire"); }
    if(it.lead && it.lead.p){
      const L = it.lead.p, cl = mine.find(a => a.role === 'lead');
      if(L.id === p.id) it.notes.push("the lead reviewer cannot be the same person");
      else if(cl && cl.reviewer_id === L.id){ it.leadSame = true; stats.same++; }
      else if(cl && cl.status !== 'pending'){ it.notes.push(`their current lead (${fullName(person(cl.reviewer_id))}) has already ${cl.status === 'submitted' ? 'submitted' : 'started'} the review: not changed`); stats.blocked++; }
      else if(!roleForm(c, 'lead', p, L)) it.notes.push("the cycle has no questionnaire for this team pair");
      else { it.acts.leadDel = cl ? cl.id : null; it.acts.leadAdd = L; it.leadPrev = cl ? person(cl.reviewer_id) : null; stats.lead++; }
    } else if(it.leadTxt) stats.unknown++;
    if(peerC.length){
      const target = []; for(const x of it.peers){ if(x.m && x.m.p){ if(x.m.p.id !== p.id && !target.some(y => y.id === x.m.p.id)) target.push(x.m.p); } else stats.unknown++; }
      const curP = mine.filter(a => a.role === 'peer');
      for(const q of target){ if(curP.some(a => a.reviewer_id === q.id)) continue; if(!roleForm(c, 'peer', p, q)){ it.notes.push(`no questionnaire for ${fullName(q)}`); continue; } it.acts.peerAdd.push(q); }
      if(it.peers.length) for(const a of curP){ if(target.some(q => q.id === a.reviewer_id)) continue; if(a.status === 'pending') it.acts.peerDel.push(a); else it.notes.push(`${fullName(person(a.reviewer_id))} is not in the Excel but has already ${a.status === 'submitted' ? 'submitted' : 'started'}: kept`); }
      stats.peerAdd += it.acts.peerAdd.length; stats.peerDel += it.acts.peerDel.length;
    }
  });
  return { c, isDec, items, stats, whoC, leadC, peerC, cols };
}
function impRender(){
  const S = IMP; const P = impPlan(); const { c, isDec, items, stats, cols } = P; const sheet = S.sheets[S.sheet];
  const people = PEOPLE.filter(p => p.active).slice().sort((a, b) => a.last_name.localeCompare(b.last_name));
  const pick = key => `<select class="inp" style="width:auto" onchange="impFix('${esc(key)}', this.value)"><option value="">Choose person…</option>${people.map(p => `<option value="${p.id}" data-p="${p.id}">${esc(fullName(p))}</option>`).join("")}</select>`;
  const who = p => `<span class="who">${av(p, "sm")}${esc(fullName(p))}</span>`;
  const unknown = (txt, m) => `<div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill bad">${m && m.ambiguous ? "several matches" : "not recognised"}</span><span class="xs mut">“${esc(txt)}”</span>${pick(impKey(txt))}</div>`;
  const nChanges = stats.self + stats.lead + stats.peerAdd + stats.peerDel;
  const mapUI = cols.map(col => { const r = impRole(col, isDec); return `<div class="col"><span class="xs mut" title="${esc(col.title || "")}">Column ${impColName(col.ci)}${col.title ? ` · ${esc(col.title)}` : ""}</span>
      <select class="inp" style="width:auto" onchange="impSetCol(${col.ci}, this.value)"><option value="" ${r === "" ? "selected" : ""}>${isDec && col.role === 'peer' ? "Ignore (peers: team rule)" : "Ignore"}</option><option value="who" ${r === "who" ? "selected" : ""}>Reviewee</option><option value="lead" ${r === "lead" ? "selected" : ""}>Lead reviewer</option>${isDec ? "" : `<option value="peer" ${r === "peer" ? "selected" : ""}>Peers reviewing them</option>`}</select></div>`; }).join("");
  const rows = items.map(it => {
    const leadCell = !it.leadTxt ? `<span class="xs mut">—</span>`
      : !(it.lead && it.lead.p) ? unknown(it.leadTxt, it.lead)
      : it.acts.leadAdd ? `${it.leadPrev ? `<span class="del">${esc(fullName(it.leadPrev))}</span> <i class="ti ti-arrow-right xs mut"></i> ` : ""}${who(it.lead.p)}`
      : who(it.lead.p);
    const peerCell = isDec ? "" : `<td>${it.peers.length ? it.peers.map(x => x.m && x.m.p ? (it.acts.peerAdd.some(q => q.id === x.m.p.id) ? `<span class="who" style="margin:2px 6px 2px 0"><b>+</b>${who(x.m.p)}</span>` : `<span class="who" style="margin:2px 6px 2px 0">${who(x.m.p)}</span>`) : unknown(x.t, x.m)).join("") + it.acts.peerDel.map(a => `<span class="who del" style="margin:2px 6px 2px 0">−&nbsp;${esc(fullName(person(a.reviewer_id)))}</span>`).join("") : `<span class="xs mut">—</span>`}</td>`;
    const what = [it.acts.self ? "creates the self-assessment" : "", it.acts.leadAdd ? (it.leadPrev ? "changes the lead reviewer" : "assigns the lead reviewer") : "", it.leadSame ? "lead reviewer unchanged" : "", it.acts.peerAdd.length ? `+${it.acts.peerAdd.length} peer${it.acts.peerAdd.length > 1 ? "s" : ""}` : "", it.acts.peerDel.length ? `−${it.acts.peerDel.length} peer${it.acts.peerDel.length > 1 ? "s" : ""}` : "", ...it.notes].filter(Boolean);
    return `<tr><td>${it.who && it.who.p ? who(it.who.p) : unknown(it.whoTxt, it.who)}</td><td>${leadCell}</td>${peerCell}<td class="xs ${what.length && !it.notes.length ? "" : "mut"}">${what.join(" · ") || (it.who && it.who.p ? "no changes" : "")}</td></tr>`;
  }).join("");
  const summary = [stats.lead ? `${stats.lead} lead reviewer${stats.lead > 1 ? "s" : ""}` : "", stats.self ? `${stats.self} self-assessment${stats.self > 1 ? "s" : ""}` : "", stats.peerAdd ? `+${stats.peerAdd} peers` : "", stats.peerDel ? `−${stats.peerDel} peers` : "", stats.same ? `${stats.same} unchanged` : "", stats.blocked ? `${stats.blocked} blocked` : "", stats.unknown ? `<span style="color:var(--bad)">${stats.unknown} name${stats.unknown > 1 ? "s" : ""} not recognised</span>` : ""].filter(Boolean).join(" · ");
  const body = `<h2>Import assignments from Excel</h2>
    <p class="sm mut" style="margin-top:4px">“${esc(S.fileName)}”${S.sheets.length > 1 ? ` · sheet <select class="inp" style="width:auto;display:inline-block" onchange="impSetSheet(this.value)">${S.sheets.map((sh, i) => `<option value="${i}" ${i === S.sheet ? "selected" : ""}>${esc(sh.name)}</option>`).join("")}</select>` : ` · sheet “${esc(sheet.name)}”`} · ${sheet.an.head >= 0 ? `header in row ${sheet.an.head + 1}` : "no header row: columns inferred from their content"} · ${stats.rows} ${stats.rows === 1 ? "person" : "people"} in the file.<br>
    ${isDec ? "<b>December:</b> only the <b>lead reviewers</b> are taken from this Excel; peers follow the team rule." : "<b>June:</b> the <b>lead reviewers</b> and the <b>peers</b> reviewing each person are taken; the Excel's peer list replaces the current one."} Anything already started or submitted is not touched.</p>
    <div class="imp-map">${mapUI}</div>
    <div class="chk" style="margin:6px 0 10px"><input type="checkbox" id="imp_self" ${S.opts.self ? "checked" : ""} onchange="impOpt('self', this.checked)"><label>Create the self-assessment for each person in the Excel if it does not exist yet</label></div>
    <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px"><table class="imp-tbl"><tr><th>Reviewee</th><th>Lead reviewer</th>${isDec ? "" : "<th>Peers reviewing them</th>"}<th>What will happen</th></tr>${rows || `<tr><td colspan="4" class="sm mut" style="padding:18px">No one from the firm was found in this sheet. Check the columns above${S.sheets.length > 1 ? " or switch sheet" : ""}.</td></tr>`}</table></div>
    <div class="row" style="justify-content:space-between;margin-top:12px;gap:10px;flex-wrap:wrap"><span class="sm mut">${summary || "Nothing to change"}</span><div class="row" style="gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="impApply()" ${nChanges ? "" : "disabled"}><i class="ti ti-file-upload"></i> Apply ${nChanges ? nChanges + (nChanges > 1 ? " changes" : " change") : ""}</button></div></div>`;
  const bg = document.getElementById("modalBg"); const m = document.getElementById("modal");
  if(bg.classList.contains("open")){ closeSelMenu(); m.innerHTML = body; enhanceSelects(m); } else openModal(body);
}
async function impApply(){
  const P = impPlan(); const c = P.c; const del = [], rows = [];
  for(const it of P.items){ if(!(it.who && it.who.p)) continue; const p = it.who.p;
    if(it.acts.self) rows.push({ cycle_id:c.id, reviewee_id:p.id, reviewer_id:p.id, role:"self", form_id:roleForm(c, "self", p) });
    if(it.acts.leadAdd){ if(it.acts.leadDel) del.push(it.acts.leadDel); rows.push({ cycle_id:c.id, reviewee_id:p.id, reviewer_id:it.acts.leadAdd.id, role:"lead", form_id:roleForm(c, "lead", p, it.acts.leadAdd) }); }
    for(const q of it.acts.peerAdd) rows.push({ cycle_id:c.id, reviewee_id:p.id, reviewer_id:q.id, role:"peer", form_id:roleForm(c, "peer", p, q) });
    for(const a of it.acts.peerDel) del.push(a.id); }
  if(!rows.length && !del.length) return toast("There is nothing to apply");
  closeModal(); progress(true);
  if(del.length){ const { error } = await sb.from("assignments").delete().in("id", del); if(error){ progress(false); return err(error, "Import assignments"); } }
  if(rows.length){ const { error } = await upsertAssignments(rows); if(error){ progress(false); return err(error, "Import assignments"); } }
  progress(false);
  const s = P.stats;
  toast(`Imported: ${[s.lead ? `${s.lead} lead reviewer${s.lead > 1 ? "s" : ""}` : "", s.self ? `${s.self} self-assessment${s.self > 1 ? "s" : ""}` : "", s.peerAdd ? `+${s.peerAdd} peers` : "", s.peerDel ? `−${s.peerDel} peers` : ""].filter(Boolean).join(" · ")}`);
  render();
}

/* ----- Personas ----- */
async function editPerson(id){
  // La ficha se lee de la base de datos: PEOPLE solo tiene a las personas activas y una desactivada salía en blanco (Hugo, 08-sep-2026)
  let p = { first_name:"", last_name:"", email:"", position:"", team:"", start_date:"", end_date:"", is_partner:false, is_admin:false, active:true, sees_all:false, is_evaluated:true };
  if(id){ const { data, error } = await sb.from("people").select("*").eq("id", id).limit(1); if(error) return err(error, "People"); if(data && data[0]) p = data[0]; }
  openModal(`<h2>${id?"Edit person":"New person"}</h2>
   <div class="two" style="margin-top:12px"><div><label class="xs mut">First name</label><input type="text" id="p_fn" value="${esc(p.first_name||"")}"></div><div><label class="xs mut">Last name</label><input type="text" id="p_ln" value="${esc(p.last_name||"")}"></div>
    <div><label class="xs mut">E-mail (Microsoft login)</label><input type="text" id="p_em" value="${esc(p.email||"")}"></div><div><label class="xs mut">Position</label><input type="text" id="p_pos" value="${esc(p.position||"")}"></div>
    <div><label class="xs mut">Team</label><select class="inp" id="p_team"><option value="">—</option>${Object.entries(TEAM_LABEL).map(([k,l])=>`<option value="${k}" ${p.team===k?"selected":""}>${l}</option>`).join("")}</select></div><div><label class="xs mut">Start date</label>${dateField("p_sd", p.start_date)}</div></div>
   <div class="two"><div><label class="xs mut">Leaving date <span class="xs mut">(once set, the person becomes inactive and is left out of later cycles)</span></label>${dateField("p_ed", p.end_date)}</div><div></div></div>
   <div class="chk"><input type="checkbox" id="p_partner" ${p.is_partner?"checked":""}><label>Partner <span class="xs mut">(label; partners weigh 2 in the weighted average)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_sees" ${p.sees_all?"checked":""}><label>Sees all the firm's reviews <span class="xs mut">(All reviews)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_eval" ${p.is_evaluated!==false?"checked":""}><label>Is evaluated <span class="xs mut">(included as a reviewee in the cycles)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_admin" ${p.is_admin?"checked":""}><label>Admin <span class="xs mut">(cycles, assignments and people)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_active" ${p.active!==false?"checked":""}><label>Active (can sign in and receives assignments)</label></div>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">${id ? `<button class="btn" style="margin-right:auto;color:#b42318" onclick="deletePerson('${id}')"><i class="ti ti-trash"></i> Delete</button>` : ""}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePerson(${id?`'${id}'`:"null"})">Save</button></div>`);
}
// Eliminar de la lista (Hugo, 08-sep-2026). Si la persona tiene reviews o asignaciones, la base de datos lo impide: queda desactivada
async function deletePerson(id){
  const { data } = await sb.from("people").select("first_name,last_name").eq("id", id).limit(1); const p = data && data[0]; if(!p) return;
  openModal(`<h2>Delete ${esc(fullName(p))}?</h2><p class="sm">They disappear from the list of people. This is only possible if they have no reviews or assignments in any cycle; if they do, the database prevents it and the right thing is to leave them inactive.</p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="editPerson('${id}')">Cancel</button><button class="btn pri" style="background:#b42318;border-color:#b42318" onclick="doDeletePerson('${id}')"><i class="ti ti-trash"></i> Delete</button></div>`);
}
async function doDeletePerson(id){
  const { error } = await sb.from("people").delete().eq("id", id);
  if(error){ closeModal(); if(String(error.code) === "23503" || /foreign key|violates/i.test(error.message||"")) return toast("Cannot delete: they have reviews or assignments. Leave them inactive.", true); return err(error, "Could not delete"); }
  closeModal(); toast("Person deleted"); await loadCatalog(); render();
}
async function savePerson(id){
  const g = x => document.getElementById(x);
  const row = { first_name:g("p_fn").value.trim(), last_name:g("p_ln").value.trim(), email:g("p_em").value.trim().toLowerCase(), position:g("p_pos").value.trim()||null, team:g("p_team").value||null, start_date:readDate("p_sd"), end_date:readDate("p_ed"), is_partner:g("p_partner").checked, sees_all:g("p_sees").checked, is_evaluated:g("p_eval").checked, is_admin:g("p_admin").checked, active:g("p_active").checked };
  if(!row.first_name || !row.email) return toast("First name and e-mail are required", true);
  if(row.start_date === undefined || row.end_date === undefined) return toast("Dates must be written as dd/mm/yyyy", true);
  // Con fecha de salida ya pasada se desactiva sola: si no, hay que acordarse de desmarcar la casilla a mano (Hugo, 30-sep-2026)
  if(row.end_date && row.end_date <= hoyISO() && row.active){ row.active = false; toast("Leaving date in the past: the person has been deactivated"); }
  const r = id ? await sb.from("people").update(row).eq("id", id) : await sb.from("people").insert(row);
  if(r.error) return err(r.error,"Could not save"); closeModal(); toast("Saved"); await loadCatalog(); render();
}
async function toggleDev(on){
  const { error } = await sb.from("app_settings").update({ dev_mode:on }).eq("id",1); if(error) return err(error,"Settings");
  toast(on ? "No-login mode ENABLED" : "No-login mode disabled"); await loadCatalog(); render();
  if(!on && DEV_MODE) toast("Warning: this no-login version will stop working when reloaded", true);
}
</script>
<script>
/* ---------- Arranque ---------- */
if(window.Chart){ Chart.defaults.font.family = "Inter, system-ui, sans-serif"; Chart.defaults.color = "#6b7280"; Chart.defaults.locale = "en-GB"; }   // números de los gráficos en inglés («3.66»), no en el idioma del navegador (04-nov-2026)
window.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>

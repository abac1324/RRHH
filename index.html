<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abac · Performance Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0e2150; --navy-2:#0a1838; --navy-3:#16285c;
  --ink:#13224e; --text:#2b3240; --muted:#6b7280; --faint:#9aa3b2;
  --line:#e7e9ee; --line-2:#eef0f3;
  --bg:#f5f6f8; --sidebar:#edeef1; --card:#ffffff; --cell:#f7f8fa;
  --teal:#0e9aab; --teal-soft:#e1f3f5;
  --red:#b41842; --red-soft:#fbe9ee;
  --blue:#3f86d6; --lightblue:#a9cdf4; --slate:#6c77a3;
  --ok:#0c7e8c; --ok-soft:#e1f3f5; --warn:#b7791f; --warn-soft:#fdf3dc; --bad:#b41842; --bad-soft:#fbe9ee;
  --info-soft:#e9ebf4; --info:#1c2c63;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(14,33,80,.04), 0 6px 18px rgba(14,33,80,.05);
  --shadow-sm:0 1px 2px rgba(14,33,80,.05);
  --c1:#0a1633; --c2:#1b3a7a; --c3:#5b9fe0; --c4:#9cc4ee; --c5:#cfe2f8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;height:100vh;overflow:hidden;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:var(--navy)}
/* ---------- Sidebar ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 18px 14px;height:100%;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:2px 4px 18px}
.brandlogo{width:184px;max-width:100%;height:auto;display:block}
.brand .bsub{color:var(--muted);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:14px 14px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#404654;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:#e3e5ea;color:var(--ink)}
.nav a.active{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(14,33,80,.22)}
.nav a .ic{width:20px;text-align:center;font-size:18px;line-height:1}
.nav a .badge{margin-left:auto;background:var(--teal);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700}
.nav a.active .badge{background:#fff;color:var(--navy)}
.nav a.locked{opacity:.45;cursor:not-allowed}
.nav a .lk{margin-left:auto;font-size:14px;color:var(--faint)}
.userbox{padding:14px 4px 4px;border-top:1px solid var(--line);margin-top:8px}
.userbox label{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px}
.userbox .uc{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.userbox .uc-av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.userbox .uc-name{font-weight:700;color:var(--ink);font-size:13.5px;line-height:1.15}
.userbox .uc-role{font-size:11.5px;color:var(--muted);margin-top:2px}
.userbox select{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-family:inherit;font-weight:600}
.userbox .role{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:74px;display:flex;align-items:center;gap:18px;padding:0 34px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.topbar h1{font-weight:700;color:var(--ink);font-size:18px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.topbar .sp{flex:1}
.topbar .search{border:1px solid var(--line);border-radius:11px;padding:9px 13px 9px 36px;font-size:13.5px;width:280px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='10' cy='10' r='7'/><path d='m21 21-6-6'/></svg>") 12px center no-repeat;font-family:inherit;color:var(--ink)}
.search:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,33,80,.10)}
.content{flex:1;overflow-y:auto;padding:28px 34px 10px;min-height:0}
.footer{border-top:1px solid var(--line);padding:16px 34px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--bg)}
.footer .fl{font-size:12px;color:var(--muted)}
.footer .fl .svi{font-weight:800;color:var(--ink);display:block;margin-top:3px;letter-spacing:.02em;font-size:11.5px}
.footer .fr{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
/* ---------- Botones y píldoras ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;font-family:inherit;transition:border-color .15s,background .15s}
.btn:hover{border-color:#c7cdd9;background:#fbfbfc}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 16px rgba(14,33,80,.18)}
.btn.pri:hover{background:var(--navy-3)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn i{font-size:15px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--info-soft);color:var(--info);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:#eef0f3;color:#59657a}.pill.pur{background:#ecebf6;color:#4b4a8f}.pill.navy{background:var(--navy);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:11.5px;font-weight:600;color:var(--ink)}
.chip .avatar{width:20px;height:20px;font-size:8.5px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:#eef0f3;color:#59657a;margin-left:6px}
/* ---------- Layout ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g32{grid-template-columns:3fr 2fr}.g23{grid-template-columns:2fr 3fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1200px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g32,.g23,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.card h3{margin:0 0 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.3}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;display:flex;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:5px}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .d{font-size:11px;color:var(--ok);font-weight:600}
.kpi .d.neg{color:var(--bad)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;letter-spacing:.02em}
.avatar.lg{width:64px;height:64px;font-size:21px}
.avatar.sm{width:26px;height:26px;font-size:10px}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--muted)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:700}
.hd{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
/* ---------- Tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:#fbfcff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.heat td{text-align:center;font-weight:700;font-size:12.5px}
/* ---------- Componentes ---------- */
.bar{height:7px;background:#e9edf3;border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--navy);border-radius:6px}
.bar.ok>span{background:var(--teal)}.bar.warn>span{background:var(--warn)}
.steps{display:flex;align-items:center;margin:8px 0 16px}
.step{flex:1;text-align:center;font-size:11.5px;position:relative;color:var(--faint);font-weight:500}
.step .dot{width:26px;height:26px;border-radius:50%;background:#e3e6ec;margin:0 auto 6px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);border:2px solid #fff;position:relative;z-index:1}
.step.done .dot{background:var(--teal);color:#fff}.step.cur .dot{background:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(14,33,80,.12)}
.step.done,.step.cur{color:var(--text)}
.step:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:#e3e6ec}
.step.done:after{background:var(--teal)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 16px}
.tl li:before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid #fff}
.tl li.hi:before{background:var(--teal)}
.tl .when{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab.active{color:var(--navy)}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--cell)}
.q .qt{font-weight:700;margin-bottom:8px;font-size:13.5px;color:var(--ink)}
.scale{display:flex;gap:6px;margin:8px 0}
.scale span{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--text)}
.scale span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scale span.ro{cursor:default}
textarea,input[type=text],input[type=date],select.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;background:#fff;color:var(--text)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,33,80,.08)}
textarea{min-height:72px;resize:vertical}
.ans{background:#fff;border-left:3px solid var(--blue);padding:9px 13px;border-radius:8px;font-size:13px;margin-top:6px}
.ans .who{font-size:10.5px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lock{background:var(--cell);border:1px dashed #cfd5df;border-radius:10px;padding:14px;color:var(--muted);font-size:12.5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.lock i{font-size:16px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.chk:last-child{border-bottom:none}
.chk input{margin-top:3px;accent-color:var(--navy)}
.chk.done label{text-decoration:line-through;color:var(--faint)}
.alert{border-radius:12px;padding:12px 16px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.info{background:var(--info-soft);color:var(--info)}.alert.warn{background:var(--warn-soft);color:#6f4f0a}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mat .cell{min-height:94px;border-radius:10px;padding:9px;font-size:11.5px;border:1px solid var(--line-2)}
.mat .cell .t{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
.mat .cell .pp{display:flex;flex-wrap:wrap;gap:4px}
.chartbox{position:relative;height:240px}
.chartbox.tall{height:320px}
.vis{display:grid;grid-template-columns:1.6fr repeat(4,1fr);font-size:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vis>div{padding:9px 10px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center}
.vis>div:nth-child(5n+1){justify-content:flex-start;text-align:left;background:var(--cell);font-weight:600;color:var(--ink)}
.vis>div:nth-child(-n+5){background:#fbfcff;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vis>div:nth-child(5n){border-right:none}
.y{color:var(--ok);font-weight:700}.n{color:var(--bad);font-weight:700}.p{color:var(--warn);font-weight:700}
.ok-ico{color:var(--ok)}.bad-ico{color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(14,33,80,.45);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;width:min(760px,92vw);max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(14,33,80,.3)}
.modal h2{margin:0 0 6px;font-size:19px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 28px rgba(14,33,80,.3);opacity:0;transform:translateY(10px);transition:.25s;z-index:60}
.toast.show{opacity:1;transform:none}
.kudo{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;background:#fff}
.kudo .who{font-size:11px;color:var(--muted)}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;background:#fff}
.doc .ico{width:32px;height:38px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.doc .ico.x{background:var(--ok-soft);color:var(--ok)}
.doc .m{margin-left:auto;font-size:11px;color:var(--muted)}
.tree{font-size:13px}
.tree .node{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.tree .lvl1{margin-left:22px}.tree .lvl2{margin-left:44px}
.tree .node .row .bar{flex:1;max-width:160px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:10px;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rb{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rb span{padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.rb span.on{background:var(--navy);color:#fff}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5}
.sig{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--cell);font-size:12.5px}
.sig .name{font-family:'Segoe Script','Brush Script MT',cursive;font-size:20px;color:var(--navy)}
.emptystate{padding:30px;text-align:center;color:var(--muted)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#d8dce4;border-radius:8px}
code{background:#eef0f3;border-radius:5px;padding:1px 6px;font-size:12px}
.card details summary::-webkit-details-marker{display:none}

/* ---------- Organigrama (árbol general → ramas → socios y equipo) ---------- */
.org{display:flex;flex-direction:column;align-items:center}
.org-root{background:var(--navy);color:#fff;border-radius:14px;padding:14px 30px;text-align:center;box-shadow:0 8px 20px rgba(14,33,80,.22);position:relative;z-index:1}
.org-root .t{font-weight:800;font-size:16px;letter-spacing:-.01em}.org-root .s{font-size:11px;color:#cdd6ee;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.org-line{width:2px;height:26px;background:#c9d0dc}
.org-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;width:100%;position:relative;padding-top:26px}
.org-cols:before{content:"";position:absolute;top:0;left:16.66%;right:16.66%;height:2px;background:#c9d0dc}
.org-col{display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.org-col:before{content:"";position:absolute;top:-26px;left:50%;width:2px;height:26px;background:#c9d0dc}
.org-branch{width:100%;border-radius:14px;padding:13px 16px;color:#fff;text-align:center;box-shadow:0 6px 16px rgba(14,33,80,.18);position:relative;z-index:1}
.org-branch .bt{font-weight:800;font-size:15px}.org-branch .bn{font-size:11px;opacity:.85;margin-top:3px}
.org-group{width:100%;display:flex;flex-direction:column;align-items:center}
.org-stem{width:2px;height:22px;background:#c9d0dc}
.org-glabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;background:#fff;padding:3px 12px;border:1px solid var(--line);border-radius:999px;position:relative;z-index:1}
.org-gbox{width:100%;margin-top:-13px;padding:26px 12px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.org-gbox.one{grid-template-columns:1fr}
.pcard{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;min-width:0}
.pcard:hover{border-color:#c7cdd9;background:#fbfcff}
.pcard .pn{font-weight:700;font-size:12.5px;color:var(--ink);line-height:1.2}
.pcard .pp{font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:1px}
.pcard.partner{border-color:#d5dbe8;background:#fbfcff}
.pcard.partner .avatar{background:var(--navy)}
@media(max-width:1100px){.org-cols{grid-template-columns:1fr}.org-cols:before,.org-col:before{display:none}.org-gbox{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- Movimiento (rápido, sutil, solo transform/opacity; respeta reducir movimiento) ---------- */
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.65,0,.35,1);--d1:120ms;--d2:180ms;--d3:260ms}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
.page{animation:pageIn var(--d3) var(--ease) both}
.stagger>*{animation:pageIn var(--d3) var(--ease) both}
.stagger>*:nth-child(2){animation-delay:30ms}.stagger>*:nth-child(3){animation-delay:60ms}.stagger>*:nth-child(4){animation-delay:90ms}.stagger>*:nth-child(5){animation-delay:120ms}.stagger>*:nth-child(n+6){animation-delay:150ms}
.btn{transition:transform var(--d1) var(--ease),background var(--d2) var(--ease),border-color var(--d2),box-shadow var(--d2),color var(--d2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.nav a:focus-visible,.tab:focus-visible,.rb span:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.nav a{transition:background var(--d2) var(--ease),color var(--d2),transform var(--d1) var(--ease)}
.nav a:active{transform:scale(.98)}
.pcard,tr.click td,.card{transition:background var(--d2),border-color var(--d2),transform var(--d1) var(--ease),box-shadow var(--d2)}
.pcard:active{transform:scale(.985)}
.scale span{transition:background var(--d1),color var(--d1),transform var(--d1) var(--ease),border-color var(--d1)}
.scale span:not(.ro):hover{transform:translateY(-1px);border-color:#c7cdd9}
.scale span:not(.ro):active{transform:scale(.94)}
.tab{position:relative;border-bottom-color:transparent!important;transition:color var(--d2)}
.tab:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--navy);border-radius:2px;transform:scaleX(0);transition:transform var(--d2) var(--ease)}
.tab.active:after{transform:scaleX(1)}
.rb span{transition:background var(--d2) var(--ease),color var(--d2)}
.modal-bg{display:flex;opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease)}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal-bg[hidden]{display:none}
.modal{transform:scale(.97) translateY(8px);transition:transform var(--d3) var(--ease)}
.modal-bg.open .modal{transform:none}
.bar>span{transition:width var(--d3) var(--ease)}
.pill,select,input,textarea{transition:border-color var(--d2),box-shadow var(--d2),background var(--d2)}
.chk input{transition:transform var(--d1) var(--ease)}.chk input:active{transform:scale(.9)}
.skel{background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 50%,#eef0f3 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:10px}
.ptop{position:fixed;top:0;left:0;height:2px;background:var(--teal);width:0;opacity:0;transition:width .5s var(--ease),opacity .25s;z-index:200}
.ptop.on{opacity:1}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step4{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;position:relative}
.step4 .k{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;margin-bottom:8px}
.step4.done .k{background:var(--teal)}
.step4 .t{font-weight:700;color:var(--ink);font-size:13px}.step4 .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.flow{display:inline-flex;gap:4px;align-items:center}
.flow i{width:8px;height:8px;border-radius:50%;background:#e3e6ec;display:inline-block}
.flow i.on{background:var(--teal)}
.empty{padding:34px 20px;text-align:center}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--info-soft);color:var(--navy);display:grid;place-items:center;font-size:24px;margin:0 auto 12px}
.empty .t{font-weight:700;color:var(--ink);font-size:15px}.empty .d{color:var(--muted);font-size:13px;margin-top:4px;max-width:460px;margin-left:auto;margin-right:auto;line-height:1.5}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Desplegables propios (el <select> nativo queda oculto y sincronizado) ---------- */
.sel{position:relative;display:block;min-width:0}
.sel.auto{display:inline-block;vertical-align:middle}
.sel>select{display:none!important}
.sel-btn{display:flex;align-items:center;gap:8px;width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;transition:border-color var(--d2),box-shadow var(--d2),background var(--d2),transform var(--d1) var(--ease)}
.sel.auto .sel-btn{width:auto;padding:5px 9px;font-size:12px;border-radius:9px}
.sel-btn:hover{border-color:#c7cdd9}
.sel-btn:active{transform:scale(.985)}
.sel-btn.open,.sel-btn:focus-visible{border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,33,80,.10);outline:none}
.sel-btn .sel-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-btn .sel-txt.ph{color:var(--faint)}
.sel-btn i{color:var(--muted);font-size:15px;transition:transform var(--d2) var(--ease);flex:0 0 auto}
.sel-btn.open i{transform:rotate(180deg)}
.sel-btn:disabled{opacity:.55;cursor:not-allowed}
.userbox .sel-btn{font-weight:600;font-size:12.5px}
.selmenu{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(14,33,80,.16),0 2px 6px rgba(14,33,80,.06);padding:6px;min-width:200px;max-height:320px;display:flex;flex-direction:column;opacity:0;transform:translateY(-4px) scale(.98);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.selmenu.show{opacity:1;transform:none}
.selmenu .sm-search{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 0 4px;border:1px solid var(--line);border-radius:9px;background:var(--cell)}
.selmenu .sm-search i{color:var(--muted);font-size:14px}
.selmenu .sm-search input{border:none;background:transparent;padding:2px 0;font-size:12.5px;width:100%;box-shadow:none}
.selmenu .sm-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.selmenu .sm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background var(--d1)}
.selmenu .sm-item:hover,.selmenu .sm-item.focus{background:var(--cell)}
.selmenu .sm-item.on{color:var(--navy);font-weight:600}
.selmenu .sm-item .ti-check{margin-left:auto;font-size:14px;color:var(--teal)}
.selmenu .sm-item.dis{opacity:.45;cursor:default}
.selmenu .sm-empty{padding:10px;font-size:12.5px;color:var(--muted);text-align:center}
/* ---------- Casillas ---------- */
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:0 0 17px;margin:2px 0 0;border:1.5px solid #c7cdd9;border-radius:5px;background:#fff;display:inline-grid;place-items:center;cursor:pointer;transition:background var(--d1),border-color var(--d1),transform var(--d1) var(--ease)}
.chk input[type=checkbox]:hover{border-color:var(--navy)}
.chk input[type=checkbox]:checked{background:var(--navy);border-color:var(--navy)}
.chk input[type=checkbox]:checked:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.chk input[type=checkbox]:disabled{opacity:.5;cursor:default}
.chk input[type=checkbox]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.chk label{cursor:pointer}
input[type=date]{color-scheme:light;color:var(--ink)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}

/* ---------- Sin desbordes horizontales ---------- */
[hidden]{display:none!important}
.two>*,.grid>*,.row>*{min-width:0}
.sel{max-width:100%}
.modal{width:min(900px,94vw);overflow-x:hidden}
.content{overflow-x:hidden}
.card{min-width:0}
.card table{table-layout:auto;max-width:100%}
.modal .two{gap:12px 16px}

/* ---------- Editor de ciclo: tarjetas de opción, interruptores, resumen ---------- */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:border-color var(--d2),background var(--d2),transform var(--d1) var(--ease)}
.opt:hover{border-color:#c7cdd9}
.opt:active{transform:scale(.99)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ot{font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}
.opt .ot i{color:var(--muted);font-size:16px}
.opt .od{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.opt.on{border-color:var(--navy);background:#f6f8fc;box-shadow:0 0 0 1px var(--navy) inset}
.opt.on .ot i{color:var(--navy)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer}
.sw:last-child{border-bottom:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .knob{width:34px;height:20px;border-radius:999px;background:#d5dae3;position:relative;flex:0 0 34px;transition:background var(--d2)}
.sw .knob:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--d2) var(--ease)}
.sw input:checked+.knob{background:var(--navy)}
.sw input:checked+.knob:after{transform:translateX(14px)}
.sw .st{flex:1}.sw .st small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.summary{background:var(--info-soft);border-radius:12px;padding:14px 16px;margin-top:12px}
.summary .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--info);font-weight:700;margin-bottom:8px}
.summary ol{margin:0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--info)}
.summary li+li{margin-top:3px}
.qtable{width:100%;border-collapse:separate;border-spacing:0 6px}
.qtable td{padding:0 8px 0 0;border:none;vertical-align:middle;font-size:13px}
.qtable td:first-child{width:46%;color:var(--text)}
.qtable td:first-child b{color:var(--ink)}
input.numin{width:56px!important;display:inline-block;padding:4px 8px;text-align:center;margin:0 4px;vertical-align:middle}

/* ---------- Asignaciones: vista limpia ---------- */
.stack{display:inline-flex;align-items:center}
.stack .avatar{width:26px;height:26px;font-size:9.5px;border:2px solid #fff;margin-left:-8px;box-shadow:0 0 0 1px var(--line)}
.stack .avatar:first-child{margin-left:0}
.stack .more{margin-left:-8px;width:26px;height:26px;border-radius:50%;background:var(--cell);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9dee7;vertical-align:middle;margin-right:6px}
.dot.on{background:var(--teal)}.dot.mid{background:var(--warn)}
.teamhead td{padding:14px 10px 6px;border-bottom:none}
.teamhead .th{display:flex;align-items:center;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pl{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto;padding:2px}
.pl .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:10px 6px 4px}
.pl .chk{padding:6px 6px;border-bottom:none;border-radius:8px}
.pl .chk:hover{background:var(--cell)}
.actmenu .sm-item i{color:var(--muted);font-size:15px}

/* ---------- Desplegables: menú más agradable ---------- */
.selmenu{padding:8px;border-radius:14px;max-height:360px;box-shadow:0 18px 44px rgba(14,33,80,.16),0 2px 8px rgba(14,33,80,.06)}
.selmenu .sm-search{margin:0 0 8px;padding:8px 10px;border-radius:10px}
.selmenu .sm-search input{font-size:13px}
.selmenu .sm-list{gap:2px;padding-right:2px}
.selmenu .sm-list::-webkit-scrollbar{width:6px}
.selmenu .sm-item{padding:11px 12px;border-radius:9px;font-size:13.5px;gap:12px;line-height:1.3;min-height:44px}
.selmenu .sm-list{gap:4px}
.selmenu .sm-item+.sm-item{position:relative}
.selmenu .sm-item+.sm-item:not(.sep):before{content:"";position:absolute;top:-2px;left:12px;right:12px;height:1px;background:var(--line-2)}
.selmenu .sm-item:hover:before,.selmenu .sm-item.focus:before{opacity:0}
.selmenu .sm-item .avatar{width:28px;height:28px;font-size:10px;flex:0 0 28px}
.selmenu .sm-item .sm-txt{min-width:0;flex:1}
.selmenu .sm-item .sm-txt .n{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selmenu .sm-item .sm-txt .p{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.selmenu .sm-item.on .sm-txt .n{color:var(--navy)}
.selmenu .sm-item.ph{color:var(--muted);font-weight:500}

.selmenu .sm-item+.sm-item.sep{margin-top:6px;position:relative}
.selmenu .sm-item+.sm-item.sep:before{content:"";position:absolute;top:-4px;left:10px;right:10px;height:1px;background:var(--line)}
.sel-btn .sel-txt .avatar{width:20px;height:20px;font-size:8px;margin-right:6px;vertical-align:-5px}

/* ---------- Resumen final y arañas ---------- */
.fr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fr-grid .full{grid-column:1/-1}
.fr-grid label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:5px}

.fr-view .blk{padding:12px 0;border-bottom:1px solid var(--line-2)}

.radars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

@media(max-width:1000px){.radars{grid-template-columns:1fr}}

/* ---------- Mis resultados: resumen en recuadros ---------- */
.fr-read{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:18px}

/* ---------- Distribución de puntuaciones ---------- */
.dist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.prev-obj{border:1px dashed #cfd5df;border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:18px}

.prev-obj .v{font-size:13.5px;line-height:1.6;white-space:pre-wrap}

<body>

/* ---------- Desplegables propios: envuelven cada <select>, lo ocultan y lo mantienen sincronizado ---------- */
let SELMENU = null, SELOPEN = null;
function enhanceSelects(root){
  (root || document).querySelectorAll("select:not([data-enh]):not([hidden])").forEach(sel => {
    sel.dataset.enh = "1";
    const wrap = document.createElement("div");
    wrap.className = "sel" + ((sel.style.width === "auto" || sel.closest("td")) ? " auto" : "");
    sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "sel-btn"; wrap.appendChild(btn);
    const sync = () => { const o = sel.selectedOptions[0]; const ph = !o || !o.value; const per = o && o.dataset.p ? person(o.dataset.p) : null;
      btn.innerHTML = `<span class="sel-txt ${ph?'ph':''}">${per ? av(per,"sm") + esc(fullName(per)) : esc(o ? o.text.replace(/^[—–-\s]+|[—–-\s]+$/g,"") : "—")}</span><i class="ti ti-chevron-down"></i>`; btn.disabled = sel.disabled; };
    sel._sync = sync; sync();
    sel.addEventListener("change", sync);
    btn.addEventListener("click", e => { e.stopPropagation(); if(SELOPEN === sel) closeSelMenu(); else openSelMenu(sel, btn); });
    btn.addEventListener("keydown", e => { if(["ArrowDown","Enter"," "].includes(e.key)){ e.preventDefault(); openSelMenu(sel, btn); } });
  });
}
function syncSelects(root){ (root || document).querySelectorAll("select[data-enh]").forEach(s => s._sync && s._sync()); }
function openSelMenu(sel, btn){
  closeSelMenu();
  const opts = [...sel.options];
  const m = document.createElement("div"); m.className = "selmenu";
  const many = opts.length > 8;
  m.innerHTML = `${many ? `<div class="sm-search"><i class="ti ti-search"></i><input type="text" placeholder="Buscar…" autocomplete="off"></div>` : ""}<div class="sm-list"></div>`;
  const list = m.querySelector(".sm-list");
  const draw = q => {
    const ql = (q||"").toLowerCase();
    const items = opts.filter(o => { if(!ql) return true; const per = o.dataset.p ? person(o.dataset.p) : null; return o.text.toLowerCase().includes(ql) || (per && (per.position||"").toLowerCase().includes(ql)); });
    list.innerHTML = items.length ? items.map((o, k) => {
      const pid = o.dataset.p, per = pid ? person(pid) : null; const ph = !o.value;
      const body = per ? `${av(per,"sm")}<div class="sm-txt"><div class="n">${esc(fullName(per))}</div><div class="p">${esc(per.position||"")}${per.team?` · ${TEAM_LABEL[per.team]}`:""}</div></div>`
                 : ph ? `<i class="ti ti-minus"></i><span>${esc(o.text.replace(/^[—–-\s]+|[—–-\s]+$/g,""))}</span>`
                 : `<span class="sm-txt"><div class="n" style="font-weight:500">${esc(o.text)}</div></span>`;
      return `<div class="sm-item ${o.selected?'on':''} ${o.disabled?'dis':''} ${ph?'ph':''} ${k===1&&items[0]&&!items[0].value?'sep':''}" data-i="${o.index}">${body}${o.selected&&!ph?'<i class="ti ti-check"></i>':''}</div>`; }).join("") : `<div class="sm-empty">Sin resultados</div>`;
  };
  draw("");
  list.addEventListener("click", e => { const it = e.target.closest(".sm-item"); if(!it || it.classList.contains("dis")) return; pick(+it.dataset.i); });
  const pick = i => { if(sel.selectedIndex !== i){ sel.selectedIndex = i; sel.dispatchEvent(new Event("change", { bubbles:true })); } closeSelMenu(); btn.focus(); };
  document.body.appendChild(m);
  // posición: debajo del botón; si no cabe, encima
  const hasPeople = opts.some(o => o.dataset.p);
  const r = btn.getBoundingClientRect(); const w = Math.max(r.width, hasPeople ? 320 : 260);
  m.style.width = w + "px"; m.style.left = Math.min(r.left, window.innerWidth - w - 8) + "px";
  const below = window.innerHeight - r.bottom - 12;
  if(below < 240 && r.top > below){ m.style.maxHeight = Math.min(360, r.top - 12) + "px"; m.style.bottom = (window.innerHeight - r.top + 6) + "px"; }
  else { m.style.maxHeight = Math.min(360, below) + "px"; m.style.top = (r.bottom + 6) + "px"; }
  requestAnimationFrame(() => m.classList.add("show"));
  btn.classList.add("open"); SELMENU = m; SELOPEN = sel; SELMENU._btn = btn;
  // teclado
  let focus = opts.findIndex(o => o.selected);
  const setFocus = d => { const its = [...list.querySelectorAll(".sm-item:not(.dis)")]; if(!its.length) return; let k = its.findIndex(x => x.classList.contains("focus")); k = Math.max(0, Math.min(its.length-1, (k<0 ? its.findIndex(x=>x.classList.contains("on")) : k) + d)); its.forEach(x=>x.classList.remove("focus")); its[k].classList.add("focus"); its[k].scrollIntoView({block:"nearest"}); };
  m.addEventListener("keydown", e => { if(e.key==="ArrowDown"){ e.preventDefault(); setFocus(1); } else if(e.key==="ArrowUp"){ e.preventDefault(); setFocus(-1); } else if(e.key==="Enter"){ e.preventDefault(); const f = list.querySelector(".sm-item.focus") || list.querySelector(".sm-item.on"); if(f) pick(+f.dataset.i); } else if(e.key==="Escape"){ closeSelMenu(); btn.focus(); } });
  const inp = m.querySelector("input"); if(inp){ inp.addEventListener("input", () => draw(inp.value)); setTimeout(() => inp.focus(), 30); } else { m.tabIndex = -1; setTimeout(() => m.focus(), 30); }
  const on = list.querySelector(".sm-item.on"); if(on) on.scrollIntoView({block:"nearest"});
}
function closeSelMenu(){ if(SELMENU){ const m = SELMENU; m.classList.remove("show"); if(m._btn) m._btn.classList.remove("open"); setTimeout(() => m.remove(), 180); SELMENU = null; SELOPEN = null; } }
document.addEventListener("click", e => { if(SELMENU && !SELMENU.contains(e.target)) closeSelMenu(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSelMenu(); });
window.addEventListener("resize", closeSelMenu);

function toast(t, bad){ const el=document.getElementById("toast"); el.textContent=t; el.style.background = bad ? "var(--bad)" : "var(--navy)"; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"), bad?5000:2600); }

function makeClient(devEmail){
  if(SIM_MODE && window.SIM) return window.SIM.client(devEmail);
  if(!window.supabase || !/^https?:\/\//.test(SUPABASE_URL)) return null;
  const opts = { auth:{ persistSession: !DEV_MODE, autoRefreshToken: !DEV_MODE, detectSessionInUrl: !DEV_MODE, storageKey: DEV_MODE ? "abac-eval-dev-" + Date.now() : "abac-eval" } };
  if(DEV_MODE && devEmail) opts.global = { headers: { "x-dev-user": devEmail } };
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, opts);

// ---------- Identidad ----------
async function loadMe(email){
  const { data, error } = await sb.from("people").select("*").ilike("email", email).limit(1);
  if(error) throw error;
  return data[0] || null;
}
async function loadCatalog(){
  const [f, c, p, s] = await Promise.all([
    sb.from("forms").select("*, form_sections(*, questions(*))").order("code"),
    sb.from("cycles").select("*, cycle_forms(*)").order("opens_at", {ascending:false}),
    sb.from("people").select("*").eq("active", true).order("last_name"),
    sb.from("app_settings").select("*").eq("id", 1).limit(1),
  ]);
  for(const r of [f,c,p,s]) if(r.error) throw r.error;
  FORMS = f.data.map(x => ({...x, form_sections: (x.form_sections||[]).sort((a,b)=>a.position-b.position).map(sx => ({...sx, questions:(sx.questions||[]).sort((a,b)=>a.position-b.position)}))}));
  CYCLES = c.data; PEOPLE = p.data; SETTINGS = (s.data && s.data[0]) || SETTINGS;
}

// Preguntas que rellena un papel en un formulario
function questionsFor(form, role){
  const out = [];
  for(const s of form.form_sections){
    const qs = s.questions.filter(q => (q.fill_by || s.fill_by || []).includes(role));
    if(qs.length) out.push({ section:s, questions:qs });
  }
  return out;
}
function formFor(cycle, role, team){
  const cf = (cycle.cycle_forms||[]);
  const hit = cf.find(x => x.role===role && x.team===team) || cf.find(x => x.role===role && !x.team);
  return hit ? byId(FORMS, hit.form_id) : null;
}

// ---------- Arranque: selector de usuario (sin login) o login Microsoft ----------
async function boot(){
  if(!window.supabase && !SIM_MODE){ document.getElementById("content").innerHTML = `<div class="alert warn">No se ha podido cargar la librería de Supabase. Comprueba la conexión a internet.</div>`; return; }
  if(!SIM_MODE && (!/^https?:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY === "PENDIENTE")){
    document.getElementById("content").innerHTML = `<div class="card"><h3>Configuración pendiente</h3><p class="sm">Falta poner <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> al principio del script, con los datos del proyecto de Supabase de esta app.</p></div>`;
    return;
  }
  if(DEV_MODE){
    sb = makeClient(null);
    try {
      const { data, error } = await sb.from("people").select("*").eq("active", true).order("last_name");
      if(error) throw error;
      PEOPLE = data;
      const saved = (()=>{ try{ return localStorage.getItem("abac_eval_devuser"); }catch(e){ return null; } })();
      const first = PEOPLE.find(p => p.email === saved) || PEOPLE.find(p => p.is_admin) || PEOPLE[0];
      await setDevUser(first.email);
    } catch(e){ err(e, "No se pudo leer el directorio"); }
    return;
  }
  // Producción: Microsoft
  sb = makeClient(null);
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session && session.user && session.user.email){ await enter(session.user.email); }
    else showGate();
  });
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await enter(data.session.user.email); return; }
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const oauthErr = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
  const manual = (()=>{ try{ return sessionStorage.getItem("abac_eval_salir") === "1"; }catch(e){ return false; } })();
  if(oauthErr){ showGate("Microsoft no ha podido iniciar la sesión: " + oauthErr.replace(/\+/g, " ")); return; }
  // Hugo (07-sep-2026): sin tarjeta intermedia. Sin sesión → directo a Microsoft; tras cerrar sesión → Microsoft con selector de cuenta.
  if(AUTO_MS_LOGIN){ msLogin(manual); return; }
  showGate();
}
function showGate(msg){ const g=document.getElementById("gate"); g.hidden=false; requestAnimationFrame(() => g.classList.add("open"));  /* la clase open es la que le da opacidad (fundido de los modales) */ if(msg){ const e=document.getElementById("gateErr"); e.hidden=false; e.textContent=msg; } }
function msLogin(force){
  try{ sessionStorage.removeItem("abac_eval_salir"); }catch(e){}
  const opts = { scopes:"email openid profile", redirectTo: window.location.origin + window.location.pathname };
  if(force) opts.queryParams = { prompt:"select_account" };
  sb.auth.signInWithOAuth({ provider:"azure", options:opts }).then(r => { if(r.error) showGate(r.error.message); });
}
async function logout(){ if(DEV_MODE) return; try{ sessionStorage.setItem("abac_eval_salir", "1"); }catch(e){} await sb.auth.signOut(); location.reload(); }

async function setDevUser(email){
  try{ localStorage.setItem("abac_eval_devuser", email); }catch(e){}
  sb = makeClient(email);
  document.getElementById("content").innerHTML = skeleton();
  await enter(email);
  toast(`Has entrado como ${ME ? ME.first_name : email}`);
}
async function enter(email){
  try{
    ME = await loadMe(email);
    if(!ME){ document.getElementById("gate").hidden = true; document.getElementById("content").innerHTML = `<div class="card"><h3>Sin acceso</h3><p class="sm">El correo <b>${esc(email)}</b> no está dado de alta en la app. Pide a administración que te añada.</p>${DEV_MODE?"":`<button class="btn" onclick="logout()">Salir</button>`}</div>`; return; }
    await loadCatalog(); await refreshLeadCache();
    document.getElementById("gate").hidden = true;
    if(!PAGES[PAGE] || !canSee(PAGE) || ["form","review"].includes(PAGE)) PAGE = "tasks";   // las páginas de detalle dependen del usuario anterior
    render();
  }catch(e){ err(e, "Error al entrar"); }
}
async function reload(){ progress(true); try{ await loadCatalog(); await render(true); toast("Actualizado"); }catch(e){ err(e,"Error al actualizar"); } finally { progress(false); } }

    <div class="card kpi"><span class="v">${pending.length}</span><span class="l">Reviews pendientes</span><span class="d ${pending.length?'neg':''}">${pending.length ? "por completar" : "todo al día"}</span></div>
    <div class="card kpi"><span class="v">${open.filter(a=>a.status==="submitted").length}</span><span class="l">Reviews enviadas</span><span class="d">en los ciclos abiertos</span></div>
    <div class="card kpi"><span class="v">${CYCLES.filter(c=>c.status==="open").length}</span><span class="l">Ciclos abiertos</span><span class="d">${CYCLES.filter(c=>c.status==="open").map(c=>esc(c.name)).join(", ")||"ninguno ahora"}</span></div>
  </div>
  ${cyclesSorted.length ? cyclesSorted.map(c => {
    const list = byCycle[c.id];
    const needPick = c.status==='open' && (c.visibility||{}).reviewee_picks && list.some(a=>a.role==='self') && !PICKED[c.id];
    return `<div class="card" style="margin-bottom:16px"><h3><i class="ti ti-clipboard-check"></i> ${esc(c.name)} <span class="r"><span class="pill ${c.status==='open'?'ok':c.status==='published'?'':'gray'}">${CYCLE_STATUS[c.status]}</span> ${c.closes_at?`<span class="xs mut">cierra ${fmtD(c.closes_at)}</span>`:""}</span></h3>
     ${needPick ? `<div class="alert warn" style="margin-bottom:12px"><i class="ti ti-users-plus"></i> <span style="flex:1">En este ciclo eliges tú a los 2-3 compañeros que te dan feedback. Se hace desde tu autoevaluación.</span><button class="btn sm pri" onclick="go('form','${list.find(a=>a.role==='self').id}')">Elegir ahora</button></div>` : ""}
     <table><tr><th>Persona</th><th>Tipo de review</th><th>Formulario</th><th>Estado</th><th></th></tr>
     ${list.sort((a,b)=>(a.role==='self'?0:a.role==='lead'?1:2)-(b.role==='self'?0:b.role==='lead'?1:2)).map(a => { const f = byId(FORMS, a.form_id); return `<tr>
        <td class="row">${av(a.reviewee,"sm")} ${a.role==='self' ? "<b>Yo</b>" : esc(fullName(a.reviewee))}</td>
        <td><span class="pill ${a.role==='self'?'':a.role==='lead'?'ok':'warn'}">${ROLE_LABEL[a.role]}</span></td>
        <td class="sm mut">${esc(f?f.name:"—")}</td>
        <td>${a.status==='submitted'?`<span class="y">Enviada</span> <span class="xs mut">${fmtD(a.submitted_at)}</span>`:a.status==='draft'?`<span class="p">Borrador</span>`:`<span class="mut">Pendiente</span>`}</td>
        <td style="text-align:right">${a.status!=='submitted'&&c.status!=='open'?`<span class="xs mut" style="margin-right:8px">se abrirá pronto</span>`:""}<button class="btn sm ${a.status!=='submitted'&&c.status==='open'?'pri':''}" onclick="go('form','${a.id}')">${a.status==='submitted'?'Ver':c.status==='open'?(a.status==='draft'?'Continuar':'Empezar'):'Ver'}</button></td></tr>`; }).join("")}
     </table></div>`; }).join("")
   : `<div class="card"><div class="empty"><div class="ic"><i class="ti ti-clipboard-check"></i></div><div class="t">No tienes reviews asignadas</div><div class="d">Cuando se abra un ciclo de evaluación, aquí aparecerán tu autoevaluación y las reviews de tus compañeros que te toque completar.</div>${isAdmin()?`<button class="btn pri" style="margin-top:14px" onclick="go('admin')"><i class="ti ti-plus"></i> Crear un ciclo</button>`:""}</div></div>`}`;
};

/* ---------- FORMULARIO (una asignación) ---------- */
let CUR = null; // {a, form, answers:{qid:{value_num,value_text}}, cycle}
AFTER.form = async function(){ updateProgress(); };
PAGES.form = async function(id){
  const { data:a, error } = await sb.from("assignments").select(ASSIGN_SELECT).eq("id", id).single();
  if(error) throw error;
  const form = byId(FORMS, a.form_id), cycle = byId(CYCLES, a.cycle_id);
  const { data:ans, error:e2 } = await sb.from("answers").select("*").eq("assignment_id", id);
  if(e2) throw e2;
  const answers = {}; for(const x of ans) answers[x.question_id] = x;
  CUR = { a, form, answers, cycle };
  const mine = a.reviewer_id === ME.id;
  const editable = mine && a.status !== "submitted" && cycle.status === "open";
  document.getElementById("title").textContent = `${esc(cycle.name)} · ${a.role==='self' ? "Mi autoevaluación" : fullName(a.reviewee)}`;
  const groups = questionsFor(form, a.role);

  // Contexto: autoevaluación del evaluado (para lead, y para compañeros si el ciclo lo permite)
  let selfBlock = "";
  if(a.role === "lead" && cycle.kind !== "cascade"){   // en junio el lead responde sin ver la autoevaluación (la ve después, en la ficha)
    const { data:selfRows } = await sb.from("assignments").select("id,status,form_id").eq("cycle_id", a.cycle_id).eq("reviewee_id", a.reviewee_id).eq("role","self").limit(1); const selfA = selfRows && selfRows[0];
    if(selfA && selfA.status === "submitted"){
      const { data:sAns } = await sb.from("answers").select("*").eq("assignment_id", selfA.id);
      const sf = byId(FORMS, selfA.form_id);
      if(sAns && sAns.length) selfBlock = `<details class="card" style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:700;color:var(--ink)"><i class="ti ti-user"></i> Autoevaluación de ${esc(fullName(a.reviewee))} (enviada)</summary><div style="margin-top:12px">${renderReadonly(sf, "self", sAns)}</div></details>`;
    } else if(a.role === "lead") selfBlock = `<div class="alert info" style="margin-bottom:16px"><i class="ti ti-info-circle"></i> ${esc(fullName(a.reviewee))} todavía no ha enviado su autoevaluación.</div>`;
  }
  // Para el lead: respuestas de los compañeros ya enviadas
  let peersBlock = "";
  if(a.role === "lead" && cycle.kind !== "cascade"){
    const { data:peers } = await sb.from("assignments").select(ASSIGN_SELECT).eq("cycle_id", a.cycle_id).eq("reviewee_id", a.reviewee_id).eq("role","peer");
    if(peers && peers.length){
      const done = peers.filter(p => p.status === "submitted");
      let inner = `<div class="sm mut" style="margin-bottom:8px">${done.length} de ${peers.length} compañeros han enviado: ${peers.map(p=>`${esc(fullName(p.reviewer))} ${p.status==='submitted'?'<span class="y">●</span>':'<span style="color:#c9d2df">○</span>'}`).join(" · ")}</div>`;
      if(done.length){
        const { data:pAns } = await sb.from("answers").select("*").in("assignment_id", done.map(p=>p.id));
        inner += done.map(p => `<details style="margin-top:8px"><summary style="cursor:pointer" class="b sm">${esc(fullName(p.reviewer))} · ${fmtD(p.submitted_at)}</summary><div style="margin-top:8px">${renderReadonly(byId(FORMS,p.form_id), "peer", (pAns||[]).filter(x=>x.assignment_id===p.id))}</div></details>`).join("");
      }
      peersBlock = `<details class="card" style="margin-bottom:16px" ${done.length?"open":""}><summary style="cursor:pointer;font-weight:700;color:var(--ink)"><i class="ti ti-users"></i> Lo que han dicho los compañeros</summary><div style="margin-top:12px">${inner}</div></details>`;
    }
  }

  let picksBlock = "";
  if(a.role === "self" && (cycle.visibility||{}).reviewee_picks && mine){
    const { data:others } = await sb.from("assignments").select(ASSIGN_SELECT).eq("cycle_id", a.cycle_id).eq("reviewee_id", ME.id).in("role", ["peer","lead"]);
    const peers = (others||[]).filter(x=>x.role==='peer'), lead = (others||[]).find(x=>x.role==='lead');
    const locked = peers.some(x => x.status !== 'pending') || cycle.status !== 'open';
    const popts = sel => PEOPLE.filter(p=>p.active && p.id!==ME.id).sort((x,y)=>x.last_name.localeCompare(y.last_name)).map(p=>`<option value="${p.id}" data-p="${p.id}" ${sel===p.id?"selected":""}>${esc(fullName(p))}</option>`).join("");
    picksBlock = `<div class="card" style="margin-bottom:16px"><h3><i class="ti ti-users-plus"></i> Quién te da feedback <span class="r">${peers.length?`<span class="pill ok">${peers.length} compañero${peers.length>1?'s':''} elegidos</span>`:`<span class="pill warn">pendiente de elegir</span>`}</span></h3>
      <p class="sm mut" style="margin:0 0 12px">Elige a <b>2 o 3 compañeros</b> con los que hayas trabajado este semestre. Te darán feedback sin ver tu autoevaluación. Tu lead reviewer lo asigna administración${lead ? `: <b>${esc(fullName(lead.reviewer))}</b>` : " (todavía sin asignar)"}; puede ser también uno de los compañeros que elijas.</p>
      <div class="two"><div><label class="xs mut">Compañero 1</label><select class="inp" id="pk1"><option value="">—</option>${popts(peers[0]&&peers[0].reviewer_id)}</select></div><div><label class="xs mut">Compañero 2</label><select class="inp" id="pk2"><option value="">—</option>${popts(peers[1]&&peers[1].reviewer_id)}</select></div>
        <div><label class="xs mut">Compañero 3 (opcional)</label><select class="inp" id="pk3"><option value="">—</option>${popts(peers[2]&&peers[2].reviewer_id)}</select></div></div>
      ${locked ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> Alguno de tus revisores ya ha empezado: la elección queda fijada. Habla con administración si hace falta cambiarla.</div>`
               : `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri sm" onclick="saveReviewerPicks('${a.cycle_id}')"><i class="ti ti-check"></i> Guardar elección</button></div>`}</div>`;
  }
  const head = `<div class="card" style="margin-bottom:16px"><div class="row" style="gap:16px">${av(a.reviewee,"lg")}
    <div style="flex:1"><div class="hd">${a.role==='self' ? "Mi autoevaluación" : esc(fullName(a.reviewee))}</div>
      <div class="mut sm">${esc(a.reviewee.position||"")} · ${TEAM_LABEL[a.reviewee.team]||""} · <span class="pill ${a.role==='self'?'':a.role==='lead'?'ok':'warn'}">${ROLE_LABEL[a.role]}</span> · ${esc(form.name)}</div></div>
    <div style="text-align:right"><div class="pill ${a.status==='submitted'?'ok':a.status==='draft'?'warn':'gray'}">${STATUS_LABEL[a.status]}</div>${a.submitted_at?`<div class="xs mut" style="margin-top:4px">${fmtDT(a.submitted_at)}</div>`:""}</div></div>
    ${form.intro ? `<div class="hint" style="margin-top:12px">${esc(form.intro)}</div>` : ""}
    ${!mine ? `<div class="alert info" style="margin-top:12px"><i class="ti ti-eye"></i> Estás viendo la evaluación escrita por <b>${esc(fullName(a.reviewer))}</b>.</div>` : ""}
    ${mine && a.status !== "submitted" && cycle.status !== "open" ? `<div class="alert warn" style="margin-top:12px"><i class="ti ti-lock"></i> <span style="flex:1">Este ciclo todavía no está abierto (${CYCLE_STATUS[cycle.status].toLowerCase()}). Podrás responder cuando administración lo abra.</span>${isAdmin()?`<button class="btn sm pri" onclick="openCycleNow('${cycle.id}','${a.id}')"><i class="ti ti-lock-open"></i> Abrir el ciclo ahora</button>`:""}</div>` : ""}
    ${mine && a.role==='peer' ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> Tu respuesta no la verá ningún otro compañero ni la persona evaluada: la leen solo su lead reviewer y los socios con acceso. La persona recibe únicamente el resumen final de su lead.</div>` : ""}
    ${mine && a.status === "submitted" ? `<div class="hint" style="margin-top:8px"><i class="ti ti-lock"></i> Respuesta enviada. Si necesitas corregir algo, pídelo a administración: pueden reabrirla mientras el ciclo esté abierto.</div>` : ""}
  </div>`;

  const body = editable ? renderEditable(groups) : renderReadonly(form, a.role, ans);
  const foot = editable ? `<div class="card" style="position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 20px">
      <div style="flex:1;display:flex;align-items:center;gap:12px"><div class="bar" style="width:160px"><span id="fprog" style="width:0"></span></div><span class="sm mut" id="fprogTxt"></span><span class="xs mut" id="saveState">Borrador guardado automáticamente</span></div>
      <button class="btn" onclick="go('tasks')">Volver</button>
      <button class="btn pri" onclick="submitCurrent()"><i class="ti ti-check"></i> Guardar respuesta final</button></div>`
    : `<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="history.length>1?go('tasks'):go('tasks')">Volver</button></div>`;
  return head + picksBlock + selfBlock + peersBlock + body + foot;
};

async function saveReviewerPicks(cycleId){
  const g = x => document.getElementById(x).value;
  const peers = [g("pk1"), g("pk2"), g("pk3")].filter(Boolean);
  if(new Set(peers).size !== peers.length) return toast("Has repetido un compañero", true);
  if(peers.length < 2) return toast("Elige al menos dos compañeros", true);
  const { error } = await sb.rpc("choose_reviewers", { p_cycle:cycleId, p_peers:peers });
  if(error) return err(error, "No se pudo guardar la elección");
  toast("Compañeros guardados"); render();
}
async function openCycleNow(cycleId, assignmentId){
  const { error } = await sb.from("cycles").update({ status:"open" }).eq("id", cycleId);
  if(error) return err(error, "No se pudo abrir el ciclo");
  toast("Ciclo abierto: ya se puede responder"); await loadCatalog(); go("form", assignmentId);
}
function scaleHTML(q, val, editable, qid){
  const n = (q.scale_max||5) - (q.scale_min||1) + 1;
  return `<div class="row" style="gap:12px;flex-wrap:wrap"><span class="xs mut" style="width:70px;text-align:right">${esc(q.scale_low||"")}</span>
    <div class="scale" style="margin:0">${Array.from({length:n},(_,i)=>{ const v=(q.scale_min||1)+i; return `<span class="${editable?'':'ro'} ${val===v?'on':''}" ${editable?`onclick="setScale('${qid}',${v},this)"`:""}>${v}</span>`; }).join("")}</div>
    <span class="xs mut" style="width:90px">${esc(q.scale_high||"")}</span></div>`;
}
function renderEditable(groups){
  return groups.map(g => `<div class="card" style="margin-bottom:16px"><h3>${g.section.position}. ${esc(g.section.title)}</h3>${g.section.help?`<div class="hint" style="margin:-6px 0 12px">${esc(g.section.help)}</div>`:""}
    ${g.questions.map(q => { const a = CUR.answers[q.id] || {}; return `<div class="q"><div class="qt">${esc(q.text)} ${q.required?'<span class="n" title="obligatoria">*</span>':'<span class="tag">opcional</span>'}</div>${q.help?`<div class="xs mut" style="margin:-4px 0 8px">${esc(q.help)}</div>`:""}
      ${q.kind==='scale' ? scaleHTML(q, a.value_num, true, q.id) : `<textarea data-q="${q.id}" placeholder="Escribe aquí…" oninput="queueSave('${q.id}', this.value)" ${q.kind==='short_text'?'style="min-height:44px"':''}>${esc(a.value_text||"")}</textarea>`}</div>`; }).join("")}</div>`).join("");
}
function renderReadonly(form, role, ansList){
  const map = {}; for(const x of (ansList||[])) map[x.question_id] = x;
  const groups = questionsFor(form, role);
  return groups.map(g => `<div class="card" style="margin-bottom:16px"><h3>${g.section.position}. ${esc(g.section.title)}</h3>
    ${g.questions.map(q => { const a = map[q.id]; const empty = !a || (a.value_num==null && !(a.value_text||"").trim());
      return `<div class="q"><div class="qt">${esc(q.text)}</div>${q.kind==='scale' ? scaleHTML(q, a?.value_num, false) : `<div class="ans">${empty?'<span class="mut">— sin respuesta —</span>':esc(a.value_text).replace(/\n/g,"<br>")}</div>`}</div>`; }).join("")}</div>`).join("");
}

// Guardado automático (upsert por pregunta), con un pequeño retardo para los textos
const SAVE_T = {};
function queueSave(qid, text){ clearTimeout(SAVE_T[qid]); setState("Guardando…"); SAVE_T[qid] = setTimeout(()=>saveAnswer(qid, {value_text:text}), 700); }
function setScale(qid, v, el){ [...el.parentNode.children].forEach(s=>s.classList.remove("on")); el.classList.add("on"); saveAnswer(qid, {value_num:v}); }
function setState(t){ const s=document.getElementById("saveState"); if(s) s.textContent=t; }
function updateProgress(){ if(!CUR) return; const groups = questionsFor(CUR.form, CUR.a.role); let total=0, done=0; for(const g of groups) for(const q of g.questions){ total++; const a = CUR.answers[q.id]; if(a && (a.value_num!=null || (a.value_text||"").trim())) done++; } const b=document.getElementById("fprog"), t=document.getElementById("fprogTxt"); if(b) b.style.width = (total? done/total*100 : 0) + "%"; if(t) t.textContent = `${done} de ${total} respondidas`; }
async function saveAnswer(qid, patch){
  try{
    const prev = CUR.answers[qid] || {};
    const row = { assignment_id: CUR.a.id, question_id: qid, value_num: patch.value_num ?? prev.value_num ?? null, value_text: patch.value_text ?? prev.value_text ?? null, updated_at: new Date().toISOString() };
    const { data, error } = await sb.from("answers").upsert(row, { onConflict:"assignment_id,question_id" }).select().single();
    if(error) throw error;
    CUR.answers[qid] = data; updateProgress();
    if(CUR.a.status === "pending"){ await sb.from("assignments").update({status:"draft"}).eq("id", CUR.a.id); CUR.a.status = "draft"; }
    setState("Guardado " + new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ setState("Error al guardar"); err(e, "No se pudo guardar"); }
}
async function submitCurrent(){
  // comprobar obligatorias en cliente para dar un mensaje claro (el servidor vuelve a comprobar)
  const groups = questionsFor(CUR.form, CUR.a.role);
  const missing = [];
  for(const g of groups) for(const q of g.questions){ const a = CUR.answers[q.id]; if(q.required && (!a || (a.value_num==null && !(a.value_text||"").trim()))) missing.push(q.text); }
  if(missing.length){ openModal(`<h2>Faltan respuestas obligatorias</h2><ul class="sm">${missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul><div style="text-align:right"><button class="btn pri" onclick="closeModal()">Volver al formulario</button></div>`); return; }
  openModal(`<h2>¿Guardar la respuesta final?</h2><p class="sm">Una vez guardada como final no se puede modificar (si hubiera un error, administración puede reabrirla). ${CUR.a.role==='peer'?"Ningún otro compañero ni la persona evaluada verán tu respuesta; solo su lead reviewer.":CUR.a.role==='lead'?"Después podrás leer las respuestas de los compañeros y escribir el resumen final.":"Tu lead reviewer la leerá cuando escriba tu resumen final."}</p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="doSubmit()"><i class="ti ti-check"></i> Guardar respuesta final</button></div>`);
}
async function doSubmit(){
  closeModal();
  const { error } = await sb.rpc("submit_assignment", { p_assignment: CUR.a.id });
  if(error){ err(error, "No se pudo enviar"); return; }
  toast("Respuesta final guardada"); go("tasks");
}

/* ---------- MIS RESULTADOS (lo publicado sobre mí) ---------- */
// Construye la vista de resultados de una persona: ciclo actual + el anterior del mismo tipo para comparar
async function buildResultsView(personId, cycleId, fetchRows){
  const c = byId(CYCLES, cycleId); if(!c) return null;
  const { data:frs } = await sb.from("final_reviews").select("*").eq("reviewee_id", personId);
  const fr = (frs||[]).find(f => f.cycle_id === c.id && f.status === 'sent');
  const cur = { c, rows: await fetchRows(c.id), fr };
  let prev = null, dec = null;
  if(c.kind === '360'){
    // Diciembre: comparar con el diciembre anterior (arañas, barras y objetivos que le pusieron)
    const prevC = CYCLES.filter(x => x.kind === '360' && (x.opens_at||"") < (c.opens_at||"")).sort((x,y) => (y.opens_at||"").localeCompare(x.opens_at||""));
    for(const pc of prevC){ const rows = await fetchRows(pc.id); const pfr = (frs||[]).find(f => f.cycle_id === pc.id && f.status === 'sent'); if((rows && rows.length) || pfr){ prev = { c:pc, rows: rows||[], fr:pfr }; break; } }
  } else {
    // Junio: los objetivos del último diciembre (el año no ha acabado y son los mismos objetivos)
    const decs = CYCLES.filter(x => x.kind === '360' && (x.opens_at||"") <= (c.opens_at||"9999")).sort((x,y) => (y.opens_at||"").localeCompare(x.opens_at||""));
    for(const dc of decs){ const dfr = (frs||[]).find(f => f.cycle_id === dc.id && f.status === 'sent' && f.objectives); if(dfr){ dec = { c:dc, fr:dfr }; break; } }
  }
  return { cur, prev, dec, personId };
}
function resultsHTML(view, who){
  const { cur, prev, dec } = view; const { c, fr } = cur;
  const box = (k, v, full) => `<div class="fr-box ${full?'full':''}"><div class="k">${k}</div><div class="v ${v?'':'empty'}">${v ? esc(v) : "—"}</div></div>`;
  const tu = who === 'me';
  if(c.kind !== '360'){
    // ---- Junio (Mid Term Feedback): solo el resumen del lead y los objetivos de diciembre. Sin gráficos. ----
    const decBlock = dec ? `<div class="prev-obj"><div class="k"><i class="ti ti-target"></i> Objectives ${tu ? "que te pusieron" : "que le pusieron"} en ${esc(dec.c.name)} <span class="pill gray" style="margin-left:auto">${dec.fr.objectives_year||""}</span></div><div class="v">${esc(dec.fr.objectives)}</div></div>` : "";
    return `${fr ? `<div class="fr-read">${box("Reviewer Summary", fr.summary, true)}${box("Top 3 Achievements", fr.positives)}${box("Top 3 Areas of Development", fr.development)}</div>`
                : (tu ? `<div class="hint" style="margin-bottom:14px">Tu lead reviewer todavía no ha enviado el resumen de este ciclo.</div>` : "")}${decBlock}`;
  }
  // ---- Diciembre (Performance Evaluation): como siempre, con la comparación con el año anterior ----
  const stats = scaleStats(cur.rows), pstats = prev ? scaleStats(prev.rows) : null;
  const hasScales = Object.keys(stats).some(k => k !== "_n"), hasPrev = !!(pstats && Object.keys(pstats).some(k => k !== "_n"));
  const yr = fr && fr.objectives_year ? fr.objectives_year : (c.opens_at ? new Date(c.opens_at).getFullYear()+1 : "");

// Araña con tres líneas y pop-up de las tres notas al pasar por un eje
function radar3(canvasId, labels, W, A, S){
  const ctx = document.getElementById(canvasId); if(!ctx || !window.Chart) return;
  const ds = [ rds("Media ponderada", W, "#0e9aab"), rds("Media aritmética", A, "#0e2150") ];
  if(S && S.some(v => v != null)) ds.push({ ...rds("Tu autoevaluación", S, "#e8862e", true), label:"Autoevaluación", pointStyle:"rectRot", pointRadius:4 });
  const showIdx = (ch, idx, evt) => { const act = ch.data.datasets.map((d, i) => d.data[idx] != null ? { datasetIndex:i, index:idx } : null).filter(Boolean); ch.setActiveElements(act); ch.tooltip.setActiveElements(act, { x:evt.x, y:evt.y }); ch.update("none"); };
  const clear = ch => { ch.setActiveElements([]); ch.tooltip.setActiveElements([], {x:0,y:0}); ch.update("none"); };
  const chart = new Chart(ctx, { type:"radar", data:{ labels, datasets:ds }, options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:400 },
    interaction:{ mode:"index", intersect:true },   // sobre un punto: las tres notas de ese eje; en el vacío: nada
    scales:{ r:{ min:0, max:5, ticks:{ stepSize:1, backdropColor:"transparent", font:{ size:10 } }, grid:{ color:"#e7e9ee" }, angleLines:{ color:"#e7e9ee" }, pointLabels:{ font:{ size:11, family:"Inter", weight:"600" }, color:"#2b3240" } } },
    plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, usePointStyle:true, font:{ size:11 } } },
      tooltip:{ mode:"index", intersect:true, callbacks:{ label: c => ` ${c.dataset.label}: ${c.parsed.r != null ? Number(c.parsed.r).toFixed(2) : "—"}` } } },
    onHover:(evt, els, ch) => {  // además: sobre el NOMBRE del eje (Attitude, Ownership…)
      const r = ch.scales.r; if(!r || !r.getPointLabelPosition) return;
      let hit = -1; for(let i = 0; i < ch.data.labels.length; i++){ const b = r.getPointLabelPosition(i); if(evt.x >= b.left-4 && evt.x <= b.right+4 && evt.y >= b.top-4 && evt.y <= b.bottom+4){ hit = i; break; } }
      if(hit >= 0){ if(ch._lbl !== hit){ ch._lbl = hit; showIdx(ch, hit, evt); } ctx.style.cursor = "default"; return; }
      if(ch._lbl != null){ ch._lbl = null; if(!els.length) clear(ch); }
    } } });
  ctx.addEventListener("mouseleave", () => { chart._lbl = null; clear(chart); });
  CHARTS.push(chart);
}
// Barras por nota: dos barras por valor (año anterior primero, luego este año), porcentaje encima de cada una
// y el número del eje que la persona se puso en su autoevaluación redondeado en rojo.
const PCT_PLUGIN = { id:"pct", afterDatasetsDraw(ch){
  const ctx = ch.ctx; ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const metas = ch.data.datasets.map((d, i) => ch.getDatasetMeta(i));
  ch.data.datasets.forEach((ds, di) => { const meta = metas[di]; if(meta.hidden) return; const tot = ds.data.reduce((x, y) => x + (y||0), 0) || 1;
    meta.data.forEach((el, i) => { const v = ds.data[i]; if(!v) return; const w = el.width || 26; const size = w < 22 ? 8.5 : 10;
      ctx.font = `600 ${size}px Inter, system-ui, sans-serif`;
      // si la barra vecina (el otro año) tiene casi la misma altura y están muy juntas, la etiqueta del año anterior sube un escalón para no pisarse
      let y = el.y - 3; const other = metas[1 - di]; const o = other && !other.hidden && other.data[i];
      if(di === 0 && o && ch.data.datasets[1].data[i] && Math.abs(o.y - el.y) < size + 2 && Math.abs(o.x - el.x) < size * 3.4) y -= size + 1;
      ctx.fillStyle = ds._lblColor || "#2b3240"; ctx.fillText(Math.round(v / tot * 100) + "%", el.x, y); }); });
  ctx.restore(); } };
const SELF_PLUGIN = { id:"selfmark", afterDraw(ch){
  const sv = ch.options._self; if(!sv) return; const i = Math.round(sv) - 1; if(i < 0 || i > 4) return;
  const x = ch.scales.x; const px = x.getPixelForTick(i); const li = x._labelItems && x._labelItems[i];
  const tr = li && ((li.options && li.options.translation) || li.translation);  // Chart.js dibuja la etiqueta en translation + textOffset, centrada en vertical
  const py = tr ? tr[1] + (li.textOffset || 0) : x.top + 20;
  const ctx = ch.ctx; ctx.save(); ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.strokeStyle = "#d64545"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); } };
function bars2(canvasId, cur, prv, labelCur, labelPrev, selfScore){
  const ctx = document.getElementById(canvasId); if(!ctx || !window.Chart) return;
  const datasets = [];
  if(prv) datasets.push({ label:labelPrev, data:prv, backgroundColor:"#a9cdf4", _lblColor:"#5b7fae", borderRadius:4, maxBarThickness:26, categoryPercentage:0.7, barPercentage:0.9 });
  datasets.push({ label:labelCur, data:cur, backgroundColor:"#0e2150", _lblColor:"#0e2150", borderRadius:4, maxBarThickness:26, categoryPercentage:0.7, barPercentage:0.9 });
  const pct = (ds, v) => { const tot = ds.data.reduce((x, y) => x + (y||0), 0) || 1; return Math.round(v / tot * 100); };
  const showIdx = (ch, idx, evt) => { const act = ch.data.datasets.map((d, i) => ({ datasetIndex:i, index:idx })); ch.setActiveElements(act); ch.tooltip.setActiveElements(act, { x:evt.x, y:evt.y }); ch.update("none"); };
  const clear = ch => { ch.setActiveElements([]); ch.tooltip.setActiveElements([], {x:0,y:0}); ch.update("none"); };
  const selfIdx = selfScore ? Math.round(selfScore) - 1 : -1;
  const chart = new Chart(ctx, { type:"bar", data:{ labels:["1","2","3","4","5"], datasets }, plugins:[PCT_PLUGIN, SELF_PLUGIN],
    options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:400 }, interaction:{ mode:"index", intersect:true }, _self:selfScore,
      layout:{ padding:{ bottom:6 } },
      plugins:{ legend:{ display:false }, tooltip:{ mode:"index", intersect:true, callbacks:{ title: it => `Nota ${it[0].label}${selfIdx === it[0].dataIndex ? " · tu autoevaluación" : ""}`, label: c => ` ${c.dataset.label}: ${c.parsed.y} opini${c.parsed.y===1?"ón":"ones"} (${pct(c.dataset, c.parsed.y)}%)` } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ font: t => ({ size:11, weight: t.index === selfIdx ? "700" : "400" }), color: t => t.index === selfIdx ? "#d64545" : "#5c6675", padding:6 } },
               y:{ beginAtZero:true, grace:"25%", ticks:{ precision:0, font:{ size:10 } }, grid:{ color:"#eef0f3" } } },
      onHover:(evt, els, ch) => {  // además: sobre el NÚMERO del eje (1, 2, 3, 4, 5)
        const x = ch.scales.x; let hit = -1;
        if(evt.y >= x.top && evt.y <= x.bottom){ for(let i = 0; i < 5; i++){ const px = x.getPixelForTick(i); if(Math.abs(evt.x - px) <= 12){ hit = i; break; } } }
        if(hit >= 0){ if(ch._lbl !== hit){ ch._lbl = hit; showIdx(ch, hit, evt); } return; }
        if(ch._lbl != null){ ch._lbl = null; if(!els.length) clear(ch); }
      } } });
  ctx.addEventListener("mouseleave", () => { chart._lbl = null; clear(chart); });
  CHARTS.push(chart);
}
// Medias por competencia a partir de las filas de my_results / results_for (compañeros + lead; la autoevaluación aparte)
function scaleStats(rows){
  const out = {}; const keys = new Set();
  for(const r of rows){ if(r.kind !== 'scale' || r.value_num == null) continue; const o = (out[r.question_code] ||= { text:r.question_text, self:null, sum:0, n:0, wsum:0, w:0 });
    if(r.role === 'self'){ o.self = Number(r.value_num); continue; }
    const w = r.weight || 1; o.sum += Number(r.value_num); o.n++; o.wsum += Number(r.value_num) * w; o.w += w; if(r.response_key) keys.add(r.response_key);
    o.hist = o.hist || [0,0,0,0,0]; const b = Math.min(5, Math.max(1, Math.round(Number(r.value_num)))); o.hist[b-1]++; }
  for(const k in out){ if(!out[k].n) delete out[k]; }
  if(Object.keys(out).length) out._n = keys.size || Math.max(...Object.values(out).filter(o=>o.n!=null).map(o=>o.n));
  return out;
}
function drawResults(view){

  if(ps && document.getElementById("rad_prev")){ const pc = codes.filter(k => ps[k]); radar3("rad_prev", pc.map(lab), pc.map(k => +(ps[k].wsum/ps[k].w).toFixed(2)), pc.map(k => +(ps[k].sum/ps[k].n).toFixed(2)), pc.map(k => ps[k].self)); }
  codes.forEach((k, j) => bars2(`dist_${j}`, st[k].hist || [0,0,0,0,0], ps && ps[k] ? (ps[k].hist || [0,0,0,0,0]) : null, view.cur.c.period_label || "Este año", view.prev ? (view.prev.c.period_label || "Año anterior") : "", st[k].self));
}

/* ---------- Excel (CSV) con todas las respuestas de un ciclo: una fila por respuesta, una columna por pregunta ---------- */
async function exportCycleExcel(cycleId, revieweeId){
  const c = byId(CYCLES, cycleId);
  let q = sb.from("assignments").select(ASSIGN_SELECT).eq("cycle_id", cycleId).eq("status", "submitted"); if(revieweeId) q = q.eq("reviewee_id", revieweeId);
  const { data:as, error } = await q; if(error) return err(error, "Excel");
  if(!as || !as.length) return toast("No hay respuestas enviadas que exportar");
  const { data:ans } = await sb.from("answers").select("*").in("assignment_id", as.map(a=>a.id));
  // columnas: todas las preguntas de los formularios del ciclo, en orden, sin repetir código
  const cols = []; const seen = new Set();
  for(const cf of (c.cycle_forms||[])){ const f = byId(FORMS, cf.form_id); if(!f) continue; for(const sec of f.form_sections) for(const qq of sec.questions){ if(!seen.has(qq.code)){ seen.add(qq.code); cols.push({ code:qq.code, text:qq.text }); } } }
  const qById = {}; for(const f of FORMS) for(const sec of f.form_sections) for(const qq of sec.questions) qById[qq.id] = qq;
  const order = { self:0, lead:1, peer:2 };
  const rows = as.slice().sort((x,y) => fullName(x.reviewee).localeCompare(fullName(y.reviewee)) || order[x.role]-order[y.role] || fullName(x.reviewer).localeCompare(fullName(y.reviewer))).map(a => {
    const byCode = {}; for(const an of (ans||[]).filter(x=>x.assignment_id===a.id)){ const qq = qById[an.question_id]; if(qq) byCode[qq.code] = an.value_num != null ? an.value_num : (an.value_text||""); }
    return [fullName(a.reviewee), TEAM_LABEL[a.reviewee.team]||"", ROLE_LABEL[a.role], fullName(a.reviewer), a.submitted_at ? fmtD(a.submitted_at) : ""].concat(cols.map(col => byCode[col.code] ?? ""));
  });
  const head = ["Persona evaluada","Equipo","Tipo de review","Evaluador","Enviada"].concat(cols.map(col => col.text));
  const cell = v => `"${String(v).replace(/"/g,'""').replace(/\r?\n/g," ")}"`;
  const csv = [head.map(cell).join(";")].concat(rows.map(r => r.map(cell).join(";"))).join("\n");
  const blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }); const u = URL.createObjectURL(blob); const el = document.createElement("a"); el.href = u;
  el.download = `${c.name}${revieweeId ? " - " + fullName(person(revieweeId)) : ""}.csv`.replace(/[\\/:*?"<>|]/g,"-"); el.click(); URL.revokeObjectURL(u);
  toast(`Excel con ${rows.length} respuestas`);
}

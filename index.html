    <span class="sm mut" style="margin-left:12px">${act.length} personas · ${partners.length} socios · 3 equipos</span></div>`;
  if(DIR_VIEW === "org"){
    return bar + orgChartHTML() + `<div class="hint" style="margin-top:14px">Organigrama oficial de Abac Capital. Los equipos que se usan en las evaluaciones (Deal Team, Operations y Nest) se ven en «Por equipos»; no cambian por lo que aparezca aquí.</div>`;
  }
  if(DIR_VIEW === "teams"){
    return bar + [...TEAMS3, [null,"Sin equipo"]].map(([t,label]) => { const list = act.filter(p => (p.team||null)===t).sort((a,b)=>(b.is_partner-a.is_partner) || bySeniority(a,b)); if(!list.length) return ""; return `<div style="margin-bottom:18px"><div class="row" style="margin-bottom:8px">${t?pillTeam(t):'<span class="pill gray">Sin equipo</span>'}<span class="sm mut">${list.length} personas</span></div>
      <div class="grid g4">${list.map(p=>`<div class="card" style="padding:12px 14px;cursor:pointer" onclick="personInfo('${p.id}')"><div class="row">${av(p)}<div style="min-width:0"><div class="b" style="font-size:13px">${esc(fullName(p))}</div><div class="xs mut">${esc(p.position||"")}</div></div></div><div class="row" style="margin-top:8px;gap:5px">${p.is_partner?'<span class="pill navy">Socio</span>':''}${p.is_admin?'<span class="pill pur">Admin</span>':''}<span class="xs mut">desde ${fmtD(p.start_date)}</span></div></div>`).join("")}</div></div>`; }).join("");
  }
  return bar + `<div class="card"><table><tr><th>Persona</th><th>Puesto</th><th>Equipo</th><th>Desde</th><th>Roles</th></tr>
    ${act.slice().sort((a,b)=>(a.team||"z").localeCompare(b.team||"z") || (b.is_partner-a.is_partner) || bySeniority(a,b)).map(p=>`<tr class="click" onclick="personInfo('${p.id}')"><td class="row">${av(p,"sm")} ${esc(fullName(p))}</td><td class="sm">${esc(p.position||"")}</td><td>${pillTeam(p.team)||'<span class="pill gray">—</span>'}</td><td class="xs mut">${fmtD(p.start_date)}</td><td>${p.is_partner?'<span class="pill navy">Socio</span> ':''}${p.is_admin?'<span class="pill pur">Admin</span>':''}</td></tr>`).join("")}</table></div>`;
};
function personInfo(id){
  const p = person(id); if(!p) return;
  openModal(`<div class="row" style="gap:14px">${av(p,"lg")}<div><h2 style="margin:0">${esc(fullName(p))}</h2><div class="mut sm">${esc(p.position||"")} · ${TEAM_LABEL[p.team]||"sin equipo"}</div></div></div>
    <table style="margin-top:14px"><tr><td class="mut">Correo</td><td class="num">${esc(p.email)}</td></tr><tr><td class="mut">En Abac desde</td><td class="num">${fmtD(p.start_date)}</td></tr><tr><td class="mut">Roles en la app</td><td class="num">${p.is_partner?'<span class="pill navy">Socio</span> ':''}${p.is_admin?'<span class="pill pur">Admin</span> ':''}${p.is_hr_admin?'<span class="pill pur">Admin RRHH</span>':''}${!p.is_partner&&!p.is_admin&&!p.is_hr_admin?'<span class="pill gray">Empleado</span>':''}</td></tr></table>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">${isAdmin()?`<button class="btn" onclick="closeModal();editPerson('${p.id}')"><i class="ti ti-pencil"></i> Editar</button>`:""}<button class="btn pri" onclick="closeModal()">Cerrar</button></div>`);
}

/* ---------- AUDITORÍA ---------- */
PAGES.audit = async function(){
  const { data, error } = await sb.from("audit_log").select("*").order("at", {ascending:false}).limit(300);
  if(error) throw error;
  const ACTION = { submit:"Envió una evaluación", read_results:"Leyó sus resultados", release:"Publicó", import:"Importó" };
  return `<div class="card"><h3><i class="ti ti-shield-lock"></i> Registro <span class="r">${data.length} entradas (últimas 300)</span></h3>
    <table><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Sobre quién</th><th>Ciclo</th></tr>
    ${data.map(a => `<tr><td class="xs mut">${fmtDT(a.at)}</td><td class="sm">${esc(a.actor_email||"")}</td><td class="sm">${ACTION[a.action]||esc(a.action)} ${a.details&&a.details.role?`<span class="tag">${ROLE_LABEL[a.details.role]||a.details.role}</span>`:""}</td><td class="sm">${a.person_id?esc(fullName(person(a.person_id))):"—"}</td><td class="xs mut">${a.cycle_id?esc((byId(CYCLES,a.cycle_id)||{}).name||""):""}</td></tr>`).join("")}</table>
    ${!data.length?`<div class="empty"><div class="ic"><i class="ti ti-shield-lock"></i></div><div class="t">Sin actividad todavía</div><div class="d">Aquí quedará registrado cada envío, cada lectura de resultados y cada publicación.</div></div>`:""}</div>`;
};
</script>
<script>
/* ============================================================================
   ADMINISTRACIÓN: ciclos, formularios por papel, asignaciones, publicación, ajustes
   ============================================================================ */
let ADM = { tab:"cycles", cycle:null };
PAGES.admin = async function(){
  if(!isAdmin()) return `<div class="lock"><i class="ti ti-lock"></i> Solo administración.</div>`;
  const tabs = [["cycles","Ciclos"],["assign","Asignaciones"],["people","Personas"],["settings","Ajustes"]];
  return `<div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${ADM.tab===k?'active':''}" onclick="ADM.tab='${k}';render()">${l}</div>`).join("")}</div>${await ADMIN[ADM.tab]()}`;
};
const ADMIN = {
  /* ----- Ciclos ----- */
  async cycles(){
    const anyOpen = CYCLES.some(c=>c.status==="open"), anyPub = CYCLES.some(c=>c.status==="published");
    const { data:asg } = CYCLES.length ? await sb.from("assignments").select("cycle_id").limit(1) : {data:[]};
    const guide = `<div class="card" style="margin-bottom:16px"><h3><i class="ti ti-route"></i> Cómo se lanza una review <span class="r">cuatro pasos, siempre en este orden</span></h3>
      <div class="steps4">
        <div class="step4 ${CYCLES.length?'done':''}"><div class="k">${CYCLES.length?'<i class="ti ti-check"></i>':'1'}</div><div class="t">Crear el ciclo</div><div class="d">Elige la plantilla (diciembre o junio), el nombre y las fechas.</div></div>
        <div class="step4 ${asg&&asg.length?'done':''}"><div class="k">${asg&&asg.length?'<i class="ti ti-check"></i>':'2'}</div><div class="t">Asignar</div><div class="d">Quién se autoevalúa, quién es lead de quién y qué compañeros opinan. Hay una propuesta automática.</div></div>
        <div class="step4 ${anyOpen||anyPub?'done':''}"><div class="k">${anyOpen||anyPub?'<i class="ti ti-check"></i>':'3'}</div><div class="t">Abrir</div><div class="d">Cambia el estado a «Abierto»: cada persona ve sus reviews en «Mis reviews».</div></div>
        <div class="step4 ${anyPub?'done':''}"><div class="k">${anyPub?'<i class="ti ti-check"></i>':'4'}</div><div class="t">Publicar</div><div class="d">Cuando todo esté enviado, publica desde «Todas las reviews». Cada persona lee lo suyo.</div></div>
      </div></div>`;
    return guide + `<div class="row" style="margin-bottom:14px;justify-content:flex-end"><button class="btn pri" onclick="editCycle(null)"><i class="ti ti-plus"></i> Nuevo ciclo</button></div>
    ${CYCLES.length ? `<div class="card"><table><tr><th>Ciclo</th><th>Tipo</th><th>Fechas</th><th>Estado</th><th>Avance</th><th>Qué verá cada persona</th><th></th></tr>
      ${CYCLES.map(c => { const v = c.visibility||{}; return `<tr><td class="b">${esc(c.name)}<div class="xs mut">${esc(c.period_label||"")}</div></td><td><span class="pill pur">${c.kind==='cascade'?'Cascada (junio)':'360 (diciembre)'}</span></td><td class="xs">${fmtD(c.opens_at)} → ${fmtD(c.closes_at)}</td>
        <td><select class="inp" style="width:auto;padding:4px 6px;font-size:12px" onchange="setCycleStatus('${c.id}',this.value)">${Object.entries(CYCLE_STATUS).map(([k,l])=>`<option value="${k}" ${c.status===k?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><span class="flow" title="Creado · Asignado · Abierto · Publicado"><i class="on"></i><i class="${(c.cycle_forms||[]).length?'on':''}"></i><i class="${['open','closed','published'].includes(c.status)?'on':''}"></i><i class="${c.status==='published'?'on':''}"></i></span>${(c.cycle_forms||[]).length?"":'<div class="xs n">sin formularios</div>'}</td>
        <td class="xs">${v.reviewee_sees_peers==='none'?"Solo su autoevaluación":v.reviewee_sees_peers==='full'?(v.peers_attributed?"Todo, con nombres":"Todo, sin nombres"):"La media de sus compañeros"}${v.reviewee_sees_lead===false?"":" y la valoración del lead"}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="editCycle('${c.id}')">Editar</button> <button class="btn sm" onclick="ADM.tab='assign';ADM.cycle='${c.id}';render()">Asignaciones</button></td></tr>`; }).join("")}</table></div>`
     : `<div class="card"><div class="empty"><div class="ic"><i class="ti ti-calendar-plus"></i></div><div class="t">Aún no hay ningún ciclo</div><div class="d">Empieza por «Nuevo ciclo»: con la plantilla de diciembre o de junio queda configurado en un minuto.</div><button class="btn pri" style="margin-top:14px" onclick="editCycle(null)"><i class="ti ti-plus"></i> Nuevo ciclo</button></div></div>`}`;
  },
  /* ----- Asignaciones ----- */
  async assign(){
    if(!CYCLES.length) return `<div class="card"><div class="empty"><div class="ic"><i class="ti ti-calendar-plus"></i></div><div class="t">Primero crea un ciclo</div><div class="d">Las asignaciones dicen quién evalúa a quién dentro de un ciclo.</div></div></div>`;
    ADM.cycle = ADM.cycle || CYCLES[0].id; const c = byId(CYCLES, ADM.cycle);
    const { data:as, error } = await sb.from("assignments").select("*").eq("cycle_id", c.id); if(error) throw error;
    window.ASG_CACHE = as;
    const hasForm = r => (c.cycle_forms||[]).some(x=>x.role===r);
    const people = PEOPLE.filter(p => p.active && isEvaluated(p));
    const byRev = {}; for(const a of as){ const r = (byRev[a.reviewee_id] ||= {self:null, lead:null, peers:[]}); if(a.role==='peer') r.peers.push(a); else r[a.role] = a; }
    const sent = as.filter(a=>a.status==='submitted').length;
    const leadSel = (p, r) => `<select class="inp" style="width:auto" onchange="setLead('${c.id}','${p.id}',this.value,${r.lead?`'${r.lead.id}'`:"null"})"><option value="">Sin lead reviewer</option>${PEOPLE.filter(x=>x.active&&x.id!==p.id).sort((x,y)=>x.last_name.localeCompare(y.last_name)).map(x=>`<option value="${x.id}" data-p="${x.id}" ${r.lead&&r.lead.reviewer_id===x.id?"selected":""}>${esc(fullName(x))}</option>`).join("")}</select>`;
    const peersCell = (p, r) => {
      const n = r.peers.length, done = r.peers.filter(a=>a.status==='submitted').length;
      const show = r.peers.slice(0,5).map(a=>av(person(a.reviewer_id),"sm")).join("");
      return `<div class="row" style="gap:12px"><span class="stack">${show}${n>5?`<span class="more">+${n-5}</span>`:""}</span>
        <span class="sm" style="min-width:110px">${n ? `<b>${n}</b> compañero${n>1?'s':''}${done?` <span class="xs mut">· ${done} enviada${done>1?'s':''}</span>`:""}` : '<span class="mut">ninguno</span>'}</span>
        <button class="btn sm" onclick="editPeers('${c.id}','${p.id}')"><i class="ti ti-pencil"></i> Editar</button></div>`;
    };
    const rows = [["deal","Deal Team"],["operations","Operations"],["nest","Nest"]].map(([t,label]) => {
      const list = people.filter(p=>p.team===t).sort(bySeniority); if(!list.length) return "";
      return `<tr class="teamhead"><td colspan="5"><div class="th">${pillTeam(t)}<span>${list.length} personas</span></div></td></tr>` +
        list.map(p => { const r = byRev[p.id] || {self:null,lead:null,peers:[]}; return `<tr>
          <td class="row" style="gap:10px">${av(p,"sm")}<div><div class="b" style="font-size:13px">${esc(fullName(p))}</div><div class="xs mut">${esc(p.position||"")}</div></div></td>
          <td>${r.self ? `<span class="dot ${r.self.status==='submitted'?'on':r.self.status==='draft'?'mid':''}"></span><span class="sm">${r.self.status==='submitted'?'enviada':r.self.status==='draft'?'en borrador':'pendiente'}</span> ${r.self.status==='pending'?`<button class="btn sm ghost" title="quitar" onclick="delAssign('${r.self.id}')"><i class="ti ti-x"></i></button>`:""}` : `<button class="btn sm" onclick="addAssign('${c.id}','${p.id}','${p.id}','self')">+ añadir</button>`}</td>
          <td>${leadSel(p, r)}${r.lead?` <span class="dot ${r.lead.status==='submitted'?'on':r.lead.status==='draft'?'mid':''}" title="${STATUS_LABEL[r.lead.status]}"></span>`:""}</td>
          <td>${peersCell(p, r)}</td></tr>`; }).join("");
    }).join("");
    return `<div class="row" style="margin-bottom:14px;gap:10px;flex-wrap:wrap">
      <select class="inp" style="width:auto" onchange="ADM.cycle=this.value;render()">${CYCLES.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
      <span class="sm mut">${as.length} asignaciones · ${Object.keys(byRev).length} personas · ${sent} enviadas</span><span style="flex:1"></span>
      <button class="btn pri" onclick="prefill360('${c.id}')"><i class="ti ti-wand"></i> Rellenar con la regla de diciembre</button>
      <button class="btn" onclick="bulkLeads('${c.id}')"><i class="ti ti-user-check"></i> Lead reviewer por equipo</button>
      <button class="btn" onclick="moreActions(this,'${c.id}')"><i class="ti ti-dots"></i></button></div>
    ${!hasForm('self')||!hasForm('peer')||!hasForm('lead') ? `<div class="alert warn" style="margin-bottom:14px"><i class="ti ti-alert-triangle"></i> A este ciclo le falta el cuestionario de ${['self','lead','peer'].filter(r=>!hasForm(r)).map(r=>ROLE_LABEL[r]).join(", ")}. Edítalo en «Ciclos» antes de asignar.</div>` : ""}
    <div class="card" style="padding-top:8px"><table><tr><th style="width:26%">Persona</th><th style="width:16%">Autoevaluación</th><th style="width:24%">Lead reviewer</th><th>Compañeros que la evalúan</th></tr>${rows}</table>
    ${!people.length?`<div class="emptystate">No hay personas activas.</div>`:""}</div>`;
  },
  /* ----- Personas ----- */
  async people(){
    const { data:all, error } = await sb.from("people").select("*").order("last_name"); if(error) throw error;
    return `<div class="row" style="margin-bottom:14px;justify-content:flex-end"><button class="btn pri" onclick="editPerson(null)"><i class="ti ti-user-plus"></i> Nueva persona</button></div>
    <div class="card"><table><tr><th>Persona</th><th>Correo</th><th>Puesto</th><th>Equipo</th><th>Desde</th><th>Roles</th><th>Activa</th><th></th></tr>
      ${all.map(p=>`<tr style="${p.active?'':'opacity:.5'}"><td class="row">${av(p,"sm")} ${esc(fullName(p))}</td><td class="xs">${esc(p.email)}</td><td class="sm">${esc(p.position||"")}</td><td>${pillTeam(p.team)||'<span class="pill gray">—</span>'}</td><td class="xs mut">${fmtD(p.start_date)}</td><td>${p.is_partner?'<span class="pill navy">Socio</span> ':''}${p.is_admin?'<span class="pill pur">Admin</span> ':''}${p.is_hr_admin?'<span class="pill pur">Admin RRHH</span> ':''}${p.sees_all&&!p.is_hr_admin?'<span class="pill">ve todo</span> ':''}${p.is_evaluated===false?'<span class="pill gray">no se evalúa</span>':''}</td><td>${p.active?'<span class="y">sí</span>':'<span class="mut">no</span>'}</td><td style="text-align:right"><button class="btn sm" onclick="editPerson('${p.id}')">Editar</button></td></tr>`).join("")}</table></div>`;
  },
  /* ----- Ajustes ----- */
  async settings(){
    return `<div class="grid g2"><div class="card"><h3>Modo sin login</h3>
      <p class="sm">Mientras esté <b>activado</b>, la versión de construcción de la app permite entrar como cualquier persona sin contraseña. <b>Desactívalo antes de cargar respuestas reales o de publicar la app.</b></p>
      <div class="row"><span class="pill ${SETTINGS.dev_mode?'warn':'ok'}">${SETTINGS.dev_mode?'ACTIVADO':'desactivado'}</span><button class="btn sm" onclick="toggleDev(${!SETTINGS.dev_mode})">${SETTINGS.dev_mode?'Desactivar':'Activar'}</button></div>
      <div class="hint">${esc(SETTINGS.note||"")}</div></div>
    <div class="card"><h3>Formularios cargados</h3><table><tr><th>Código</th><th>Nombre</th><th class="num">Secciones</th><th class="num">Preguntas</th></tr>${FORMS.map(f=>`<tr><td class="b">${esc(f.code)}</td><td class="sm">${esc(f.name)}</td><td class="num">${f.form_sections.length}</td><td class="num">${f.form_sections.reduce((a,s)=>a+s.questions.length,0)}</td></tr>`).join("")}</table><div class="hint">Los formularios se cargan con los SQL de «3 - Base de datos». Aquí solo se consultan.</div></div></div>`;
  },
};

/* ----- Ciclo: crear / editar ----- */
const CYCLE_TEMPLATES = {
  dic: { label:"Evaluación de diciembre · 360 por equipos", kind:"360", desc:"Cada persona se autoevalúa; Deal Team y Operations evalúan al Deal Team; todo el mundo evalúa a Operations; el resto de Nest y Operations evalúan a Nest; los equity partners evalúan a todo el mundo y a ellos nadie. El lead reviewer (asignado por administración) valora y escribe el resumen final. La persona solo ve ese resumen y sus gráficos agregados, cuando el lead pulsa «Mostrar resultados».",
         forms:{ self:"dic_self_lead", lead:"dic_self_lead", peer_deal:"dic_deal_peer", peer_operations:"dic_ops_peer", peer_nest:"dic_ops_peer", peer:"dic_ops_peer" },
         visibility:{ peers_attributed:false, reviewee_sees_peers:"aggregate", reviewee_sees_lead:true, anon_threshold:0, lead_after_peers:false, peers_see_self:false } },
  jun: { label:"Mid Term Feedback · junio (cascada)", kind:"cascade", desc:"Cada persona se autoevalúa y elige a 2-3 compañeros; el lead reviewer lo asigna administración. Compañeros y lead responden sin ver la autoevaluación; el lead la lee, junto con las respuestas de los compañeros, cuando ha enviado la suya y va a escribir el resumen. La persona solo ve el resumen del lead cuando este pulsa «Mostrar resultados».",
         forms:{ self:"jun_self", lead:"jun_lead", peer:"jun_peer" },
         visibility:{ peers_attributed:false, reviewee_sees_peers:"aggregate", reviewee_sees_lead:true, anon_threshold:0, lead_after_peers:true, peers_see_self:false, reviewee_picks:true } },
  custom: { label:"Personalizada", kind:"360", desc:"Configura formularios y visibilidad a mano en los ajustes avanzados.", forms:{}, visibility:{ peers_attributed:false, reviewee_sees_peers:"aggregate", reviewee_sees_lead:true, anon_threshold:0, lead_after_peers:false, peers_see_self:false } },
};
function fname(id){ const f = byId(FORMS, id); return f ? f.name.replace("Performance Evaluation (diciembre) · ","Diciembre · ").replace("Performance Evaluation (junio) · ","Junio · ") : "(sin cuestionario)"; }
function readCycleForm(){
  const g = x => document.getElementById(x);
  const mode = (document.querySelector('input[name="vmode"]:checked')||{}).value || "aggregate";
  return {
    name:g("cy_name").value.trim(), kind:g("cy_kind").value, period_label:g("cy_period").value.trim()||null, opens_at:g("cy_open").value||null, closes_at:g("cy_close").value||null,
    forms:{ self:g("cf_self").value, lead:g("cf_lead").value, peer_deal:g("cf_peer_deal").value, peer_operations:g("cf_peer_operations").value, peer_nest:g("cf_peer_nest").value },
    visibility:{ reviewee_sees_peers:mode, peers_attributed:mode==="full", anon_threshold:parseInt(g("v_thr").value)||3, reviewee_sees_lead:g("v_lead").checked, peers_see_self:g("v_pself").checked, lead_after_peers:g("v_lap").checked, reviewee_picks:g("v_picks").checked }
  };
}
function updateSummary(){
  const el = document.getElementById("cy_summary"); if(!el) return;
  const f = readCycleForm(), v = f.visibility, fo = f.forms;
  document.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.querySelector("input").checked));
  const peersForms = [["Deal Team",fo.peer_deal],["Operations",fo.peer_operations],["Nest",fo.peer_nest]];
  const same = peersForms.every(x => x[1] === peersForms[0][1]);
  const li = [];
  li.push(`Cada persona rellena su <b>autoevaluación</b> (${esc(fname(fo.self))})${v.reviewee_picks ? " y <b>elige</b> a 2-3 compañeros y a su lead reviewer" : ""}.`);
  li.push(`Sus <b>compañeros</b> la evalúan ${same ? `con el cuestionario ${esc(fname(fo.peer_deal))}` : `con un cuestionario según su equipo: ${peersForms.map(x=>`${x[0]} → ${esc(fname(x[1]))}`).join("; ")}`}.${v.peers_see_self ? " Antes de opinar leen su autoevaluación." : ""}`);
  li.push(`Su <b>lead reviewer</b> escribe la valoración final (${esc(fname(fo.lead))})${v.lead_after_peers ? ", y solo puede enviarla cuando todos los compañeros han enviado la suya" : ""}.`);
  const peersTxt = v.reviewee_sees_peers === "none" ? "nada de lo que han dicho sus compañeros"
    : v.reviewee_sees_peers === "full" ? "todo lo que han escrito sus compañeros, con sus nombres"
    : `la media de las notas de sus compañeros y sus comentarios sin nombres (solo si han respondido al menos ${v.anon_threshold})`;
  li.push(`Al <b>publicar</b>, la persona verá su autoevaluación, ${peersTxt}${v.reviewee_sees_lead ? " y la valoración de su lead reviewer" : ""}.`);
  el.innerHTML = `<div class="t">Así funcionará esta review</div><ol>${li.map(x=>`<li>${x}</li>`).join("")}</ol>`;
}
function applyTemplate(key){
  const t = CYCLE_TEMPLATES[key]; if(!t) return;
  const g = x => document.getElementById(x);
  const fid = code => (FORMS.find(f=>f.code===code)||{}).id || "";
  g("cy_kind").value = t.kind;
  g("cf_self").value = fid(t.forms.self||""); g("cf_lead").value = fid(t.forms.lead||"");

async function saveCycle(id){

  if(!row.name) return toast("Pon un nombre al ciclo", true);
  let cid = id;
  if(id){ const { error } = await sb.from("cycles").update(row).eq("id", id); if(error) return err(error,"No se pudo guardar"); }
  else { const { data, error } = await sb.from("cycles").insert(row).select().single(); if(error) return err(error,"No se pudo crear"); cid = data.id; }
  await sb.from("cycle_forms").delete().eq("cycle_id", cid);
  const rows = [];
  const add = (role, team, v) => { if(v) rows.push({cycle_id:cid, role, team, form_id:v}); };

  add("peer","deal",f.forms.peer_deal); add("peer","operations",f.forms.peer_operations); add("peer","nest",f.forms.peer_nest);

// Regla de diciembre, según Hugo (04-sep-2026): Deal Team y Operations evalúan al Deal Team; todo el mundo (incluido Nest) evalúa a Operations.
// A Nest lo evalúan el resto de Nest y Operations (confirmado por Hugo, 04-sep-2026). Los socios no se incluyen como evaluados.
async function prefill360(cycleId){
  const c = byId(CYCLES,cycleId); const act = PEOPLE.filter(p=>p.active); const rows = [];
  for(const rv of act){
    if(!isEvaluated(rv)) continue;
    const sf = roleForm(c,"self",rv); if(sf) rows.push({cycle_id:cycleId, reviewee_id:rv.id, reviewer_id:rv.id, role:"self", form_id:sf});
    const pf = roleForm(c,"peer",rv); if(!pf) continue;
    const equity = r => r.is_partner && !isEvaluated(r);   // equity partners: evalúan a todo el mundo, a ellos nadie
    const reviewers = act.filter(r => r.id!==rv.id && (equity(r) || (rv.team==='deal' ? ['deal','operations'].includes(r.team) : rv.team==='operations' ? true : rv.team==='nest' ? ['nest','operations'].includes(r.team) : false)));
    for(const r of reviewers) rows.push({cycle_id:cycleId, reviewee_id:rv.id, reviewer_id:r.id, role:"peer", form_id:pf});
  }
  if(!rows.length) return toast("Faltan formularios en el ciclo", true);
  window.PENDING_ROWS = rows;
  const nSelf = rows.filter(r=>r.role==='self').length, nPeer = rows.length - nSelf;
  openModal(`<h2>Rellenar con la regla de diciembre</h2>
    <p class="sm">Se crearán <b>${nSelf}</b> autoevaluaciones y <b>${nPeer}</b> reviews de compañeros:</p>
    <ul class="sm" style="margin:6px 0 10px;padding-left:18px;line-height:1.7"><li>A cada persona del <b>Deal Team</b> la evalúan Deal Team y Operations.</li><li>A cada persona de <b>Operations</b> la evalúa todo el mundo: Deal Team, Operations y Nest.</li><li>Los <b>equity partners</b> evalúan a todo el mundo; a ellos no los evalúa nadie.</li><li>A cada persona de <b>Nest</b> la evalúan el resto de Nest y Operations.</li><li>Solo entran como evaluadas las personas marcadas «se le evalúa» en Personas (los socios no, salvo los que se indique). El lead reviewer se asigna aparte («Lead reviewer por equipo» o uno a uno).</li></ul>
    <p class="xs mut">Las asignaciones que ya existan no se duplican. Después puedes quitar o añadir compañeros a mano.</p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="createPending()"><i class="ti ti-wand"></i> Crear ${rows.length} asignaciones</button></div>`);
}

async function applyBulkLeads(cycleId){
  const c = byId(CYCLES, cycleId); const over = document.getElementById("bl_over").checked;
  const picks = { deal:document.getElementById("bl_deal").value, operations:document.getElementById("bl_operations").value, nest:document.getElementById("bl_nest").value };
  closeModal();
  const { data:existing } = await sb.from("assignments").select("id,reviewee_id,status").eq("cycle_id", cycleId).eq("role","lead");
  const rows = [], toDelete = [];
  for(const rv of PEOPLE.filter(p=>p.active && isEvaluated(p))){
    const lead = picks[rv.team]; if(!lead || lead === rv.id) continue;
    const fid = roleForm(c, "lead", rv); if(!fid){ toast("El ciclo no tiene cuestionario de lead reviewer", true); return; }
    const cur = (existing||[]).find(a => a.reviewee_id === rv.id);
    if(cur){ if(!over || cur.status === "submitted") continue; toDelete.push(cur.id); }
    rows.push({ cycle_id:cycleId, reviewee_id:rv.id, reviewer_id:lead, role:"lead", form_id:fid });
  }
  if(!rows.length) return toast("No había nada que asignar");
  progress(true);
  if(toDelete.length){ const { error } = await sb.from("assignments").delete().in("id", toDelete); if(error){ progress(false); return err(error,"Lead reviewers"); } }
  const { error } = await sb.from("assignments").upsert(rows, { onConflict:"cycle_id,reviewee_id,reviewer_id,role", ignoreDuplicates:true });
  progress(false);
  if(error) return err(error, "Lead reviewers");
  toast(`Lead reviewer asignado a ${rows.length} persona(s)`); render();
}

    const list = PEOPLE.filter(p => p.active && p.team===t && p.id!==revieweeId).sort(bySeniority);
    if(!list.length) return "";
    return `<div class="grp">${l} <a href="#" class="xs" style="margin-left:8px;font-weight:600" onclick="document.querySelectorAll('#pl input[data-team=${t}]:not(:disabled)').forEach(i=>i.checked=true);peersCount();return false">todos</a> <a href="#" class="xs" style="font-weight:600" onclick="document.querySelectorAll('#pl input[data-team=${t}]:not(:disabled)').forEach(i=>i.checked=false);peersCount();return false">ninguno</a></div>` +
      list.map(p => { const a = has(p.id); const locked = a && a.status !== 'pending'; return `<div class="chk"><input type="checkbox" value="${p.id}" data-team="${t}" ${a?"checked":""} ${locked?"disabled":""} onchange="peersCount()"><label>${esc(fullName(p))} <span class="xs mut">· ${esc(p.position||"")}</span>${locked?` <span class="pill ${a.status==='submitted'?'ok':'warn'}" style="margin-left:6px">${STATUS_LABEL[a.status]}</span>`:""}</label></div>`; }).join("");
  }).join("");
  window.PEERS_EDIT = { cycleId, revieweeId };
  openModal(`<h2>Compañeros que evalúan a ${esc(fullName(rv))}</h2><p class="sm mut">Marca o desmarca. Las reviews ya empezadas o enviadas no se pueden quitar.</p>
    <div class="sm-search" style="margin:10px 0 6px;display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--cell)"><i class="ti ti-search" style="color:var(--muted)"></i><input type="text" placeholder="Buscar persona…" style="border:none;background:transparent;padding:2px 0;box-shadow:none" oninput="document.querySelectorAll('#pl .chk').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'})"></div>
    <div class="pl" id="pl">${groups}</div>
    <div class="row" style="justify-content:space-between;margin-top:12px"><span class="sm mut" id="plCount"></span><div class="row" style="gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="savePeers()"><i class="ti ti-check"></i> Guardar</button></div></div>`);
  peersCount();
}
function peersCount(){ const n = document.querySelectorAll("#pl input:checked").length; const el = document.getElementById("plCount"); if(el) el.textContent = `${n} compañero${n===1?'':'s'} seleccionado${n===1?'':'s'}`; }
async function savePeers(){
  const { cycleId, revieweeId } = window.PEERS_EDIT; const c = byId(CYCLES, cycleId), rv = person(revieweeId);
  const checked = new Set([...document.querySelectorAll("#pl input:checked")].map(i => i.value));
  const cur = (window.ASG_CACHE||[]).filter(a => a.cycle_id===cycleId && a.reviewee_id===revieweeId && a.role==='peer');
  const toDelete = cur.filter(a => !checked.has(a.reviewer_id) && a.status==='pending').map(a => a.id);
  const existing = new Set(cur.map(a => a.reviewer_id));
  const fid = roleForm(c, "peer", rv);
  const toAdd = [...checked].filter(id => !existing.has(id)).map(id => ({ cycle_id:cycleId, reviewee_id:revieweeId, reviewer_id:id, role:"peer", form_id:fid }));
  if(toAdd.length && !fid) return toast("El ciclo no tiene cuestionario de compañeros para este equipo", true);
  closeModal(); progress(true);
  if(toDelete.length){ const { error } = await sb.from("assignments").delete().in("id", toDelete); if(error){ progress(false); return err(error,"Compañeros"); } }
  if(toAdd.length){ const { error } = await sb.from("assignments").upsert(toAdd, { onConflict:"cycle_id,reviewee_id,reviewer_id,role", ignoreDuplicates:true }); if(error){ progress(false); return err(error,"Compañeros"); } }
  progress(false); toast(`Compañeros de ${rv.first_name} actualizados`); render();
}
// Deshacer: quitar todas las asignaciones aún no empezadas
async function clearPending(cycleId){
  const { data } = await sb.from("assignments").select("id").eq("cycle_id", cycleId).eq("status","pending");
  const n = (data||[]).length; if(!n) return toast("No hay asignaciones pendientes que quitar");
  window.CLEAR_CYCLE = cycleId;
  openModal(`<h2>Quitar asignaciones pendientes</h2><p class="sm">Se quitarán <b>${n}</b> asignaciones que nadie ha empezado todavía. Las que están en borrador o enviadas no se tocan.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--bad);color:#fff;border-color:var(--bad)" onclick="doClearPending()">Quitar</button></div>`);
}
async function doClearPending(){
  closeModal(); progress(true);
  const { error } = await sb.from("assignments").delete().eq("cycle_id", window.CLEAR_CYCLE).eq("status","pending");
  progress(false);
  if(error) return err(error, "No se pudo quitar"); toast("Asignaciones pendientes quitadas"); render();
}
async function exportAssign(cycleId){
  const { data } = await sb.from("assignments").select(ASSIGN_SELECT).eq("cycle_id", cycleId);
  const lines = ["evaluado;equipo;papel;evaluador;estado;enviada"].concat((data||[]).map(a=>[fullName(a.reviewee),TEAM_LABEL[a.reviewee.team]||"",ROLE_LABEL[a.role],fullName(a.reviewer),STATUS_LABEL[a.status],a.submitted_at||""].join(";")));
  const blob = new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"}); const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href=u; a.download="asignaciones.csv"; a.click(); URL.revokeObjectURL(u);
}

/* ----- Personas ----- */
function editPerson(id){
  const p = id ? PEOPLE.find(x=>x.id===id) || {} : { first_name:"", last_name:"", email:"", position:"", team:"", start_date:"", is_partner:false, is_admin:false, active:true, sees_all:false, is_evaluated:true, is_hr_admin:false };
  openModal(`<h2>${id?"Editar persona":"Nueva persona"}</h2>
   <div class="two" style="margin-top:12px"><div><label class="xs mut">Nombre</label><input type="text" id="p_fn" value="${esc(p.first_name||"")}"></div><div><label class="xs mut">Apellidos</label><input type="text" id="p_ln" value="${esc(p.last_name||"")}"></div>
    <div><label class="xs mut">Correo (login Microsoft)</label><input type="text" id="p_em" value="${esc(p.email||"")}"></div><div><label class="xs mut">Puesto</label><input type="text" id="p_pos" value="${esc(p.position||"")}"></div>
    <div><label class="xs mut">Equipo</label><select class="inp" id="p_team"><option value="">—</option>${Object.entries(TEAM_LABEL).map(([k,l])=>`<option value="${k}" ${p.team===k?"selected":""}>${l}</option>`).join("")}</select></div><div><label class="xs mut">Fecha de inicio</label><input type="date" id="p_sd" value="${p.start_date||""}"></div></div>
   <div class="chk"><input type="checkbox" id="p_partner" ${p.is_partner?"checked":""}><label>Socio <span class="xs mut">(etiqueta y peso extra en la media ponderada)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_sees" ${p.sees_all?"checked":""}><label>Ve todas las reviews de la firma <span class="xs mut">(Todas las reviews, expedientes, auditoría)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_eval" ${p.is_evaluated!==false?"checked":""}><label>Se le evalúa <span class="xs mut">(entra como persona evaluada en los ciclos)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_hr" ${p.is_hr_admin?"checked":""} onchange="if(this.checked) document.getElementById('p_sees').checked = true"><label>Admin de RRHH <span class="xs mut">(ve las respuestas y resúmenes de todo el mundo)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_admin" ${p.is_admin?"checked":""}><label>Administra la app <span class="xs mut">(ciclos, asignaciones y personas; no ve respuestas)</span></label></div>
   <div class="chk"><input type="checkbox" id="p_active" ${p.active!==false?"checked":""}><label>Activa (puede entrar y recibe asignaciones)</label></div>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="savePerson(${id?`'${id}'`:"null"})">Guardar</button></div>`);
}
async function savePerson(id){
  const g = x => document.getElementById(x);
  const row = { first_name:g("p_fn").value.trim(), last_name:g("p_ln").value.trim(), email:g("p_em").value.trim().toLowerCase(), position:g("p_pos").value.trim()||null, team:g("p_team").value||null, start_date:g("p_sd").value||null, is_partner:g("p_partner").checked, sees_all:g("p_sees").checked || g("p_hr").checked, is_hr_admin:g("p_hr").checked, is_evaluated:g("p_eval").checked, is_admin:g("p_admin").checked, active:g("p_active").checked };
  if(!row.first_name || !row.email) return toast("Nombre y correo son obligatorios", true);
  const r = id ? await sb.from("people").update(row).eq("id", id) : await sb.from("people").insert(row);
  if(r.error) return err(r.error,"No se pudo guardar"); closeModal(); toast("Guardado"); await loadCatalog(); render();
}
async function toggleDev(on){
  const { error } = await sb.from("app_settings").update({ dev_mode:on }).eq("id",1); if(error) return err(error,"Ajustes");
  toast(on ? "Modo sin login ACTIVADO" : "Modo sin login desactivado"); await loadCatalog(); render();
  if(!on && DEV_MODE) toast("Aviso: esta versión sin login dejará de funcionar al recargar", true);
}
